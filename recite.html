<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="知识清单">
<meta name="theme-color" content="#b7791f">
<title>知识清单背诵 · 七年级上</title>
<style>
:root{
  --bg:#f8f5ef; --card:#ffffff; --ink:#2a2418; --sub:#7a6f5c;
  --brand:#b7791f; --brand2:#d69e2e; --ok:#18a06a; --line:#ece4d6;
  --shadow:0 8px 30px rgba(80,60,20,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 30px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{text-decoration:none;font-size:13px;font-weight:800;padding:5px 11px;border-radius:20px;
  flex-shrink:0;color:var(--brand);background:#f6ecd9}
.top h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;font-weight:800;flex:1;min-width:0}
.badge{font-size:12px;color:var(--sub);background:#f6ecd9;padding:4px 10px;border-radius:20px;font-weight:700;white-space:nowrap}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.label{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s;user-select:none;font-family:inherit}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(183,121,31,.28)}
.chip small{font-weight:700;opacity:.8;margin-left:3px}
.units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.units .chip{min-width:0;padding:8px 4px;text-align:center;line-height:1.3}
.units .chip span{display:block;font-size:10.5px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:7px;background:#f1e9da;border-radius:5px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand2),var(--brand));border-radius:5px;transition:.3s}
.ptxt{font-size:12px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none}
.sw input{width:18px;height:18px;accent-color:var(--brand)}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  padding:12px 12px 12px 14px;margin-bottom:9px;border:1.5px solid transparent;cursor:pointer}
.item.done{border-color:#bfe6d2;background:#f6fcf9}
.item .num{font-size:11px;color:#b6a98f;font-weight:800;min-width:20px;padding-top:3px;font-variant-numeric:tabular-nums}
.item .body{flex:1;min-width:0}
.en{font-size:16.5px;font-weight:800;line-height:1.45;word-break:break-word}
.s .en{font-size:15.5px;font-weight:700}
.pos{font-size:12.5px;color:var(--brand);font-weight:800;margin-left:5px}
.zh{font-size:14px;color:var(--sub);line-height:1.6;margin-top:3px;word-break:break-word}
.note .zh{color:var(--ink);font-weight:700;margin-top:0}
.mask{background:#efe6d4;color:transparent;border-radius:6px;user-select:none;position:relative}
.mask::after{content:'点一下看答案';position:absolute;left:8px;top:50%;transform:translateY(-50%);
  color:#a8987a;font-size:12px;font-weight:700;white-space:nowrap}
.btns{display:flex;gap:6px;flex-shrink:0}
.ib{width:36px;height:36px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:var(--sub);font-weight:800}
.ib.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{font-size:14px;color:var(--sub);text-align:center;padding:26px 10px;line-height:1.7}
.tools{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.tools button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;
  font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit}
.foot{text-align:center;font-size:11.5px;color:var(--sub);margin-top:14px;line-height:1.7}
@media (max-width:380px){.units{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./index.html">‹ 首页</a>
    <h1>📜 知识清单 · 七年级上</h1>
    <span class="badge" id="allBadge"></span>
  </div>

  <div class="card">
    <div class="label">选单元</div>
    <div class="units" id="units"></div>
    <div class="prog"><i id="bar"></i></div>
    <div class="ptxt"><span id="ptxt"></span><span id="utitle"></span></div>
  </div>

  <div class="card">
    <div class="label">背什么</div>
    <div class="chips" id="secs"></div>
    <div class="label" style="margin-top:12px">怎么背</div>
    <div class="chips" id="modes"></div>
    <div class="row2">
      <label class="sw"><input type="checkbox" id="only"> 只看还没背会的</label>
    </div>
  </div>

  <div id="list"></div>

  <div class="tools">
    <button onclick="revealAll()">👀 全部翻开</button>
    <button onclick="resetUnit()">↺ 本栏重新开始</button>
  </div>
  <div class="foot">沪教牛津版 · 7A 知识清单（背诵版）· 8 个单元 · 词汇拓展 / 重点短语 / 重点句型<br>
    遮住一边自己默背，点卡片看答案；背会了点 ✓，进度自动保存在本机</div>
</div>

":"不可能的"},{"en":"possible","pos":"adj.","zh":"可能的"},{"en":"possibly","pos":"adv.","zh":"可能，或许"},{"en":"possibility","pos":"n.","zh":"可能，可能性"},{"en":"explain","pos":"v.","zh":"解释；说明"},{"en":"explanation","pos":"n.","zh":"解释，说明"},{"en":"soft","pos":"adj.","zh":"软的"},{"en":"softly","pos":"adv.","zh":"轻声地；温柔地"},{"en":"include","pos":"v.","zh":"包括；包含"},{"en":"including","pos":"prep.","zh":"包括；包含"},{"en":"produce","pos":"v.","zh":"生产；制造"},{"en":"product","pos":"n.","zh":"产品"},{"en":"production","pos":"n.","zh":"生产，制造"},{"en":"attract","pos":"v.","zh":"吸引；招引"},{"en":"attractive","pos":"adj.","zh":"吸引人的，有吸引力的"},{"en":"attraction","pos":"n.","zh":"有吸引力的事；吸引力"},{"en":"unlock","pos":"v.","zh":"发现；揭示"},{"en":"lock","pos":"v.","zh":"锁住；加密"},{"en":"sticker","pos":"n.","zh":"贴纸"},{"en":"stick","pos":"v.","zh":"粘贴"},{"en":"add","pos":"v.","zh":"增加；添加"},{"en":"addition","pos":"n.","zh":"加法；添加物"},{"en":"","zh":"im- 或 in- 前缀构成反义词：impatient; impolite; incorrect; indirect"}],"p":[{"en":"add… to…","zh":"把… 添加到…"},{"en":"soft drink","zh":"软饮料"},{"en":"a waste of time","zh":"浪费时间"},{"en":"pocket money","zh":"零花钱"},{"en":"all over the world","zh":"全世界"},{"en":"different kinds of","zh":"不同种类的"},{"en":"key rings","zh":"钥匙圈"},{"en":"develop a hobby","zh":"培养一个爱好"},{"en":"wear white gloves","zh":"戴上白手套"},{"en":"the Palace Museum","zh":"故宫博物院"},{"en":"thanks to","zh":"多亏…"},{"en":"become interested in","zh":"对… 感兴趣"},{"en":"learn about","zh":"了解"},{"en":"more and more","zh":"越来越多"},{"en":"be similar to…","zh":"与某物相似；与… 相似"},{"en":"be different from","zh":"与… 不同"},{"en":"get curious about","zh":"对… 感到好奇"},{"en":"build up a collection","zh":"积累一种收藏品"},{"en":"three of them","zh":"他们当中的三人"},{"en":"the number of items","zh":"条目的数量"},{"en":"the reason for sth/doing… …","zh":"的原因"},{"en":"decide to do…","zh":"决定做…"},{"en":"in different shapes","zh":"形状各异"},{"en":"up to","zh":"达到；至多有"}],"s":[{"en":"Some people play sports and others build models, but my hobby is collecting stamps.","zh":"有些人做运动，有些人做模型，但我的爱好是集邮。"},{"en":"Some of them are valuable, so he always handles them with great care.","zh":"有些东西很贵重，所以他总是小心翼翼地拿着。"},{"en":"It may seem impossible, but they built them without using a single nail!","zh":"这似乎是不可能的，但他们没有使用一颗钉子就建造了它们！"},{"en":"Does collecting things take a lot of money or time?","zh":"收集东西要花很多钱或时间吗？"},{"en":"One day, my father came back from a trip to Europe, and he gave me two bars of chocolate.","zh":"有一天，我父亲从欧洲旅行回来，他给了我两块巧克力。"},{"en":"Finally, they make me think of happy moments in life together with family and friends.","zh":"最后，他们让我想起生活中与家人和朋友在一起的快乐时刻。"},{"en":"It's like a treasure that unlocked a secret code.","zh":"它就像一个解锁了密码的宝藏。"}]}];
const SECS=[['w','📘 词汇拓展'],['p','🔗 重点短语'],['s','💬 重点句型']];
const MODES=[['all','全部显示'],['hideZh','遮住中文'],['hideEn','遮住英文']];

let LS={u:1,sec:'w',mode:'hideZh',only:false,done:{}};
try{Object.assign(LS,JSON.parse(localStorage.getItem('recite7A')||'{}'));}catch(e){}
if(!UNITS.some(x=>x.u===LS.u))LS.u=1;
function save(){try{localStorage.setItem('recite7A',JSON.stringify(LS));}catch(e){}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function key(u,sec,i){return u+'-'+sec+'-'+i;}
function unit(){return UNITS.find(x=>x.u===LS.u);}
let revealed={};

/* ============ 发音（与背单词页同一套，兼容鸿蒙/华为） ============ */
let ENVOICE=null;
function loadVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  if(!vs.length)return;
  const good=['Samantha','Alex','Ava','Allison','Daniel','Karen','Moira','Serena','Google US English','Google UK English Female','Google UK English Male','Microsoft Zira','Microsoft Aria','Microsoft David','Microsoft Guy'];
  ENVOICE = vs.find(v=>/^en[-_]?US/i.test(v.lang)&&good.some(g=>v.name.includes(g)))
        || vs.find(v=>/^en[-_]?GB/i.test(v.lang)&&good.some(g=>v.name.includes(g)))
        || vs.find(v=>/^en[-_]?US/i.test(v.lang)) || vs.find(v=>/^en[-_]?GB/i.test(v.lang))
        || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis'in window){ loadVoice(); speechSynthesis.onvoiceschanged=loadVoice; }
if(/HarmonyOS|HUAWEI|HMSCore|HuaweiBrowser/i.test(navigator.userAgent))window.__noTTS=true;
function ttsFallback(txt){   /* 没有本地英文语音引擎时改用有道在线发音 */
  try{
    if(window.__ttsA){window.__ttsA.pause();}
    var a=new Audio('https://dict.youdao.com/dictvoice?type=2&audio='+encodeURIComponent(txt));
    window.__ttsA=a; a.play().catch(function(){});
  }catch(e){}
}
function speak(txt){
  txt=txt.replace(/sth\./g,'something').replace(/sb\./g,'somebody').replace(/…/g,' ');
  if(window.__noTTS||!('speechSynthesis'in window)){ttsFallback(txt);return;}
  speechSynthesis.cancel();
  if(!ENVOICE)loadVoice();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='en-US'; if(ENVOICE)u.voice=ENVOICE;
  u.rate=0.85; u.pitch=1;
  let fired=false;
  u.onstart=function(){fired=true;};
  u.onerror=function(){if(!fired){fired=true;window.__noTTS=true;ttsFallback(txt);}};
  speechSynthesis.speak(u);
  setTimeout(function(){if(!fired){window.__noTTS=true;speechSynthesis.cancel();ttsFallback(txt);}},900);
}

function countDone(u,sec){
  const secs=sec?[sec]:['w','p','s'];
  let d=0,n=0;
  secs.forEach(s=>u[s].forEach((x,i)=>{n++;if(LS.done[key(u.u,s,i)])d++;}));
  return [d,n];
}

function renderTop(){
  let D=0,N=0;
  document.getElementById('units').innerHTML=UNITS.map(u=>{
    const [d,n]=countDone(u);D+=d;N+=n;
    return '<button class="chip'+(u.u===LS.u?' on':'')+'" onclick="pickUnit('+u.u+')">Unit '+u.u+
      (d===n?' ✅':'')+'<span>'+esc(u.t)+'</span></button>';
  }).join('');
  document.getElementById('allBadge').textContent='背会 '+D+'/'+N;
  const u=unit(),[d,n]=countDone(u);
  document.getElementById('bar').style.width=(n?d/n*100:0)+'%';
  document.getElementById('ptxt').textContent='本单元背会 '+d+' / '+n;
  document.getElementById('utitle').textContent='Unit '+u.u+' '+u.t;
  document.getElementById('secs').innerHTML=SECS.map(([k,t])=>{
    const [sd,sn]=countDone(u,k);
    return '<button class="chip'+(k===LS.sec?' on':'')+'" onclick="pickSec(\''+k+'\')">'+t+'<small>'+sd+'/'+sn+'</small></button>';
  }).join('');
  document.getElementById('modes').innerHTML=MODES.map(([k,t])=>
    '<button class="chip'+(k===LS.mode?' on':'')+'" onclick="pickMode(\''+k+'\')">'+t+'</button>').join('');
  document.getElementById('only').checked=!!LS.only;
}

function renderList(){
  const u=unit(),arr=u[LS.sec];
  let html='';
  arr.forEach((x,i)=>{
    const k=key(u.u,LS.sec,i),done=!!LS.done[k];
    if(LS.only&&done)return;
    const note=!x.en, open=revealed[k]||LS.mode==='all'||note;
    const mEn=!open&&LS.mode==='hideEn', mZh=!open&&LS.mode==='hideZh';
    const en=note?'':'<div class="en'+(mEn?' mask':'')+'">'+esc(x.en)+(x.pos?'<span class="pos">'+esc(x.pos)+'</span>':'')+'</div>';
    const zh='<div class="zh'+(mZh?' mask':'')+'">'+esc(x.zh)+'</div>';
    html+='<div class="item '+LS.sec+(note?' note':'')+(done?' done':'')+'" onclick="flip(\''+k+'\')">'+
      '<span class="num">'+(i+1)+'</span><div class="body">'+(LS.mode==='hideEn'?zh+en:en+zh)+'</div>'+
      '<div class="btns">'+(note?'':'<button class="ib" title="朗读" onclick="event.stopPropagation();say('+i+')">🔊</button>')+
      '<button class="ib'+(done?' ok':'')+'" title="背会了" onclick="event.stopPropagation();toggle(\''+k+'\')">✓</button></div></div>';
  });
  if(!html)html='<div class="empty">🎉 这一栏全部背会了！<br>换一栏继续，或取消「只看还没背会的」复习一遍</div>';
  document.getElementById('list').innerHTML=html;
}
function render(){renderTop();renderList();}

function pickUnit(n){LS.u=n;revealed={};save();render();window.scrollTo({top:0,behavior:'smooth'});}
function pickSec(k){LS.sec=k;revealed={};save();render();}
function pickMode(k){LS.mode=k;revealed={};save();render();}
document.getElementById('only').onchange=function(){LS.only=this.checked;save();render();};
function flip(k){revealed[k]=!revealed[k];renderList();}
function toggle(k){if(LS.done[k])delete LS.done[k];else LS.done[k]=1;save();render();}
function say(i){speak(unit()[LS.sec][i].en);}
function revealAll(){const u=unit();u[LS.sec].forEach((x,i)=>revealed[key(u.u,LS.sec,i)]=true);renderList();}
function resetUnit(){
  const u=unit(),name=SECS.find(s=>s[0]===LS.sec)[1];
  if(!confirm('把 Unit '+u.u+' 「'+name+'」的背会标记全部清掉，重新开始？'))return;
  u[LS.sec].forEach((x,i)=>delete LS.done[key(u.u,LS.sec,i)]);
  revealed={};save();render();
}
render();
</script>
