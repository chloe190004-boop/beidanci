<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学习练习">
<meta name="theme-color" content="#2b3a45">
<title>学习小工具 · 英语 & 数学</title>
<style>
:root{
  --bg:#f3f6f8; --card:#fff; --ink:#18242c; --sub:#5f7178; --line:#e5ecef;
  --en:#3b6ef0; --en2:#5b8def; --ma:#0E7181; --ma2:#12909f;
  --shadow:0 10px 34px rgba(20,50,70,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
  padding:env(safe-area-inset-top) 0 30px;display:flex;align-items:center}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px;width:100%}
header{text-align:center;margin-bottom:26px}
h1{font-size:26px;margin:0 0 6px;font-weight:800;letter-spacing:.5px}
header p{margin:0;font-size:14px;color:var(--sub)}
.app{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:20px;
  box-shadow:var(--shadow);padding:20px 18px;margin-bottom:16px;text-decoration:none;color:inherit;
  border:2px solid transparent;transition:.18s;position:relative;overflow:hidden}
.app:active{transform:scale(.985)}
.app::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px}
.app-en::before{background:linear-gradient(180deg,var(--en2),var(--en))}
.app-ma::before{background:linear-gradient(180deg,var(--ma2),var(--ma))}
.app-en:hover{border-color:var(--en)}
.app-ma:hover{border-color:var(--ma)}
.ic{font-size:42px;line-height:1;flex-shrink:0;width:56px;text-align:center}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:19px;font-weight:800;margin-bottom:3px}
.tx span{display:block;font-size:12.5px;color:var(--sub);font-weight:700}
.tx small{display:block;font-size:11.5px;color:var(--sub);margin-top:5px;opacity:.85;line-height:1.5}
.go{font-size:24px;color:var(--sub);flex-shrink:0;font-weight:800}
.app-en .go{color:var(--en)} .app-ma .go{color:var(--ma)}
.tip{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:8px}
.tip b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:6px;font-weight:800}
.tip p{margin:0;font-size:12.5px;color:var(--sub);line-height:1.7}
.foot{text-align:center;font-size:11.5px;color:var(--sub);margin-top:16px;line-height:1.7}
@media (min-width:768px){
  .wrap{max-width:620px}
  h1{font-size:30px}
  .ic{font-size:50px;width:66px}
  .tx b{font-size:21px}
  .app{padding:24px 20px}
}

.namecard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;margin-bottom:18px}
.namecard .ni{font-size:24px;flex-shrink:0}
.namecard label{font-size:12px;color:var(--sub);font-weight:800;display:block;margin-bottom:2px}
.namecard input{border:none;outline:none;font-size:18px;font-weight:800;color:var(--ink);width:100%;background:transparent;font-family:inherit;padding:0}
.namecard input::placeholder{color:#b9c4c9;font-weight:700}

.newban{background:linear-gradient(135deg,#fff6e6,#ffe9c9);border:1px solid #f0d9a8;border-radius:14px;
  padding:12px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:9px;font-size:13.5px;
  font-weight:700;color:#7a5a1e;line-height:1.55}
.newban .x{margin-left:auto;background:#7a5a1e;color:#fff;border:none;border-radius:16px;padding:7px 13px;
  font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>学习小工具</h1>
    <p id="greet">选一个开始练</p>
  </header>

  <div class="newban" id="newban" style="display:none">
    <div><b>🎉 更新啦！</b><span id="newtext"></span></div>
    <button class="x" onclick="dismissNew()">知道了</button>
  </div>

  <div class="namecard">
    <span class="ni">🏅</span>
    <div style="flex:1">
      <label>挑战者</label>
      <input id="nm" placeholder="写上你的名字" maxlength="12" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <a class="app app-en" href="./english.html">
    <div class="ic">🦅</div>
    <div class="tx">
      <b>英语背单词</b>
      <span>七年级上 · 七年级下 · 八年级上 · 894 词</span>
      <small>翻卡自测 · 拼写测试 · 例句 · 真人发音 · 错词本</small>
    </div>
    <div class="go">›</div>
  </a>

  <a class="app app-ma" href="./math.html">
    <div class="ic">🔢</div>
    <div class="tx">
      <b>数学计算练习</b>
      <span>北师大 · 七年级全册</span>
      <small>有理数 · 分数小数 · 解方程 · 整式 · 答错自动讲思路</small>
    </div>
    <div class="go">›</div>
  </a>

  <div class="tip">
    <b>📱 想像 App 一样用</b>
    <p>用 Safari 打开这个页面 → 点分享按钮 → <b>添加到主屏幕</b>，桌面就会出现图标，以后点图标直接进。</p>
  </div>

  <div class="foot">练习进度自动保存在本机 · 无需注册登录<br><span id="ver"></span></div>
</div>
<script>
/* ===== 每次更新只改这两行 ===== */
var APP_VERSION='2026-07-25';
var UPDATE_NOTE='英语背单词加了「我的记录」（连续天数·正确率·进步曲线），入口页可以填名字了。';
/* ============================== */
(function(){
  var key='learnerName', nm=document.getElementById('nm'), greet=document.getElementById('greet');
  nm.value=(localStorage.getItem(key)||'');
  function upd(){var n=nm.value.trim();
    greet.textContent=n?('👋 你好，'+n+'，选一个开始练'):'选一个开始练';}
  upd();
  nm.addEventListener('input',function(){localStorage.setItem(key,nm.value.trim());upd();});

  document.getElementById('ver').textContent='版本 '+APP_VERSION;
  var seen=localStorage.getItem('seenVersion');
  if(seen!==APP_VERSION){
    document.getElementById('newtext').textContent=' '+UPDATE_NOTE;
    document.getElementById('newban').style.display='flex';
  }
})();
function dismissNew(){
  localStorage.setItem('seenVersion',APP_VERSION);
  document.getElementById('newban').style.display='none';
}
</script>
</body>
</html>
