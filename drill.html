{id:'zk-4',ord:1005,u:10,sec:'考向 4　开放性试题',tag:'能力',em:'🎭',mins:8,type:'read',
 psg:{meta:'考向 4 开放性试题：以开放性设问来考查学生对某一现象或事件的观点和看法　[2024 江苏南通中考]　语篇导读：本文介绍了中国传统戏剧形式之一——京剧',
  title:'Peking Opera',
  text:'Peking Opera, also called Jingju, listed by UNESCO as an intangible cultural heritage of humanity, is the most important one among hundreds of forms of local operas in China. It arose in the late 18th century and has a history of more than two hundred years.\n\nPeking Opera which combines singing, dancing, acrobatics and martial arts is sung and recited using Beijing dialect. The music of Peking Opera plays a key role in setting the pace of the show, creating a particular atmosphere, shaping the characters, and guiding the progress of the stories.\n\nThe art form has spread to many other countries and is enjoyed all around the world. Many children in China receive training in Peking Opera classes or practise Peking Opera. However, some artists still worry that Peking Opera is challenged by new forms of entertainment like many traditional art forms. They are trying to do something for Peking Opera.\n\nTao Qingmei, a traditional arts scholar at the Chinese Academy of Social Sciences, co-wrote the book The Marvelous Game with Guo Baochang. Guo, a film director, is a Peking Opera fan who has loved Jingju since he was a kid. It has been his long-time wish to write a book on Peking Opera.\n\nThe boy on the new book cover is Guo Baochang\'s grandson. Guo and his grandson are playing a game by dressing up in roles from the classic Peking Opera piece, Shuang Bei Deng, which is a comedy. Tao and Guo spent years writing the book because they wanted to make it easy and fun for everyone. They hope young people will get to know more about Peking Opera and fall in love with it.\n\nPeking Opera is regarded as an expression of the aesthetic ideal of opera in the traditional Chinese society and remains a widely recognized element of the country\'s cultural heritage. The stories performed in Peking Opera are often based on Chinese history, folklore and literary classics. They bring us a colourful world.'},
 qs:[
 {n:1,t:'How long is the history of Peking Opera?',
  hint:'用英文回答（四个词左右）',
  a:['more than two hundred years','more than 200 years'],
  ex:'根据第一段的"It arose in the late 18th century and has a history of more than two hundred years."可知，京剧距今已有两百多年的历史。'},
 {n:2,t:'Who wrote the book The Marvelous Game?',
  hint:'用英文回答（两个人名）',
  a:['tao qingmei and guo baochang'],
  ex:'根据第四段的"Tao Qingmei… co-wrote the book The Marvelous Game with Guo Baochang."可知这本书的作者是陶庆梅与郭宝昌。'},
 {n:3,t:'Which Peking Opera piece is on the cover of the book?',
  hint:'用英文回答（一个剧目名）',a:['shuang bei deng'],
  ex:'根据第五段的"Guo and his grandson are playing a game by dressing up in roles from the classic Peking Opera piece, Shuang Bei Deng, which is a comedy."可知新书封面上是京剧《双背凳》的片段。'},
 {n:4,essay:true,t:'What problem is Peking Opera facing?',
  hint:'用英文回答，一句话（写完对照参考答案）',
  model:'Peking Opera is challenged by new forms of entertainment like many traditional art forms.'},
 {n:5,essay:true,t:'What do you plan to do for traditional arts after reading this article?（请自拟一句话作答）',
  hint:'开放性试题，言之有理且无语法错误即可',
  model:'I will make some short videos and post them online to spread traditional arts to other countries.'}
]},

{id:'qm-cloze',ord:1101,u:11,sec:'期末综合测试 · 完形填空',tag:'能力',em:'⏱',mins:10,type:'read',
 psg:{meta:'期末综合测试（建议 60 分钟）第Ⅰ题　完形填空（10 分）　[2024 广东深圳期中]　语篇导读：本文主要讲述了孔子和他的学生颜回之间的故事，告诉了人们一个道理——眼见不一定为实',
  title:'Seeing is not always believing',
  text:'There are many interesting stories about Confucius and his students. Confucius is known as a famous educator all over the world as he provided the poor people with opportunities（机会）to be educated. He left many famous sayings, __1__ he might also make mistakes.\n\nOnce Confucius and his students passed through the States of Chen and Cai on their way to the State of Chu. They were not __2__ to continue heading for Chu, because the two states worried that Confucius might help the State of Chu become stronger. Confucius and his students didn\'t have any food for seven days and they were __3__. __4__ his student Yan Hui got some rice and cooked it. When the food was almost ready, Confucius saw Yan Hui taking out __5__ from the pot. Later, when Yan Hui invited his teacher to have the meal, Confucius said, "Food should be served to the old first, shouldn\'t it? Why did you taste the rice first?"\n\nYan Hui offered his __6__ politely, "I am afraid I am misunderstood. When I saw some dirt fall into the pot, I tried to pick __7__ the dirty rice and ate it up."\n\nConfucius sighed and said, "As an old saying goes, seeing is __8__, but it isn\'t always true. We can\'t __9__ our eyes too much. I feel really __10__ of my behaviour."'},
 qs:[
 {n:1,t:'第 (1) 空',o:['and','but','so','although'],r:1,
  ex:'句意为：他留下了很多名言，但是他可能也会犯错。设空前后内容之间为转折关系，故用 but。'},
 {n:2,t:'第 (2) 空',o:['obeyed','allowed','stopped','avoided'],r:1,
  ex:'根据 because the two states worried that Confucius might help the State of Chu become stronger 可知，孔子不被允许继续前进。知识拓展：sb be allowed to do sth 某人被允许做某事｜allow sb to do sth 允许某人做某事'},
 {n:3,t:'第 (3) 空',o:['angry','interested','hungry','pleased'],r:2,
  ex:"根据 Confucius and his students didn't have any food for seven days 可知，孔子和他的学生很饿。"},
 {n:4,t:'第 (4) 空',o:['Suddenly','Exactly','Probably','Luckily'],r:3,
  ex:'句意为：幸运的是，他的学生颜回得到了一些米，把它们煮了。根据上文可知，他们已经七天没吃东西了，因此颜回能得到些米对他们来说是件幸运的事情。'},
 {n:5,t:'第 (5) 空',o:['everything','something','anything','nothing'],r:1,
  ex:'根据下文可知，孔子看见颜回从锅里拿出了某样东西，设空位于肯定句中，故用 something。'},
 {n:6,t:'第 (6) 空',o:['explanation','comment','praise','situation'],r:0,
  ex:'句意为：颜回礼貌地给出了自己的解释……根据下文"I am afraid I am misunderstood."可知，此处指解释。'},
 {n:7,t:'第 (7) 空',o:['in','on','out','with'],r:2,
  ex:'根据"When I saw some dirt fall into the pot"可知，此处指把脏了的米挑出来，pick out 意为"挑出"。'},
 {n:8,t:'第 (8) 空',o:['believing','sharing','deciding','solving'],r:0,
  ex:'"Seeing is believing."意为"眼见为实"，是一句谚语，符合语境。'},
 {n:9,t:'第 (9) 空',o:['look after','depend on','care about','help with'],r:1,
  ex:'句意为：我们不能太依赖我们的眼睛。depend on 意为"依赖"，符合语境。'},
 {n:10,t:'第 (10) 空',o:['proud','sure','afraid','ashamed'],r:3,
  ex:'根据上文孔子误会了颜回可知，此处表示他对自己的行为感到羞愧。be ashamed of 意为"对……感到羞愧"。'}
]},

{id:'qm-readA',ord:1102,u:11,sec:'期末综合测试 · 阅读理解 A',tag:'能力',em:'🐡',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解（26 分）A 篇　语篇导读：本文通过三人吃河豚中毒的事件介绍了河豚这种人们喜欢吃但是十分危险的鱼类',
  title:'Fugu—the dangerous fish',
  text:"When three men in California were taken to a hospital with strange symptoms（症状）, the hospital doctors thought the men had been poisoned（毒害）. They felt dizzy（头晕目眩的）, tired, and weak. The men couldn't speak, and they had trouble breathing. The doctors couldn't work out what was wrong with the men until they found out the three men were all cooks, and they had just shared a dish of fugu（河豚）.\n\nFugu, the Japanese name for the pufferfish, is one of the strangest fishes in the ocean. The pufferfish gets its name from the way the fish keeps itself safe when it faces enemies. Whenever it is attacked, the fish blows up its body to over twice its usual size!\n\nThe reason why the three men were taken to hospital is that the pufferfish is very poisonous. If you eat a whole pufferfish, you will probably die.\n\nThe symptoms of fugu poisoning include a strange feeling around the mouth and throat, and breathing difficulties. You can't breathe and your body can't get any air. Your brain still works perfectly, however, so you know you are dying, but you can't speak or do anything about it.\n\nDespite the danger of fugu poisoning, this fish is actually a very popular kind of food in Japan. Because of the danger, fugu can only be prepared by cooks with a special licence（执照）from the government. These cooks are trained to identify and take out the poisonous parts of the fish. Most people who die from eating fugu these days are people who have tried their hand at preparing the fish themselves."},
 qs:[
 {n:11,t:'The writer starts the passage by ___.',
  o:['mentioning a study','asking a question','telling a real story','making a comparison'],r:2,
  ex:'推理判断题。文章开头讲述了三名加利福尼亚的厨师因为食用河豚而中毒的实例，所以文章以讲述真实故事的方式开头。'},
 {n:12,t:'The pufferfish gets its name because of the way it ___.',
  o:['eats enemies','moves its body','communicates with others','protects itself against danger'],r:3,
  ex:'细节理解题。根据"The pufferfish gets its name from the way the fish keeps itself safe when it faces enemies."可知，河豚是因保护自己免受危险的方式而得名。'},
 {n:13,t:'Paragraph 4 mainly talks about ___.',
  o:['what leads to fugu poisoning','how we can fight against fugu poisoning','what will happen after fugu poisoning','who will die from fugu poisoning'],r:2,
  ex:'主旨大意题。根据"The symptoms of fugu poisoning include a strange feeling around the mouth and throat, and breathing difficulties…"可知本段主要讲的是食用河豚中毒后的症状。'},
 {n:14,tag:'新考法·文章出处',t:'We can probably find the article in a ___.',
  o:['newspaper','travel guide','novel','storybook'],r:0,
  ex:'推理判断题。文章通过一个真实发生的食用河豚中毒的事例，介绍了河豚这种人们喜欢吃但是十分危险的鱼类，所以最可能在报纸上看到这篇文章。'}
]},

{id:'qm-readB',ord:1103,u:11,sec:'期末综合测试 · 阅读理解 B',tag:'能力',em:'🪞',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解 B 篇　[2024 广东广州期末]　语篇导读：本文主要介绍了自我意识是什么、它的重要性以及如何学会培养自我意识',
  title:'Being self-aware',
  text:'If you have to describe yourself to someone else, what will you say? It can be difficult to see yourself from the outside, but knowing who you are, or being self-aware, can help you understand feelings and make friendships closer.\n\nSelf-awareness means having a good understanding of your own character. If you\'re self-aware, you may know that you love playing an instrument because you do well in it, and music makes you happy, or that you like watching TV better on your own because it helps you relax.\n\nKnowing what you like and dislike, what you are good or bad at allows you to make better decisions about friendships, schoolwork and build confidence. The WHO（World Health Organization）says self-awareness is one of ten important life skills that help young people live healthier and happier lives. Being self-aware doesn\'t mean only thinking of yourself. By understanding your own feelings, you will better understand other people too.\n\nHow do you learn to be self-aware? It is a good way to ask questions. Ask yourself questions that start with "What" instead of "Why". For example, if you don\'t understand why you keep arguing with a friend, ask yourself what you disagree on instead of why you\'re arguing.\n\nLearning to be more self-aware is a skill. You learn it as you grow. So be <u>bold</u> and try out new things, like playing a new sport or listening to different kinds of music. Don\'t be afraid to dislike something—discovering what you don\'t like is a key part of learning more about yourself.'},
 qs:[
 {n:15,t:'Which of the following statements shows you are self-aware?',
  o:['Knowing your personality well.','Knowing you prefer watching TV.','Knowing how to play an instrument.','Knowing how to make friendships closer.'],r:0,
  ex:'细节理解题。根据"Self-awareness means having a good understanding of your own character."可知选 A 项。'},
 {n:16,t:'What is the 4th paragraph mainly about?',
  o:['The way of being self-aware.','The result of being self-aware.','The reason for being self-aware.','The problem of being self-aware.'],r:0,
  ex:'主旨大意题。根据"How do you learn to be self-aware?"可知，第四段主要介绍了如何培养自我意识。'},
 {n:17,t:'What does the underlined word "bold" in the last paragraph mean?',
  o:['Worried.','Brave.','Active.','Smart.'],r:1,
  ex:'词义猜测题。根据"try out new things, like playing a new sport or listening to different kinds of music"以及 Don\'t be afraid 可知，此处建议要大胆尝试新事物。'},
 {n:18,tag:'新考法·文章出处',t:'Where can we probably read the passage?',
  o:['In an advertisement.','In a history book.','In a health magazine.','In a news report.'],r:2,
  ex:'推理判断题。通读全文可知，本文主要介绍了自我意识是什么、它的重要性以及如何学会培养自我意识，这与健康有关。'}
]},

{id:'qm-readC',ord:1104,u:11,sec:'期末综合测试 · 阅读理解 C',tag:'能力',em:'🌷',mins:7,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解 C 篇　[2024 辽宁沈阳期中]　语篇导读：本文主要介绍了荷兰风车节以及不同形式的风车在荷兰文化中的内涵',
  title:'Windmill Day in the Netherlands',
  text:"The Netherlands is low-lying and influenced by the North Sea's wind, which caused floods to happen easily in the past. In order to deal with the problem, the Dutch used thousands of windmills. So the Netherlands became the famous land of windmills. With this invention, the Dutch set a special date and held some activities. It's held on the second Saturday of May each year. Gradually, Windmill Day becomes a traditional folk festival in the Netherlands.\n\nOn this day, pictures shaped like windmills are everywhere. Many shops are filled with colourful windmill art pieces. Children also like to draw windmills on the doors and windows.\n\nWindmills have different purposes in different states. They bring good luck to people in most situations. When the national flag is hung on the windmill, it may mean that a baby is born, or a couple are holding a wedding. When the fan of windmill is like a cross（十字架）, it means that some important guests are coming and that they are warmly welcomed. However, when the windmill is at rest and backward, it mainly tells us that something bad has happened.\n\nNowadays, during your visit in the Netherlands, you can choose the windmill museums. Also, you can go to the local windmill villages. There are a lot of windmills around the country, with many still in use. They are slowly running to greet you."},
 qs:[
 {n:19,t:'People in Netherlands mainly used windmills to ___ in the past.',
  o:['produce electricity','deal with floods','celebrate festivals','welcome visitors'],r:1,
  ex:"细节理解题。根据第一段的\"The Netherlands is low-lying and influenced by the North Sea's wind… thousands of windmills.\"可知选 B 项。"},
 {n:20,tag:'新考法·选项选择',t:'How do the Dutch celebrate Windmill Day?\n① They decorate the public places with pictures shaped like windmills.\n② Shop owners prepare lots of colourful windmill art pieces.\n③ They change the fan of windmill into a cross.\n④ Young kids draw windmills on the doors and windows.',
  o:['①②③','②③④','①③④','①②④'],r:3,
  ex:'细节理解题。根据第二段内容可知选 D 项。'},
 {n:21,tag:'新考法·图示理解',t:'Which picture of windmills shows some important guests are coming?\n（书上四张风车图：A. 风车叶片呈 X 形　B. 风车叶片呈十字形（像十字架）　C. 风车叶片呈 X 形停在一侧　D. 风车叶片呈 X 形的农舍风车）',
  o:['A 图','B 图','C 图','D 图'],r:3,
  ex:'细节理解题。根据第三段的"When the fan of windmill is like a cross, it means that some important guests are coming"可知选 D 项。温馨提示：在本句中，like 表示"像"的含义。'},
 {n:22,t:'What can we know from the text?',
  o:['Visitors can only enjoy windmills in museums.','Windmills bring good luck to people in all situations.','There are few windmills across the country.','A still windmill may mean something bad has happened.'],r:3,
  ex:'细节理解题。根据第三段的"when the windmill is at rest and backward, it mainly tells us that something bad has happened"可知选 D 项。'},
 {n:23,tag:'新考法·文章出处',t:'In which part of a magazine can we read the text?',
  o:['Culture.','Human.','Language.','Science.'],r:0,
  ex:'推理判断题。本文介绍了荷兰风车节及风车的一些文化内涵，故推测可以在杂志的文化专栏看到这篇文章。'}
]},

{id:'u3-s1r1-nl',ord:302,u:3,sec:'Section 1　Reading (Ⅰ)',tag:'能力',em:'🤖',mins:8,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：233　难度：★★★　[2025 陕西渭南质检]　素材话题：DeepSeek 在教育领域的应用',
  title:'DeepSeek in education',
  text:'① During the winter vacation, what is the most popular? That must be DeepSeek, an AI tool from China. It makes a stunning debut（惊艳亮相）across the world. It was so popular that even many great companies want to cooperate（合作）with its company, which is also called DeepSeek. Besides the famous AI tool, it has created some amazing learning tools with the help of AI.\n\n② For example, the staff carefully study how students learn. They find out whether a student likes reading aloud or silently, which subjects are easy and which ones are difficult. After that, they make special study plans for each student. If a student is bad at Maths, the plan will have more Maths practice.\n\n③ Another great thing about DeepSeek is the fast feedback（反馈）. When students finish their homework or tests, it quickly shows what\'s wrong and gives easy-to-understand advice for students to correct mistakes. This helps students learn from their mistakes right away.\n\n④ Teachers also love DeepSeek. They can see how well students are doing at any time. It can make clear reports, so teachers don\'t have to spend hours checking. This gives them more time to prepare for lessons or help students in need.\n\n⑤ Now, lots of schools all over the world are using DeepSeek. Students are more excited about learning and feel more sure of themselves.'},
 qs:[
 {n:1,tag:'新考法·写作手法',t:'How does the writer start the passage?',
  o:['By listing some numbers.','By making a survey.','By using a saying.','By asking a question.'],r:3,
  ex:'细节理解题。根据"During the winter vacation, what is the most popular?"可知，作者通过提问的方式开始文章。故选 D 项。'},
 {n:2,tag:'新考法·图示理解',t:"According to Li Hua's study level, the AI learning tool will give him more ___ practice.\n（书上配的柱状图：李华各科水平从强到弱依次是 Maths → Physics → Chinese → English，English 最弱）",
  o:['Chinese','Physics','Maths','English'],r:3,
  ex:'推理判断题。根据"If a student is bad at Maths, the plan will have more Maths practice."及题下的表格可知，李华在英语方面最弱，因此人工智能学习工具会给他提供更多的英语练习。故选 D 项。'},
 {n:3,t:'Which of the following is TRUE according to the passage?',
  o:['Teachers are doubtful about DeepSeek.','Students can get a fast feedback through DeepSeek.','DeepSeek can stop students from making mistakes.','DeepSeek is the name of an AI tool, not a technology company.'],r:1,
  ex:'细节理解题。根据"Another great thing about DeepSeek is the fast feedback."可知，学生可以通过 DeepSeek 获得快速反馈。故选 B 项。'},
 {n:4,tag:'新考法·篇章结构',t:"What's the structure of the passage?\n（① ② ③ ④ ⑤ 代表五个段落，/ 表示分层）",
  o:['①/②③④/⑤','①/②/③④⑤','①/②③/④⑤','①②/③/④⑤'],r:0,
  ex:'推理判断题。文章第一段引出话题，介绍了寒假期间受欢迎的 DeepSeek；第二段介绍了它能根据学生的学习情况制定特别的学习计划；第三段介绍了它能快速反馈；第四段介绍了老师也喜欢它的原因；第五段总结全文，说明现在很多学校都在使用 DeepSeek 以及使用后的效果。故选 A 项。'}
]},

 {n:8,src:'2025 山东菏泽期末',t:'The terrible accident warns us ___ more attention to road safety.',

  ex:'句意为：这起可怕的事故提醒我们要更加注意道路安全。warn sb to do sth 意为"提醒某人做某事"；"pay attention to…"意为"注意……"，均为固定搭配，符合语境。故填 to pay。'},
 {n:9,src:'2025 重庆北碚区期中',t:'Since 1978, ___ China to the world has brought us many advantages.',

  a:['connecting'],
  ex:'句意为：自 1978 年以来，将中国与世界连接给我们带来了许多优势。"connect… to…"表示"将……与……连接起来"，符合语境；分析句子结构可知，本句缺主语，故应用 connect 的动名词形式。故填 connecting。'},
 {n:10,src:'2025 河南南阳期末',t:"—Did you go to Jeff's birthday party last night?　—Yes. We ___ him a lot of presents.",

  ex:'句意为：——你昨晚去参加杰夫的生日聚会了吗？——是的。我们给他带来了很多礼物。根据语境及所给词可知选 bring；根据 last night 可知，时态是一般过去时，谓语动词用过去式。故填 brought。知识拓展：bring sb sth = bring sth to sb 给某人带来某物'},
 {n:11,src:'2025 重庆沙坪坝区期末',t:'Alisa finds it difficult to finish the job by herself. She ___ needs some help.',

  ex:'句意为：阿莉莎觉得独自完成这项工作很困难。她可能需要一些帮助。根据句意及所给词可知，probable 符合语境；空处修饰动词，应用副词形式。故填 probably。'},
 {n:12,src:'2025 广东深圳期中',t:'Even though his hair started to turn grey, my grandfather still looked very ___.',

  ex:'句意为：尽管我爷爷的头发开始变灰，但他看起来仍然很有活力。根据句意及所给词可知，energy 符合语境；look 为系动词，所以此处应填形容词，意为"有活力的"。故填 energetic。'},
 {n:13,src:'2025 上海杨浦区质检',t:'This AI system is ___ than any human at solving complex problems in seconds.',

{id:'u3-s2g-nl',ord:307,u:3,sec:'Section 2　Grammar 语法填空',tag:'能力',em:'👩‍🏫',mins:8,type:'read',
 psg:{meta:'语篇导读：本文主要介绍了一位语文老师帮助学生学习编程的故事',
  title:'The teacher who teaches coding',
  text:"Chen Yuanchun is a primary school teacher in Cangyuan, Yunnan Province. __1__ woman teaches Chinese, but she is very interested in computer technology. She has introduced coding（编码系统）to __2__ (she) students as an important information technology skill.\n\nChen's connection to coding began in November 2018. She became one of the __3__ (one) teachers in Cangyuan to take training courses on coding. The training was challenging for a beginner like Chen. She learnt how __4__ (tell) a machine to perform actions and finish tasks through different orders. She studied very hard, __5__ she believed this skill would be useful for her students.\n\nAfter the training, Chen __6__ (start) a new group in her school to teach the students coding, but some parents disagreed. They were unaware __7__ the importance of coding at that time. At first, Chen could only teach students of her own class. Later, more students joined.\n\nFor __8__ (child), coding does not include writing difficult coding languages. Instead, Chen taught them how to create interesting animations（动画片）and games.\n\nAfter only one term, every student was able to create something through coding and they looked forward to __9__ (learn) more. Soon, coding classes became popular.\n\n\"I will work harder and hope these kids in mountain areas will get __10__ (many) chances and have a better future by learning information technology,\" Chen said."},
 qs:[
 {n:1,t:'第 (1) 空',hint:'不给词，根据句意填一个词',a:['the'],
  ex:'此处特指前文提到的老师，句首单词首字母大写。故用定冠词 The。'},

  ex:'此处表示她的学生，应用形容词性物主代词 her。'},

 {n:4,t:'第 (4) 空',hint:'用所给词的适当形式：tell',a:['to tell'],
  ex:'句意为：她学会了如何通过不同的指令告诉机器执行动作和完成任务。由 how 可知，此处应用"疑问词+动词不定式"结构。'},
 {n:5,t:'第 (5) 空',hint:'不给词，根据句意填一个词',a:['because','since','as','for'],
  ex:'句意为：她学习非常努力，因为她相信这项技能对她的学生会有用。设空前后句是因果关系，且前句为果后句为因，应用 because/since/as/for 引导原因状语从句。'},

{id:'u3-s3w-xz',ord:310,u:3,sec:'Section 3　刷写作',tag:'写作',em:'📝',mins:20,type:'essay',
 psg:{meta:'写作任务　[2024 陕西咸阳期中]　假如你是李涛，你们学校英语社团正在开展以"正确使用因特网"为主题的征文活动。请你认真阅读以下通知，并按要求用英语写一篇短文，参加此次活动。\n参考词汇：be harmful to、take up、search for、carefully\n要求：①短文必须包含所给要点，尽量使用参考词汇，可适当发挥；②语句通顺，意思连贯；③文中不得出现你的任何真实信息；④词数不少于 80（开头已给出，不计入总词数）',
  title:'Notice（社团通知）',
  text:'Dear students,\n\n　　The internet has made our life convenient and easy, but it has also brought a lot of problems. Please write a short passage about your ideas.\n\n　　What are the advantages of the internet?\n　　What problems does using the internet bring?\n　　How should students use the internet properly?\n\n　　　　　　　　　　　　　　　School English Club'},
 qs:[
 {n:1,essay:true,zh:'我的父母允许我在完成作业后看半个小时电视。',
  t:'把这句话翻译成英文',hint:'提示：用 allow sb to do sth',

 {n:2,essay:true,zh:'然而，有些学生花太多时间在因特网上。',
  t:'把这句话翻译成英文',hint:'提示：用 spend time on sth',
  model:'However, some students spend too much time on the internet.'},
 {n:3,essay:true,zh:'以《正确使用因特网》为题写一篇短文（80 词以上）',
  t:'上面是社团的通知，按通知里的三个问题来写：①因特网的好处 ②用因特网带来的问题 ③学生应该怎样正确使用因特网',
  hint:'标题 Use the Internet Properly，开头已给出：Internet is playing an important role in our life now.　参考词汇：be harmful to, take up, search for, carefully',
  model:"Use the Internet Properly\n\n　　Internet is playing an important role in our life now. In many ways, it's convenient for our life and makes our life easier. We can go shopping without going out of houses and watch movies online.\n\n　　However, some students spend too much time on the internet. It's harmful to their health. So some parents and teachers are worried about it.\n\n　　As students, we should use the internet to do something useful. We can search for necessary information on the internet.\n\n　　Internet is a useful tool. If we use it properly and carefully, it will make our life more colourful."}
]},

{id:'u3-wk',ord:312,u:3,sec:'外刊阅读速递',tag:'能力',em:'🌍',mins:8,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：263　难度：★★★　素材来源：TurboFuture　语篇导读：本文主要介绍了计算机的使用情况',
  title:'What computers can do',
  text:"People used the first electronic computers to perform difficult numerical calculations, but little by little the computers played many other roles. They now become more important in most people's lives.\n\n【Business】\nAlmost every company uses computers nowadays. The companies use computers to store information, manage projects and create reports. They use computers to keep in touch with people both within and outside the companies.\n\n【______】（这个小标题就是第 2 题要填的）\nComputers can give learners audio-visual packages, interactive（互动的）exercises, and remote（远程的）learning, including teaching over the internet. Teachers and students can visit educational information on the internet or e-books with the help of computers.\n\n【Healthcare】\nComputers offer great help to healthcare. Digitized medical information makes it easier to store and check data. Doctors can use computers to deal with the information and make the final medical decisions.\n\n【Art】\nComputers are used in every part of the arts now. People can use computers to create drawings, designs and paintings. Computers can be used to edit, copy, send, and print photos. Computers can also be used to make, record, edit, play and listen to music. They can be used to edit and watch videos.\n\n【Weather Forecasting】\nThe world's weather is changing all the time. It is impossible for people to monitor and deal with all the information coming from satellites and other technologies. So people cannot predict（预测）what is likely to happen in the future. But computers can help to do all of these."},
 qs:[
 {n:1,tag:'新考法·选项选择',t:'What do companies use computers to do?\n① Store information.　② Manage projects.\n③ Create reports.　　④ Show directions.\n⑤ Keep in touch with people.',
  o:['①③④⑤','①②③⑤','②③④⑤','①②④⑤'],r:1,

  ex:'主旨大意题。根据第三段内容可知，本段主要介绍的是计算机在教育方面的应用，所以标题应该是 Education。'},
 {n:3,t:'What do we know from the sentence "Doctors can use computers to deal with the information and make the final medical decisions."?',
  o:['The computer is a good helper for doctors.','The computer is more useful than doctors.','Doctors should use different computers.','Doctors can deal with computer problems.'],r:0,

  o:['Nature.','Science.','Sports.','Culture.'],r:1}

{id:'u3-b-yfxz',ord:313,u:3,sec:'B 阅读综合素养 · 语法选择',tag:'能力',em:'💻',mins:8,type:'read',
 psg:{meta:'素养：文化意识　体裁：说明文　词数：174　难度：★★★　[2024 广东广州期末]　语篇导读：本文介绍了电脑出现前后的生活对比',
  title:'Life before and after computers',
  text:"Many years ago, people lived a different life because they had no computers. For example, if people wanted to send letters to __1__ friends, they __2__ to write down the letters first. Then they went to a post office __3__ them. If they wanted to buy something, they had to look for __4__ thing they wanted in the street. It took them __5__ time. If they wanted to know what happened in __6__ places, they couldn't know it at once. They had to __7__ until somebody told them some time later.\n\nAfter __8__ the computer, we lived a better life and our lives became __9__ than before. With the help __10__ computers, people don't have to post letters through the post office. They just get on the internet __11__ send emails to their friends. __12__ they want to buy something, they don't have to go out to look for the thing __13__. They can click（点击）the mouse and order what they want __14__ the internet. If they want to know what __15__ around the world now, they just need to surf the internet."},
 qs:[
 {n:1,t:'第 (1) 空',o:['them','they','their','theirs'],r:2,ex:'此处应用形容词性物主代词修饰名词 friends。故选 C 项。'},
 {n:2,t:'第 (2) 空',o:['need','were needing','needed','had needed'],r:2,

 {n:4,t:'第 (4) 空',o:['a','an','the','/'],r:2,
  ex:'句意为：如果他们想买东西，他们必须在街上寻找他们想要的东西。此处特指前文提到的东西，应用定冠词 the。'},

 {n:7,t:'第 (7) 空',o:['wait','waits','waited','waiting'],r:0,

  ex:'句意为：发明了计算机后，我们过上了更好的生活，我们的生活变得比以前更轻松了。after 后用动词的-ing 形式。故选 B 项。'},

  ex:'get on the internet 和 send emails to their friends 为并列关系，故选 C 项。'},

  ex:'句意为：如果他们想买东西，他们也不必出去找。此处应用 If 引导条件状语从句。故选 B 项。'},
 {n:13,t:'第 (13) 空',o:['also','either','too','neither'],r:1,

 {n:14,t:'第 (14) 空',o:['on','in','at','to'],r:0,

 {n:15,t:'第 (15) 空',o:['happened','will happen','is happening','to happen'],r:2,
  ex:'句意为：如果他们想知道现在世界各地正在发生什么，他们只需要浏览因特网。根据 now 可知，此处表示正在发生的事情，应用现在进行时。'}
]},

{id:'u3-b-biaoda',ord:315,u:3,sec:'B 阅读综合素养 · 阅读与表达',tag:'写作',em:'🚢',mins:8,type:'essay',
 psg:{meta:'素养：文化意识　体裁：说明文　词数：267　难度：★★★　[2025 辽宁抚顺质检]　语篇导读：本文主要介绍了中国著名科学家黄旭华的生平事迹',
  title:'Huang Xuhua',
  text:'Huang Xuhua, a great Chinese scientist, is famous as "the Father of China\'s Nuclear Submarines（核潜艇）". He was born on 12 March, 1926, in Guangdong. In his early years, China was in a mess. Japanese planes often made cruel attacks on Chinese cities, and their warships landed on our beaches, bringing great pain to the country. These hard times made Huang Xuhua decide to study shipbuilding to help China become stronger.\n\nBuilding China\'s first nuclear submarines was a very challenging and highly secret project. For over 30 years, Huang couldn\'t be with his family. He missed important moments in his children\'s lives and couldn\'t celebrate festivals with his parents. Although he felt sorry, his sense of duty to the country always won out.\n\nThe working conditions were poor. Huang and his team didn\'t have enough money, experience or guidance for nuclear submarines\' study. Without computers, Huang and his team used abacuses to do difficult figuring. They faced many problems, but their hard work finally paid off. In 1970, China\'s first nuclear attack submarine, Long March No. 1, was ready for sea tests and started serving in 1974. This made China the fifth country to have such a powerful weapon（武器）.\n\nIn 1988, at 62, Huang joined the first deep-diving test of the submarine. Even when he was old, he often went to the research centre to share his knowledge with young people. Huang\'s story teaches us to always follow our dreams and be willing to work hard for our country, no matter what difficulties we meet.'},
 qs:[
 {n:21,essay:true,t:'Who is Huang Xuhua?',hint:'用英文回答（写完对照参考答案）',
  model:'He is a great Chinese scientist and is famous as "the Father of China\'s Nuclear Submarines".'},
 {n:22,essay:true,t:"Why couldn't Huang Xuhua celebrate festivals with his family for years?",
  hint:'用英文回答，用 Because 开头',

 {n:23,essay:true,t:'List an example of the poor working conditions.',

  model:"Huang and his team didn't have enough money, experience or guidance for nuclear submarines' study. / Without computers, Huang and his team used abacuses to do difficult figuring."},
 {n:24,essay:true,t:'What do you think of Huang Xuhua? What will you do after learning about him? Write 30 words or more.',
  hint:'开放性试题，言之有理且无语法错误即可（写 30 词以上）',
  model:'Huang Xuhua is responsible for China and hard-working. I will work hard to gain more knowledge, face the difficulties in my life bravely and try my best to work for our country in the future.'}
]},

{id:'u3-c-readA',ord:317,u:3,sec:'C 单元限时检测 · 阅读理解 A',tag:'能力',em:'🔒',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解（16 分）A 篇　语篇导读：文章主要介绍了青少年安全使用因特网的一些规则',
  title:'Internet Safety Rules',
  text:"With the help of the internet, many things are a piece of cake. Now many children use the internet to get useful information, to make friends and to relax in the free time. But some of the students don't use it in a good way. Here are some rules to make sure you're safe.\n\n＊ Make rules for internet use with your parents. For example, when you surf the internet, decide how long you should use it and what kind of website you can visit.\n\n＊ Don't give your password（密码）to anyone else, and never give out the following information—your real name, phone number, where you live or other personal information.\n\n＊ Never send your photos to someone by email.\n\n＊ Don't meet anyone you know online alone.\n\n＊ If something you see online makes you feel uncomfortable, leave the site and tell your parents or your teacher about it.\n\n＊ Remember that not everything you read on the internet is true."},
 qs:[
 {n:11,t:'Which of the following is NOT the reason why children use the internet?',
  o:['To get useful information.','To make friends.','To relax in their free time.','To make money.'],r:3,
  ex:'细节理解题。根据第一段第二句可知，很多孩子使用因特网是为了获取有用的信息、结交朋友以及在空闲时间放松，文中并没有提到为了挣钱而使用因特网。故选 D 项。'},
 {n:12,t:'What information can people give out?',
  o:['Their real names.','Their phone numbers.','Where they live.','Their nicknames.'],r:3,
  ex:'细节理解题。根据第二条建议中的"never give out the following information—your real name, phone number, where you live or other personal information"可知选 D 项。'},
 {n:13,t:"What shouldn't people do when they are online?",
  o:['Learn English.','Give their passwords to someone else.','Send emails.','Keep their personal information to themselves.'],r:1,
  ex:"细节理解题。根据第二条建议中的 Don't give your password to anyone else 可知选 B 项。"},
 {n:14,t:'Which of the following is the best title for this passage?',
  o:["Don't Surf the Internet",'Internet Safety Rules','Information on the Internet',"Don't Send Photos"],r:1,
  ex:'主旨大意题。根据第一段中的"Here are some rules to make sure you\'re safe."及全文内容可知，本文讲的是确保安全使用因特网的一些规则。故选 B 项。'}
]},

{id:'u3-c-readB',ord:318,u:3,sec:'C 单元限时检测 · 阅读理解 B',tag:'能力',em:'👵',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解 B 篇　语篇导读：本文介绍了数字技术使大多数人的生活变得更容易，但是却给一些老年人带来了不便，政府和一些非政府组织正在努力帮助解决问题，目前也已见成效',
  title:'Digital refugees',
  text:'Digital technology has made life easier for most people. With a smartphone, you can shop online, watch TV shows and catch a taxi. However, for many elderly people, such technology only makes their lives confusing（令人困惑的）.\n\nChina has about 1.1 billion internet users. Among them, those aged 60 and above take up about 7 per cent. The elderly people are not familiar with the internet. That\'s why they are sometimes called "digital refugees（数字难民）". "We have made a lifelong contribution to society, but now we feel <u>abandoned</u> by it," a 75-year-old man told Global Times.\n\nFor the elderly, they mainly learn digital technology from younger family members. However, not all of these younger people have the patience to teach the elderly. In addition, aging results in many physical problems. This makes it harder to use smartphones.\n\nThe government and some NGOs（非政府组织）in China are trying to help. See Young, a Beijing-based NGO, aims to help China\'s elderly people use mobile services. College student volunteers in the organization have been providing free computer and smartphone training for elderly people in over 200 communities across the country.\n\nNow elderly people\'s situation has been changed completely…'},
 qs:[
 {n:15,t:'Old people are sometimes called "digital refugees" because of their ___.',
  o:['difficulty in using the internet','weak eyesight and physical conditions','poor relationship with the young generation','old views about modern technology'],r:0,
  ex:'细节理解题。根据第二段第三句和第四句可知选 A 项。'},
 {n:16,t:'The underlined word "abandoned" in Paragraph 2 means "___".',
  o:['被接纳的','被理解的','被抛弃的','被质疑的'],r:2,
  ex:'词义猜测题。根据"We have made a lifelong contribution to society, but now we feel abandoned by it…"可推知，abandoned 的意思是"被抛弃的"。'},
 {n:17,t:'Which of the following is TRUE?',
  o:['Most younger people are against NGOs.','Digital technology has made life difficult for some young people.','Old people mainly learn digital technology from younger people.','NGOs aim to encourage people to use the phones they produced.'],r:2,
  ex:'细节理解题。根据"For the elderly, they mainly learn digital technology from younger family members."可知，老年人主要是从更年轻的家庭成员那里学习数字技术。'},
 {n:18,t:'What will the writer talk about next?',
  o:['The reason why this organization decided to help elderly people.','The changes this organization brought to elderly people.','The history of this organization and the success it achieved.','The support this organization needed from the government.'],r:1,
  ex:'推理判断题。根据"Now elderly people\'s situation has been changed completely…"可知，现在老年人的情况完全改变了，所以接下来有可能谈论这个组织给老年人带来的变化。'}
]},

{id:'u3-c-restore',ord:319,u:3,sec:'C 单元限时检测 · 阅读还原',tag:'能力',em:'🧷',mins:8,type:'read',
 psg:{meta:'第Ⅲ题　阅读还原（10 分）　[2024 广东珠海期末]　语篇导读：本文主要介绍了如何选择适合自己的电脑',
  title:'A desktop or a laptop?',
  text:"You need a new computer, but you are not sure which one to buy: a desktop（台式机）or a laptop. __19__\n\nBefore buying a new computer, you should first ask yourself how much space you have. Not everyone's desk is big enough. __20__ In this case, a laptop can be the right choice.\n\nAfter that, you'll need to think about your needs: Why do you want to buy a computer? As we all know, a laptop can be taken easily whenever you study or work. __21__ Because the freedom to study or work anywhere can help encourage their creativity.\n\nBut others, like game developers and video or photo makers, might prefer a desktop with big screens. __22__ Few laptop screens are big and bright enough to serve their needs.\n\n__23__ Many people may end up spending too much on a computer. If you only want to have a computer to take online lessons, surf the internet or write articles, you can use older models to save money.\n\n【备选句子】\nA. It's not easy to choose the right computer.\nB. Maybe a desktop is too large for the space you have.\nC. Sometimes it is hard to make a right choice for others.\nD. Because these people need bigger screens to take a close look at a picture or a video.\nE. The tips below may help you make a good choice.\nF. Students and writers may think more about this advantage of a laptop."},
 qs:[
 {n:19,t:'第 (19) 空该填哪一句？',
  o:["It's not easy to choose the right computer.",'Maybe a desktop is too large for the space you have.','Sometimes it is hard to make a right choice for others.','Because these people need bigger screens to take a close look at a picture or a video.','The tips below may help you make a good choice.','Students and writers may think more about this advantage of a laptop.'],r:4,
  ex:'下文给出了选择电脑的建议，设空处应有承上启下的作用，选项 E 符合语境。'},
 {n:20,t:'第 (20) 空该填哪一句？',
  o:["It's not easy to choose the right computer.",'Maybe a desktop is too large for the space you have.','Sometimes it is hard to make a right choice for others.','Because these people need bigger screens to take a close look at a picture or a video.','The tips below may help you make a good choice.','Students and writers may think more about this advantage of a laptop.'],r:1,
  ex:'本段与放置电脑的空间有关，故选项 B（对你拥有的空间来说台式机可能太大了。）符合语境。'},
 {n:21,t:'第 (21) 空该填哪一句？',
  o:["It's not easy to choose the right computer.",'Maybe a desktop is too large for the space you have.','Sometimes it is hard to make a right choice for others.','Because these people need bigger screens to take a close look at a picture or a video.','The tips below may help you make a good choice.','Students and writers may think more about this advantage of a laptop.'],r:5,
  ex:'根据 a laptop can be taken easily whenever you study or work 以及"Because the freedom to study or work anywhere can help encourage their creativity."可知，选项 F（学生和作家可能会更多地考虑笔记本电脑的这一优势。）符合语境。'},
 {n:22,t:'第 (22) 空该填哪一句？',
  o:["It's not easy to choose the right computer.",'Maybe a desktop is too large for the space you have.','Sometimes it is hard to make a right choice for others.','Because these people need bigger screens to take a close look at a picture or a video.','The tips below may help you make a good choice.','Students and writers may think more about this advantage of a laptop.'],r:3,
  ex:'根据"But others, like game developers and video or photo makers, might prefer a desktop with big screens."可知，选项 D（因为这些人需要更大的屏幕来仔细观察照片或视频。）符合语境。'},
 {n:23,t:'第 (23) 空该填哪一句？',
  o:["It's not easy to choose the right computer.",'Maybe a desktop is too large for the space you have.','Sometimes it is hard to make a right choice for others.','Because these people need bigger screens to take a close look at a picture or a video.','The tips below may help you make a good choice.','Students and writers may think more about this advantage of a laptop.'],r:0,
  ex:'根据"Many people may end up spending too much on a computer."可知，许多人最终可能会在电脑上花太多钱，所以选择一台合适的电脑并不容易，选项 A 符合语境。'}

{id:'u3-c-tianci',ord:320,u:3,sec:'C 单元限时检测 · 语篇填词',tag:'基础',em:'🤖',mins:5,type:'read',
 psg:{meta:'第Ⅳ题　语篇填词（5 分）　[2025 广东广州期中]　语篇导读：本文主要介绍了机器人在我们生活中的重要性和应用领域',
  title:'Robots in our lives',
  text:"Robots are becoming a big part of our lives. They seem very popular to most people. They have a long history. The first one was made by a Greek __24__. You may have seen robots in some films. They are stronger, faster and __25__ than people in real life.\n\nThousands of robots are used in factories. These robots are not like the robots in movies. They don't walk or talk. __26__, a robot may be just a metal arm. The robot arm can do a certain job in a factory over and over again. It can do jobs that people may not want to do.\n\nRobots are also used to do many __27__ jobs. In Canada, the policemen are using a robot on wheels. This robot moves around to carry bombs（炸弹）and takes them away.\n\nRobots are used in hospitals too. At one hospital, a robot takes meals from the kitchen to the sick people's rooms, and it never loses its way because it has a __28__ of the hospital in its computer system.\n\nBut robots will never take the place of human beings, though they can help us in a lot of different ways."},
 qs:[
 {n:24,t:'第 (24) 空',hint:'首字母提示：i',a:['inventor'],
  ex:'句意为：第一个机器人由一位希腊发明家制造的。根据 The first one was made by a Greek 和首字母可知，此处表示"发明家"。a 后面跟单数名词，故填 inventor。'},
 {n:25,t:'第 (25) 空',hint:'首字母提示：c',a:['cleverer'],
  ex:'句意为：它们比现实生活中的人类更强壮、更快、更聪明。根据"They are stronger, faster… than people in real life."和首字母可知，此处表示机器人比现实中的人更聪明。此处应用形容词 clever 的比较级形式，故填 cleverer。'},
 {n:26,t:'第 (26) 空',hint:'首字母提示：I',a:['instead'],
  ex:'句意为：相反，机器人可能仅仅是一个金属手臂。根据"These robots are not like the robots in movies. They don\'t walk or talk."及 a robot may be just a metal arm 和首字母可知，后面说的是相反的情况，应该使用副词 instead，设空位于句首，应大写首字母，故填 Instead。'},
 {n:27,t:'第 (27) 空',hint:'首字母提示：d',a:['dangerous','difficult'],
  ex:'句意为：它们还被用来做许多危险/困难或无聊的工作。根据"…the policemen are using a robot on wheels. This robot moves around to carry bombs and takes them away."和首字母可知，此处表示机器人还被用来做危险/困难的工作，故填 dangerous/difficult。'},
 {n:28,t:'第 (28) 空',hint:'首字母提示：m',a:['map'],
  ex:'句意为：在一家医院，机器人从厨房把饭菜送到病人的房间，它从来不会迷路，因为它的计算机系统中有医院的地图。根据语境及首字母可知，机器人不会迷路是因为它的电脑系统里面有医院地图，由 a 可知填 map。'}
]},

{id:'u3-c-xiezuo',ord:321,u:3,sec:'C 单元限时检测 · 书面表达',tag:'写作',em:'📝',mins:20,type:'essay',
 qs:[
 {n:29,essay:true,zh:'总结班里关于"想让机器人做什么"的讨论结果（80 词以上）',
  t:'如果你将来有一个机器人，你想用它来干什么呢？为此，你们班在英语课上进行了激烈的讨论，请用英语写一篇短文，总结讨论的情况。\n\n讨论结果：\n　50% 的学生想让机器人帮忙做家务或照顾老人；\n　30% 的学生需要它来帮助他们学习，或者和他们聊天、娱乐；\n　剩下的 20% 的人有各种各样的不同的想法。\n\n要求：①文中不能出现真实的校名和姓名等；②语言要通顺，表达要正确；③要包含题干中的讨论结果，为了行文需要，可适当增加要点；④词数不少于 80（开头已给出，不计入总词数）。',
  hint:'开头已给出：If we have a robot, what shall we ask it to do? We have a heated discussion in our English class. Here are the results.　　可以用 Fifty per cent of the students… / Thirty per cent of… / The rest of them…',
  model:"If we have a robot, what shall we ask it to do? We have a heated discussion in our English class. Here are the results.\n\n　　Fifty per cent of the students say they will need the robot to help with housework or help to look after old people. Thirty per cent of the students say they will need the robot to help with their study. When they're tired, they will use the robot to chat and play with them.\n\n　　Twenty per cent of the students will ask the robot to do more interesting things. Some of them say they will use the robot to pick up the litter on the ground to protect the environment."}
]},

{id:'u2-s1r1-nl',ord:202,u:2,sec:'Section 1　Reading (Ⅰ)',tag:'能力',em:'🍄',mins:8,type:'read',
 psg:{meta:'体裁：记叙文　题材：故事与诗歌　词数：298　难度：★★★　[2025 重庆沙坪坝区期中]　素材来源：《爱丽丝梦游仙境》节选',
  title:'Alice and the Caterpillar',
  text:'"Are you happy with your size now?" asked the Caterpillar.\n\n"I would be happier if I could be a bit larger," said Alice. "Three inches is a terrible height for a child."\n\nThis made the Caterpillar angry. "It is a good height!" It was three inches high.\n\n"But I don\'t like it," Alice answered sadly. "You get happy so easily."\n\n"You\'ll get used to（习惯于）it soon," the Caterpillar said. Alice waited for it to speak again. Before it did, it yawned（打哈欠）and shook（晃动）its body. Then it got down from the mushroom and started to move away. It went on, "One side will make you grow taller and the other will make you grow shorter."\n\n"One side of what? The other side of what?" Alice thought.\n\n"Of the mushroom," said the Caterpillar just as if（好像）Alice had asked the question aloud. In another minute, the Caterpillar was out of <u>sight</u>.\n\nAlice stayed there by herself and looked at the mushroom for a minute. She tried to decide which were the two sides of it, because it was round.\n\nAt last Alice broke off a bit with each hand. "Which is which?" She had a small piece of it in her right hand from the right side of the mushroom. And then she had another piece in her left hand from the left side of the mushroom. She tasted the small piece from the right hand to see how it worked. The next thing she knew was that she was getting smaller! That made her so afraid that she started to taste the other piece from her left hand at once. Now she grew as tall as the trees in the woods!'},
 qs:[
 {n:1,t:'How did Alice feel about her height when she was talking to the Caterpillar?',
  o:['She thought she would get used to it.','She wanted to be a little shorter.','She wished she could be a bit taller.','She found it was nice for a child.'],r:2,
  ex:'细节理解题。根据 I would be happier if I could be a bit larger 可知，她想要更高一点。故选 C 项。'},
 {n:2,tag:'新考法·英英释义',t:'What does the underlined word "sight" mean in this story?',
  o:['The area that you can see.','The farthest place you can tour.','An interesting place that visitors often go.',"A person or thing that doesn't look smart or tidy."],r:0,
  ex:'词义猜测题。根据语境及"In another minute, the Caterpillar was out of sight."可知毛毛虫不见了，out of sight 意为"看不见"，sight 在此意为"视野"，也就是能看到的区域，对应 A 项 The area that you can see。\n⚠️ 注意：书上答案表把这题印成了 B，但书上自己的解析写的是"能看到的区域"，指向的是 A 项；B 项意思是"你能游览的最远的地方"，与 sight 无关。这里按 A 判分。'},
 {n:3,tag:'新考法·图示理解',t:'Which side of the mushroom made Alice smaller?\n（书上配图是一朵蘑菇，①在左边　②在右边　③在顶部　④在底部）',
  o:['①（左边）','②（右边）','③（顶部）','④（底部）'],r:1,
  ex:'细节理解题。根据"She had a small piece of it in her right hand from the right side of the mushroom… She tasted the small piece from the right hand to see how it worked. The next thing she knew was that she was getting smaller!"可知，蘑菇的右边能让她变小，即②处。故选 B 项。'},
 {n:4,tag:'新考法·顺序排列',t:'Which is the right order of the story?\n① Alice tasted a piece from the left side of the mushroom.\n② The Caterpillar got down from the mushroom and started moving away.\n③ Alice didn\'t know which side of the mushroom to taste.\n④ Alice tasted a piece from the right side of the mushroom.\n⑤ The Caterpillar told Alice how to grow shorter or taller.',
  o:['②③⑤①④','⑤②③①④','⑤③②④①','②⑤③④①'],r:3,
  ex:'细节理解题。根据"Then it got down from the mushroom and started to move away. It went on, \'One side will make you grow taller and the other will make you grow shorter.\'""She tried to decide which were the two sides of it, because it was round.""She tasted the small piece from the right hand to see how it worked."以及"That made her so afraid that she started to taste the other piece from her left hand at once."可知，正确的顺序是②⑤③④①。故选 D 项。'}
]},

{id:'u2-s1r2-jc',ord:203,u:2,sec:'Section 1　Reading (Ⅱ) & Listening',tag:'基础',em:'✏️',mins:20,type:'fill',
 qs:[
 {n:1,src:'2025 山东泰安质检',t:"Clear waters and green mountains are as good as mountains of gold and ___. Let's take action to protect the environment.",
  hint:'音标提示：/ˈsɪlvə(r)/',a:['silver'],w:'silver'},

 {n:6,t:"Life is ___. You never know what you're going to face in the next minute.",
  hint:'从方框里选词，用适当形式填空：agree｜carry｜challenge｜explore｜four｜make｜one｜reply｜win｜wonder',
  a:['challenging'],w:'challenge',
  ex:'句意为：生活是有挑战性的。你永远不知道下一分钟你将面对什么。根据 Life is 及所给词可知，此处用形容词作表语，challenge 的形容词形式是 challenging，意为"具有挑战性的"，符合语境。故填 challenging。'},
 {n:7,t:'In China, spring is a ___ season to enjoy beautiful flowers.',
  hint:'从方框里选词，用适当形式填空：agree｜carry｜challenge｜explore｜four｜make｜one｜reply｜win｜wonder',
  a:['wonderful'],w:'wonder',
  ex:'句意为：在中国，春天是欣赏美丽花朵的好季节。根据"a… season"及所给词可知，此处使用 wonder 的形容词形式 wonderful（极好的）作定语修饰名词 season。故填 wonderful。'},
 {n:8,src:'2025 广东深圳期末',t:'All of us have the same opinion about it. I think we will be in ___ with their decision.',
  hint:'从方框里选词，用适当形式填空：agree｜carry｜challenge｜explore｜four｜make｜one｜reply｜win｜wonder',
  a:['agreement'],
  ex:'句意为：我们所有人对此都有相同的看法。我想我们会同意他们的决定。in agreement with 意为"同意"，为固定用法，符合语境。故填 agreement。'},
 {n:9,src:'2025 上海金山区调研',t:'I phoned Julia to make a date three times yesterday, but there were no ___.',

  a:['replies'],w:'reply',
  ex:'句意为：我昨天给朱莉娅打了三次电话约她，但都没有回应。根据 I phoned Julia 和所给词可知，此处表示回应，应选 reply；根据谓语动词 were 可知，应用名词复数。故填 replies。'},
 {n:10,src:'2025 安徽合肥期末',t:'John worked very hard and ___ first place in the competition.',
  hint:'从方框里选词，用适当形式填空：agree｜carry｜challenge｜explore｜four｜make｜one｜reply｜win｜wonder',
  a:['won'],
  ex:'句意为：约翰工作非常努力，在比赛中获得了第一名。根据 first place 及所给词可知，此处应选 win；根据 worked 可知，本句用一般过去时，动词用过去式。故填 won。'},
 {n:11,src:'2025 广东深圳期中',t:'My mother promises ___ a birthday cake for me every year.',
  hint:'从方框里选词，用适当形式填空：agree｜carry｜challenge｜explore｜four｜make｜one｜reply｜win｜wonder',
  a:['to make'],w:'promise',
  ex:'句意为：我妈妈答应每年给我做一个生日蛋糕。根据 a birthday cake 和所给词可知，此处应选 make；promise to do sth 意为"承诺做某事"，为固定搭配。故填 to make。'},
 {n:12,src:'2025 江苏泰州期末',t:'—It is said that three ___ of my classmates love listening to music in their free time.　—It\'s a good way to take a break from long time study.',
  hint:'从方框里选词，用适当形式填空：agree｜carry｜challenge｜explore｜four｜make｜one｜reply｜win｜wonder',
  a:['fourths'],
  ex:'句意为：——据说我四分之三的同学喜欢在空闲时间听音乐。——这是在长时间学习中休息的好方法。分析句子结构可知，此处应用序数词表示分母，且分子一般小于分母；根据 three 可知，此处应用复数。故填 fourths。'},
 {n:13,t:'There are so many desks and chairs. You should make enough people ___ them out of the room.',

 {n:14,src:'2025 广东深圳调研',t:'The emperor ordered Zheng He ___ the lands outside China.',

  ex:'句意为：皇帝命令郑和探索中国以外的国家。order sb to do sth 意为"命令某人做某事"。故填 to explore。'},
 {n:15,src:'2025 上海普陀区期中',t:'The new bookshop is on the ___ floor of the shopping centre.',

  ex:'句意为：新的书店在购物中心二楼。根据"on the… floor"及所给词可知，此处表示在二楼，应用基数词 one 的序数词 first 表示顺序。故填 first。'},
 {n:16,src:'2025 陕西西安质检',zh:'百分之十的学生每周至少上网三到四次。',

 {n:18,src:'2025 江苏无锡期中',zh:'当地政府已经意识到了这个问题，并把那些工厂改造成了新公园。',
  t:'The local government has ___ and turned the factories into new parks.',

 {n:19,src:'2025 天津河北区期末',zh:'安娜把箱子提起来放到桌子上。',
  t:'Anna lifted up the box and ___ the table.',
  hint:'根据汉语意思完成句子（每空一词，共 3 空）',a:['put it on']},
 {n:20,zh:'我们应该思考怎么把中国优秀文化介绍给全世界。',
  t:'We should ___ how to introduce great Chinese culture to the whole world.',

{id:'u2-s1r2-cloze',ord:204,u:2,sec:'Section 1　Reading (Ⅱ) 完形填空',tag:'能力',em:'🧩',mins:7,type:'read',
 psg:{meta:'体裁：说明文　题材：日常活动　词数：201　难度：★★　语篇导读：本文主要介绍了各个国家的人们认为哪些数字是幸运的，哪些是不幸运的',
  title:'Lucky numbers and unlucky numbers',
  text:'Many people are superstitious（迷信的）about numbers. They think that there are lucky numbers and __1__ numbers.\n\nThe number 13 is often considered（认为）unlucky. In __2__ parts of the world, buildings don\'t have the __3__ floor. People go from the twelfth to the fourteenth __4__. Some door numbers are like that __5__.\n\nIn China, the number 4 is considered unlucky because in China the word "four" is pronounced the same as the word "death". Some Chinese __6__ give gifts of four knives, four napkins or four of anything.\n\n__7__ are lucky numbers? 6 is a lucky number in many places, and 8 is considered a lucky number both in Japan and China. In China, shops often open __8__ 8 August, and many couples get married at 8:08 on 8 August. Some people __9__ lucky numbers very deeply. They would like to get a telephone number with "8" or "6" in it, although it __10__ them much more money. They think that the lucky numbers can really bring them good luck, and that at least no evidence（证据）says they cannot.'},
 qs:[
 {n:1,t:'第 (1) 空',o:['true','good','wise','unlucky'],r:3,
  ex:'句意为：他们认为有幸运数字和不幸运数字。根据 there are lucky numbers 可知选 D 项。'},
 {n:2,t:'第 (2) 空',o:['every','any','some','all'],r:2,
  ex:'句意为：在世界上的一些地方，建筑物没有第十三层。parts 为可数名词复数，结合语境及常识可知应用 some。'},
 {n:3,t:'第 (3) 空',o:['thirteen','thirteenth','thirty','thirtieth'],r:1,
  ex:'根据上下文可知，一些地方的建筑物没有第十三层，又由空前 the 与空后 floor 可知，此处应用 thirteen 的序数词。'},
 {n:4,t:'第 (4) 空',o:['amount','number','room','floor'],r:3,
  ex:'句意为：人们从十二楼上到十四楼。根据上一句可知，此处指楼层。'},
 {n:5,t:'第 (5) 空',o:['as well','and so on','for example','as though'],r:0,
  ex:'句意为：有些门牌号也是那样的。设空在句末表示"也"，应用 as well。'},
 {n:6,t:'第 (6) 空',o:['usually','always','sometimes','never'],r:3,
  ex:'根据上文可知，一些中国人认为数字 4 不幸运，所以从不送数量为四个的礼物。'},
 {n:7,t:'第 (7) 空',o:['What','Why','When','How many'],r:0,
  ex:'根据语境可知，此处提问幸运数字是什么。'},
 {n:8,t:'第 (8) 空',o:['in','with','at','on'],r:3,
  ex:'句意为：在中国，商店通常在 8 月 8 日开业，许多夫妻在 8 月 8 日 8:08 结婚。表示在具体的某一天用介词 on。'},
 {n:9,t:'第 (9) 空',o:['realize','discuss','believe','promise'],r:2,
  ex:'根据后文可知，一些人十分相信幸运数字。'},
 {n:10,t:'第 (10) 空',o:['costs','spends','pays','talks'],r:0,
  ex:'句意为：他们想得到一个其中带有"8"或"6"的电话号码，尽管这要花他们更多的钱。sth costs sb some money 意为"某物花费某人多少钱"，符合语境。'}
]},

{id:'u2-s1r2-restore',ord:205,u:2,sec:'Section 1　Reading (Ⅱ) 阅读还原',tag:'能力',em:'🧷',mins:6,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：143　难度：★★　[2024 辽宁锦州期末]　语篇导读：本文主要介绍了数字画的起源以及发展',
  title:'Paint-by-numbers pictures',
  text:'Do you know paint-by-numbers pictures? No? Your parents and grandparents may know the pictures because they are not something new.\n\nIn a paint-by-numbers picture, you can see a painting divided into different parts with different numbers. __11__ For example, when you paint, you just colour the parts with the number "1" in black and the parts with the number "2" in white. This makes it easy for people to paint.\n\n__12__ He once worked for a paint company. One day in 1949, Dan\'s boss asked him to sell more paintings. Then Dan had the idea of paint-by-numbers pictures. He knew that the famous artist Leonardo da Vinci used to divide paintings into different parts and number them. Dan wanted to create pictures to let people paint in the same way. His boss asked him to create such pictures.\n\nDan created several different kinds of paint-by-numbers pictures. __13__ In 1951, the company showed customers how to colour a large paint-by-numbers picture in a shopping centre in New York. After that, paint-by-numbers pictures became very popular.\n\nSome people say that paint-by-numbers pictures are not real art. __14__\n\n【备选句子】\nA. Dan Robbins is the father of paint-by-numbers pictures.\nB. He was from a big company.\nC. But Dan only wanted everyone to enjoy art in an easy and happy way.\nD. Each of those numbers is for a colour.\nE. At first, they didn\'t sell well.'},
 qs:[
 {n:11,t:'第 (11) 空该填哪一句？',
  o:['Dan Robbins is the father of paint-by-numbers pictures.','He was from a big company.','But Dan only wanted everyone to enjoy art in an easy and happy way.','Each of those numbers is for a colour.',"At first, they didn't sell well."],r:3,
  ex:'根据下文的"For example, when you paint, you just colour the parts with the number \'1\' in black and the parts with the number \'2\' in white."可知，D 选项符合语境。'},
 {n:12,t:'第 (12) 空该填哪一句？',
  o:['Dan Robbins is the father of paint-by-numbers pictures.','He was from a big company.','But Dan only wanted everyone to enjoy art in an easy and happy way.','Each of those numbers is for a colour.',"At first, they didn't sell well."],r:0,
  ex:'根据下文的"He once worked for a paint company."可知，此处应当介绍数字画的发明人，故选 A 项。'},
 {n:13,t:'第 (13) 空该填哪一句？',
  o:['Dan Robbins is the father of paint-by-numbers pictures.','He was from a big company.','But Dan only wanted everyone to enjoy art in an easy and happy way.','Each of those numbers is for a colour.',"At first, they didn't sell well."],r:4,
  ex:'根据下文的"In 1951, the company showed customers how to colour a large paint-by-numbers picture in a shopping centre in New York. After that, paint-by-numbers pictures became very popular."可知，此处应该介绍数字画一开始卖得并不好，故选 E 项。'},
 {n:14,t:'第 (14) 空该填哪一句？',
  o:['Dan Robbins is the father of paint-by-numbers pictures.','He was from a big company.','But Dan only wanted everyone to enjoy art in an easy and happy way.','Each of those numbers is for a colour.',"At first, they didn't sell well."],r:2,
  ex:'根据上文的"Some people say that paint-by-numbers pictures are not real art."可知，C 选项符合语境。'}
]},

{id:'u2-s2g-yf',ord:206,u:2,sec:'Section 2　Grammar',tag:'语法',em:'🔢',mins:10,type:'fill',
 qs:[

 {n:10,src:'2024 广东揭阳期末',t:'China has made great progress in the ___ century.',

 {n:11,zh:"把这句话改成同义句：It's five fifty, so we must go home.",
  t:"It's ___, so we must go home.",

{id:'u2-s2g-nl',ord:207,u:2,sec:'Section 2　Grammar 语法填空',tag:'能力',em:'🎎',mins:8,type:'read',
 psg:{meta:'[2025 广东深圳期中]　语篇导读：本文介绍了不同国家的年轻人如何庆祝他们的成人礼',
  title:'Coming-of-age ceremony',
  text:"A group of boys and girls are in our school hall. Look, they __1__ (wear) traditional Chinese clothes, waiting for their parents to put a hat on their head or stick a hairpin in their hair.\n\nThese young people are having their coming-of-age ceremony（成人礼）. This ceremony comes __2__ an old Chinese tradition. It is an important milestone（里程碑）in a __3__ (person) life. In fact, almost every country has the ceremony.\n\nIn the USA, __4__ (turn) 16 is a big thing because teenagers usually get their driving licence at 16. Girls have \"sweet 16\" birthday parties __5__ (celebrate) the coming age. In Japan, Coming-of-Age Day is a national holiday. It takes place on the __6__ (two) Monday in January. Girls do their hair in fancy styles, wear make-up（化妆品）and put on kimonos（和服）. Boys wear __7__ man's kimono or a smart suit.\n\nHowever, adulthood（成年）brings not only joy __8__ more responsibility（责任）. In Germany, the coming-of-age ceremony is called Jugendfeier—youth consecration. It is __9__ (meaningful) than other coming-of-age ceremonies. It is __10__ (probable) because from young adulthood, most people start to face the difficulties of life."},
 qs:[
 {n:1,t:'第 (1) 空',hint:'用所给词的适当形式：wear',a:['are wearing'],
  ex:'句意为：看，他们正穿着传统的中国服装……根据 Look 可知，此处应用现在进行时，主语是复数，be 动词用 are。故填 are wearing。'},
 {n:2,t:'第 (2) 空',hint:'不给词，根据句意填一个词',a:['from'],
  ex:'句意为：这个仪式源于一个古老的中国传统。come from 是固定短语，意为"来自"，符合语境。故填 from。'},
 {n:3,t:'第 (3) 空',hint:'用所给词的适当形式：person',a:["person's"],
  ex:'句意为：这是一个人的生命中的重要里程碑。此处修饰名词 life，应用名词所有格形式；结合 a。故填 person\'s。'},
 {n:4,t:'第 (4) 空',hint:'用所给词的适当形式：turn',a:['turning'],
  ex:'句意为：在美国，到 16 岁是一件大事……此处应用动名词作主语。故填 turning。'},
 {n:5,t:'第 (5) 空',hint:'用所给词的适当形式：celebrate',a:['to celebrate'],
  ex:'句意为：女孩们举办"甜蜜 16 岁"生日聚会来庆祝成年。此处应用动词不定式结构表示目的。故填 to celebrate。'},
 {n:6,t:'第 (6) 空',hint:'用所给词的适当形式：two',a:['second'],
  ex:'句意为：它发生在一月的第二个星期一。根据 the 和空后的名词 Monday 可知，此处应用 two 的序数词表示顺序。故填 second。'},
 {n:7,t:'第 (7) 空',hint:'不给词，根据句意填一个词',a:['a'],
  ex:'句意为：男孩们穿一套男士和服或一套漂亮的西装。此处泛指一套男士和服，应用不定冠词，且 man\'s 的发音以辅音音素开头。故填 a。'},
 {n:8,t:'第 (8) 空',hint:'不给词，根据句意填一个词',a:['but'],
  ex:'句意为：然而，成年不仅带来快乐，还带来更多责任。"not only… but (also)…"是固定搭配，意为"不仅……而且……"，符合语境。故填 but。'},
 {n:9,t:'第 (9) 空',hint:'用所给词的适当形式：meaningful',a:['more meaningful'],
  ex:'句意为：它比其他成年礼更有意义。根据 is 和 than 可知，此处应用形容词比较级，且表示"更有意义的"。故填 more meaningful。'},
 {n:10,t:'第 (10) 空',hint:'用所给词的适当形式：probable',a:['probably'],
  ex:'probable 是形容词，此处作状语，应用副词 probably。故填 probably。'}
]},

 {n:3,essay:true,zh:'用英语讲《曹冲称象》的故事（80 词以上）',
  t:'[2025 山东烟台期中] 假设你准备参加学校英语角开展的"用英语讲故事"活动，请你用英语写一篇 80 词以上的短文，和大家分享《曹冲称象》的故事。\n注意：标题、开头和结尾已给出，不计入总词数。\n\n标题：Cao Chong Weighs the Elephant\n开头：Cao Cao was very glad to have received an elephant as a present.\n结尾："Add up all the numbers and we will know the weight of the elephant," Cao Chong said to his father with kind of pride.',
  hint:'把中间的过程写出来：曹操想知道大象多重 → 曹冲让人牵象上船、画线 → 象下船后往船上放石头到水位线 → 称石头',
  model:'Cao Chong Weighs the Elephant\n\n　　Cao Cao was very glad to have received an elephant as a present. He wanted to know how heavy the elephant was, but only Cao Chong came up with an idea.\n\n　　Cao Chong asked a man to lead the elephant onto a boat. When the boat stopped sinking, the man drew a line on the boat side. After the elephant was taken off the boat, Cao Chong had some men put stones into the boat until the water reached the line.\n\n　　Cao Chong asked the men to weigh each stone and put down the number.\n\n　　"Add up all the numbers and we will know the weight of the elephant," Cao Chong said to his father with kind of pride.'}
]},

{id:'u2-wk',ord:212,u:2,sec:'外刊阅读速递',tag:'能力',em:'🌍',mins:8,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：279　难度：★★★★　素材来源：GD TODAY　语篇导读：本文主要介绍了人工智能技术在乌骨鸡养殖中的使用',
  title:'AI chicken soup',
  text:'To celebrate a breakthrough（突破）by students in using AI to change silkie chicken（乌骨鸡）farming at the chicken farm in Chishui, Guizhou Province, the Tencent Cloud Artificial Intelligence Class—a programme set up by the university and Tencent—offered free "AI chicken soup" to all teachers and students at Shenzhen University on 16 January, 2024.\n\n"As the Spring Festival is on the way, the farm in Chishui sent hundreds of chickens and eggs to the university, so we decided to turn these chickens into \'AI chicken soup\' before the holiday to give teachers and students a taste of technology," said Chen Sirui, a student in the class.\n\nOver eight months, about a dozen students from the class have tried to <u>dedicate</u> themselves to developing the silkie chicken farming in Chishui. They used the computer vision technology to successfully identify（识别）and track（追踪）250,000 silkie chickens. The result was a success of the world\'s first intelligent silkie chicken farming system. Operating for more than six months, the system increased the farm\'s output by 30%, keeping another more 60,000 chickens.\n\nClass member Chen said, "This system sends valuable data to the chicken farmers\' mobile phones. The farmers can notice their chickens at any time. The aim is to raise the income of the farmers." A leader of the university said, "The project enables students to face real industry challenges, deepens their understanding of technology and develops their practical skills."'},
 qs:[
 {n:1,t:'Why was the free soup offered to teachers and students?',
  o:['To celebrate the coming Spring Festival.','To share the joy of the successful chicken farming by using AI technology.','To set up a new program of silkie chicken farming.','To increase the total production of silkie chickens.'],r:1,
  ex:'细节理解题。根据第一段的 To celebrate a breakthrough by students in using AI to change silkie chicken farming 可知选 B 项。'},
 {n:2,t:'What does the underlined word "dedicate" mean in Paragraph 3?',
  o:['complete','change','improve','devote'],r:3,
  ex:'词义猜测题。画线词所在句的句意为：在八个月的时间里，班上大约有十几名学生努力把自己奉献到发展赤水的乌骨鸡养殖中来。所以 dedicate 意为"贡献；奉献"，与 devote 同义。'},
 {n:3,tag:'新考法·后续发展',t:'What is the future of this technology?',
  o:['More people will work on this kind of farm.','Farmers will use computers to raise chickens.','More farmers will raise this kind of chicken.','The new farming system will be more popular.'],r:3,
  ex:'推理判断题。根据第三段的"Operating for more than six months, the system increased the farm\'s output by 30%, keeping another more 60,000 chickens."可知，该系统可以提高农场的产量，由此可推断这种新的养殖系统会变得更流行。'},
 {n:4,t:"Which of the following isn't the project's advantage to the students?",
  o:['Raising their income after graduation.','Helping them face the real industry challenges.','Deepening their understanding of technology.','Developing their practical skills.'],r:0,

  text:'What do you often do when you wait for a bus or a train at the station?\n\nTom arrived at the bus station quite early for the Paris bus. The bus to Paris would leave at five to __1__. At that time, there __2__ many people waiting at the station. Tom looked around but there was no place for him __3__.\n\nTom liked __4__ coffee. So he walked into __5__ coffee shop at the station. He looked up at the clock there. __6__ was only twenty to twelve. He found a place and sat down before a large mirror（镜子）__7__ the wall. Just then, Mike, one of Tom\'s friends, came in and sat with Tom. "__8__ time is your bus?" asked Mike. "There\'s plenty of time yet," answered Tom.\n\n"Well, I __9__ you more coffee then," said Mike.\n\nThey talked a lot __10__ they drank coffee. Some time __11__, Tom looked at the clock again. "Oh! It\'s going back!" he cried. "__12__ minutes ago, it was twenty to twelve and now it\'s half past eleven."\n\n"You\'re looking __13__ the clock in the mirror," said Mike. Tom was so sad. He had to __14__ for the next bus for another hour. __15__ from then on, Tom didn\'t like mirrors any more.'},

  text:'Morocco（摩洛哥）is a country in North Africa with rich culture. Its bread can stand for（代表）a part of its culture.\n\nThe bread is made with traditional methods. It is very soft and pairs well with many dishes. Bread is very important on the table. Like in France and Germany, bread is served at every meal and can also be a snack during the day.\n\nThe history of bread in Morocco goes back over 2,000 years. People in the area made bread from a local factory. When the Arabs（阿拉伯人）came to Morocco, they brought new grain（谷物）and bread-making methods. Today, the most common kind of bread in Morocco is round brown bread. It can be eaten alone or filled with different ingredients（食材）.\n\nBread is important in Morocco. It serves as food and is a way of sharing and connecting with people. Bread is often broken into pieces by hand and passed around the table. It is also a sign of welcome, offered to guests and visitors.\n\nIn short, bread culture is a very important part of Morocco\'s culture. It shows the country\'s history and values. Bread is not just food; it is a way of life. If you visit Morocco, don\'t forget to try the bread.'},

{id:'u2-c-readB',ord:218,u:2,sec:'C 单元限时检测 · 阅读理解 B',tag:'能力',em:'💧',mins:6,type:'read',

  title:'The "thirsty" AI',
  text:'Do you know ChatGPT? It\'s an artificial intelligence（AI）tool. It can answer questions, tell stories and write articles. But it\'s very "thirsty", said a new study from Harvard University.\n\nChatGPT has "homes" around the world in data centres（数据中心）. When it works, the computers in the data centres get very hot. Workers then have to use water to cool <u>them</u> down. Cold water goes into pipes near the computers. The water needs to be very clean. They can\'t use seawater because it can eat away the pipes.\n\nWhen you ask ChatGPT 50 questions, it "drinks" 500 millilitres（ml）of water. Scientists used about 700,000 litres of water to build ChatGPT. The water use is very big. People can make 370 cars with the water.\n\nChatGPT is just one of the AI tools around the world. You need data centres to do everything on the internet. There are more than 8,000 data centres around the world. The number is still growing.\n\nAI uses a lot of water to "grow". The world\'s water may not be enough. Many people don\'t have enough water to drink. But AI technology helps people. Should we rethink how we use AI?'},

{id:'u2-c-tianci',ord:220,u:2,sec:'C 单元限时检测 · 语篇填词',tag:'基础',em:'🖇',mins:5,type:'read',
 psg:{meta:'第Ⅳ题　语篇填词（5 分）　[2025 广东广州期中]　语篇导读：本文讲述的是骄傲的猎人与狮子挑战的故事',
  title:'The proud hunter and the lion',
  text:"Once upon a time, there was a hunter who was proud of his skills. One day, he went to the mountains in search of his target. When he went into the forest, all the animals became afraid and ran away. Only the lion __25__ him to fight. The hunter took out his arrow and launched it at once. He was so confident that he didn't choose the direction __26__. The arrow hit a bird in the tree __27__. Before the hunter __28__ his mistake, the lion took the chance and launched attack. Luckily, the lion also missed his target by inches. After the __29__, the hunter never showed off his skills."},
 qs:[
 {n:25,t:'第 (25) 空',hint:'首字母提示：c',a:['challenged'],w:'challenge',
  ex:'根据 all the animals became afraid and ran away 及首字母提示可知，狮子向猎人发起挑战，challenge 意为"挑战"；故事发生在过去，动词应用过去式。故填 challenged。'},
 {n:26,t:'第 (26) 空',hint:'首字母提示：c',a:['correctly'],
  ex:'句意为：他太自信了，以至于没有正确地选择方向。根据 The arrow hit a bird in the tree 及首字母提示可知，他的方向没有选对；空处修饰动词，应用副词形式表示"正确地"。故填 correctly。'},
 {n:27,t:'第 (27) 空',hint:'首字母提示：i',a:['instead','incorrectly'],
  ex:'句意为：箭反而/错误地射中了树上的一只鸟。根据首字母提示及"he didn\'t choose the direction…"可知，猎人没有射中狮子而是射中了一只鸟，此处应用副词表示"反而/错误地"。故填 instead/incorrectly。'},
 {n:28,t:'第 (28) 空',hint:'首字母提示：r',a:['realized','realised'],
  ex:'句意为：在猎人意识到他的错误之前，狮子抓住机会并发动了攻击。根据"the hunter… his mistake"及首字母提示可知，此处表示在猎人意识到自己的错误之前；此处用一般过去时，动词用过去式。故填 realized/realised。'},
 {n:29,t:'第 (29) 空',hint:'首字母提示：a',a:['accident'],
  ex:'句意为：事故发生后，猎人再也不炫耀自己的技能了。根据上文及首字母提示可知，这是一次事故，accident 意为"事故"；此处应用单数形式。故填 accident。知识拓展：by accident 偶然地'}
]},

{id:'u2-c-xiezuo',ord:221,u:2,sec:'C 单元限时检测 · 书面表达',tag:'写作',em:'📝',mins:20,type:'essay',
 qs:[
 {n:30,essay:true,zh:'根据表格写一篇关于业余活动调查结果的短文（80 词左右）',
  t:'假如你是杨珊，最近你做了一项关于业余活动的小调查。请根据下面表格中的内容，用英文写一篇短文来描述你的调查结果。\n\n　同学　　课外活动　　　频率\n　李玉　　国际象棋　　　一周五次\n　贝蒂　　踢足球　　　　一周三次\n　迈克　　看英语杂志　　每天\n\n要求：80 词左右，开头已给出，不计入总词数。\n开头：I\'m Yang Shan. I asked my friends about their free time activities. Here are the results.',
  hint:'三个人各写两三句：做什么 + 多久一次 + 为什么喜欢（或有什么好处），最后加一句自己的看法',
  model:"I'm Yang Shan. I asked my friends about their free time activities. Here are the results.\n\n　　Li Yu is interested in chess. She started to play chess when she was little. Now she plays chess five times a week. She thinks it helps her relax. Betty loves sports and playing sports makes her strong. Her favourite sport is soccer. She plays soccer three times a week. Mike is a shy boy. He enjoys reading very much. Every day he reads English magazines. He thinks he can learn a lot of things from them.\n\n　　I think all of their free time activities are good. Do you think so?"}
]},

{id:'u1-s2g-nl',ord:107,u:1,sec:'Section 2　Grammar 语法填空',tag:'能力',em:'🐼',mins:8,type:'read',
 psg:{meta:'[2025 广东深圳期末·节选]　语篇导读：本文介绍了大熊猫',
  title:'The giant panda',
  text:"The giant panda is a national treasure of China. It is famous __1__ the living fossil. Most pandas have black-and-white fur. They look very cute and have higher __2__ (intelligent) than many animals. They can follow the zookeepers' __3__ (instruction) without difficulty. That's why almost everyone __4__ (like) them.\n\nGiant pandas love eating bamboo best. But they also enjoy other food, including birds, fish __5__ some small animals. A panda at __6__ (born) only weighs about 120 grammes, while a grown-up panda's weight can rise up to about 120 kilogrammes.\n\nWild giant pandas live in cool and wet bamboo forests of central and western China, high up in the mountains. They show great ability to climb trees from __7__ early age.\n\nThe living giant panda was __8__ (one) found in Sichuan by a Frenchman. Because giant pandas were in danger of __9__ (die) out, they were on the list of the endangered species. Luckily, in 2016, __10__ (science) changed the level of giant pandas on the list. It's China's success in rebuilding bamboo forests."},
 qs:[
 {n:1,t:'第 (1) 空',hint:'不给词，根据句意填一个词',a:['as'],
  ex:'句意为：它作为活化石而闻名。根据 the living fossil 可知，此处表示作为活化石而闻名，be famous as 意为"作为……而闻名"。故填 as。知识拓展：be famous for 因……而出名'},
 {n:2,t:'第 (2) 空',hint:'用所给词的适当形式：intelligent',a:['intelligence'],w:'intelligent',
  ex:'句意为：它们看起来很可爱，而且有比很多动物更高的智力。分析句子可知，此处应用名词作宾语，intelligent 意为"聪明的"，其名词形式为 intelligence，意为"智力"，为不可数名词。故填 intelligence。'},
 {n:3,t:'第 (3) 空',hint:'用所给词的适当形式：instruction',a:['instructions'],
  ex:'句意为：它们可以毫无困难地听从动物园管理员的指示。instruction 意为"指示"时为可数名词，此处应用名词复数。故填 instructions。'},
 {n:4,t:'第 (4) 空',hint:'用所给词的适当形式：like',a:['likes'],
  ex:'句意为：这就是为什么几乎每个人都喜欢它们。此句时态为一般现在时，主语是 everyone。故填 likes。'},
 {n:5,t:'第 (5) 空',hint:'不给词，根据句意填一个词',a:['and'],
  ex:'句意为：但它们也喜欢其他食物，包括鸟类、鱼类和一些小动物。根据句意可知，此处表示并列。故填 and。'},
 {n:6,t:'第 (6) 空',hint:'用所给词的适当形式：born',a:['birth'],w:'birth',
  ex:'句意为：一只熊猫出生时只有大约 120 克重，而一只成年熊猫的体重可达约 120 千克。at birth 意为"在出生时"，为固定短语，符合语境。故填 birth。'},
 {n:7,t:'第 (7) 空',hint:'不给词，根据句意填一个词',a:['an'],
  ex:'from an early age 意为"从很小的时候"，符合语境。故填 an。'},
 {n:8,t:'第 (8) 空',hint:'用所给词的适当形式：one',a:['first'],
  ex:'根据语境可知，此处指最先被发现，应用 first。故填 first。'},
 {n:9,t:'第 (9) 空',hint:'用所给词的适当形式：die',a:['dying'],w:'die out',
  ex:'句意为：由于大熊猫有灭绝的危险，它们被列入濒危物种的名单。of 是介词，后跟动名词作宾语。故填 dying。'},
 {n:10,t:'第 (10) 空',hint:'用所给词的适当形式：science',a:['scientists'],
  ex:'句意为：幸运的是，2016 年，科学家们改变了大熊猫在名单中的等级。根据语境可知，此处表示"科学家"，空前无限定词。故填 scientists。'}
]},

{id:'u1-s1r2-cloze',ord:104,u:1,sec:'Section 1　Reading (Ⅱ) 完形填空',tag:'能力',em:'🧩',mins:7,type:'read',
 psg:{meta:'体裁：说明文　题材：饮食　词数：197　难度：★★★　语篇导读：本文主要介绍了通过研究发现的茶的作用',
  title:'A cup of tea helps solve problems',
  text:'A cup of tea helps solve problems. Drinking tea can __1__ your ability to create and imagine something. Scientists from Peking University made a __2__. It found that drinking tea makes you better at solving problems.\n\nThe study offered people tea or water __3__ they were asked to play a word game and solve some riddles（谜语）. Those who were given __4__ got better grades at both tasks. They got 13.89 in the word game and 10.94 in the riddles. __5__, the water drinkers\' grades were 12.94 and 9.0.\n\nTea is known for making people __6__. However, people in the study were not given __7__ tea to cheer them up. So __8__ made the tea drinkers better? The researchers thought the improvement was all in the __9__. "Some research has found that people are likely to connect tea drinking with a certain set of good characters（性格）such as being smart and creative. So tea drinkers think they should be __10__ and more creative, and their brains work that way," the researchers said. All in all, drinking tea really does good to us.'},

  ex:'根据上下文可知，此处指研究中的人没有得到足够的茶来使他们振奋起来。'},

  title:'A city without cars',
  text:'A city without cars would be very strange, right? But Venice is such a city. Venice is in the northeast of Italy. It wasn\'t built on land, like Beijing or Shanghai, but on more than 110 islands. __11__\n\nEven so, travel isn\'t difficult. The waterways have always been the best way to get around. There are many waterways and more than 400 bridges that can guide you where you want to go. __12__ They like to enjoy the scenery and cool summer nights while taking boat trips. They can talk to other people as they go along.\n\nVenice grew out of small islands in saltwater lakes when some people escaped from a war many years ago and built homes there. __13__ Once, people used too much underground water. This made the city get lower little by little. __14__ Another problem is the rising seawater. The temperature has risen over the years. __15__\n\nEvery year, the high water hits the city. When a lot of water comes, more than half of the city is underwater. Scientists are trying different ways to stop the city from getting even lower.\n\n【备选句子】\nA. Water makes the city special, but it is also a big problem.\nB. This has made the ice of the Arctic Ocean melt.\nC. Seawater is everywhere around the city.\nD. Now the city has gone down by more than 20 centimetres.\nE. People in Venice move from place to place by boat.'},

 {n:12,t:'第 (12) 空该填哪一句？',o:['Water makes the city special, but it is also a big problem.','This has made the ice of the Arctic Ocean melt.','Seawater is everywhere around the city.','Now the city has gone down by more than 20 centimetres.','People in Venice move from place to place by boat.'],r:4,

 {n:13,t:'第 (13) 空该填哪一句？',o:['Water makes the city special, but it is also a big problem.','This has made the ice of the Arctic Ocean melt.','Seawater is everywhere around the city.','Now the city has gone down by more than 20 centimetres.','People in Venice move from place to place by boat.'],r:0,

{id:'u1-wk',ord:112,u:1,sec:'外刊阅读速递',tag:'能力',em:'🌍',mins:8,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：270　难度：★★★★　素材来源：Britannica　语篇导读：本文介绍了百科全书的相关内容',
  title:'An encyclopaedia',
  text:'An encyclopaedia is a useful special reference book, or a set of books. It contains valuable information on many different subjects, or it can focus deeply on one subject. For over 2,000 years, encyclopaedias have summarized human knowledge to help people learn.\n\nThe word "encyclopaedia" comes from ancient Greek words meaning "all-round education". At first, it described a complete system of learning. A German writer, Paul Scalich, was the first to use "encyclopaedia" as the actual title for a book in 1559. Before that, these books often had creative names or were simply called "dictionaries". Denis Diderot later made "encyclopaedia" more popular with his well-known French "Encyclopédie".\n\nThe meaning of "encyclopaedia" has changed greatly. Today, people usually think of a large set of books. These books often include maps, pictures, and an <u>index</u> to help find information. They cover many various topics, including biographies of important people, both in the past and at present. Many experts write these articles, and skilled editors carefully put them together.\n\nHowever, encyclopaedias weren\'t always exactly like this. In the past, some were just a single book written by one person, while others were indeed huge sets. They didn\'t always have illustrations or information about living people. Arranging topics alphabetically or using languages other than Latin took many years to become very common.\n\nEncyclopaedias can cover all knowledge or focus on specific broad areas, like history or science. They are important because they record what people knew at different specific times. Even old encyclopaedias are valuable because they contain writings from many great thinkers and leaders, showing how our understanding of the world has greatly grown.'},
 qs:[
 {n:1,t:'What is the main purpose of an encyclopaedia?',
  o:['To replace formal education systems.','To advertise new scientific discoveries.','To entertain readers with creative stories.','To summarize human knowledge for learning.'],r:3,
  ex:'细节理解题。根据"For over 2,000 years, encyclopaedias have summarized human knowledge to help people learn."可知，百科全书的主要目的是总结知识以供人们学习。故选 D 项。'},
 {n:2,t:'How did early encyclopaedias differ from modern ones?',
  o:['They focused only on science.','They were always written in Latin.',"They often didn't have illustrations.",'They never covered multiple subjects.'],r:2,
  ex:'细节理解题。根据第四段内容可知，早期百科全书与现代百科全书相比，通常没有插图。故选 C 项。'},
 {n:3,t:'What does the underlined word "index" in Paragraph 3 probably mean in Chinese?',
  o:['索引','封皮','脚注','标题'],r:0,
  ex:'词义猜测题。根据"These books often include maps, pictures, and an index to help find information."可知，index 是帮助快速查找信息的工具。故选 A 项。'},
 {n:4,tag:'新考法·篇章结构',t:'Which of the following best shows the structure of the passage?\n（① Modern features　② Definition　③ Value　④ Past features　⑤ History）',
  o:['② → ⑤ → ① → ④ → ③','⑤ → ② → ④ → ① → ③','② → ① → ⑤ → ③ → ④','① → ⑤ → ② → ④ → ③'],r:0,
  ex:'推理判断题。文章的结构大致如下：第一段给出百科全书的定义和基本目的；第二段介绍百科全书一词的起源；第三段描述现代百科全书的特征；第四段描述早期百科全书的特征；第五段阐述百科全书的价值和历史意义。因此，A 选项最能体现文章的行文逻辑。故选 A 项。'},
 {n:5,t:'Where is the passage probably taken from?',
  o:['A fiction novel about Greek scholars.','A museum guidebook about ancient books.','A newspaper article on modern technology.','An educational magazine on knowledge tools.'],r:3,
  ex:'推理判断题。文章介绍了百科全书，最可能来自选项 D（关于知识工具的教育杂志）。故选 D 项。'}
]},

{id:'u1-b-yfxz',ord:113,u:1,sec:'B 阅读综合素养 · 语法选择',tag:'能力',em:'🦒',mins:7,type:'read',
 psg:{meta:'素养：文化意识　体裁：说明文　词数：230　难度：★★★　语篇导读：本文主要介绍了长颈鹿的相关信息',
  title:'The giraffe',
  text:"The giraffe is the tallest animal on land. Their interesting shapes attract __1__ people to visit them. They have long necks and long thin legs. Their front legs are __2__ than their back legs. Some of __3__ can be more than five metres tall. They can run very fast—about 30 miles __4__ hour. They are usually brown and yellow.\n\nGiraffes live __5__ Africa. They __6__ live up to 25 years in the wild. They spend most of the day __7__. The leaves and fruit are their main food, and they also eat grass or __8__ plants. To find food, they travel over a large area, __9__ they don't have a fixed（固定的）home.\n\nHowever, when a mother giraffe gives birth to babies, it often returns to __10__ birthplace. It only gives birth to one baby every time, and the baby giraffe is cute and can be 1.8 metres in height. About 20 minutes after being born, the baby giraffe learns __11__. Then it begins drinking __12__ milk from its mother. A few hours later, it can run and has no difference with those who have been born for weeks. __13__ amazing! The baby giraffe only __14__ with its mother after it is born in the first two weeks. When it is strong enough, it __15__ its mother and start a new life."},
 qs:[
