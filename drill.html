<style>
:root{
  --bg:#f5f5fb; --card:#ffffff; --ink:#1c2434; --sub:#6b7688;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;

header{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 14px}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}
.badge{font-size:12px;color:var(--sub);background:#eeedfa;padding:4px 10px;border-radius:20px}
.hublink{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;text-decoration:none;
  padding:5px 11px;border-radius:20px;flex-shrink:0;color:var(--brand);background:#eeedfa}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.label{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s;user-select:none}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(91,83,217,.28)}
.chip.lock{opacity:.42}
.mini{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
.mini>div{flex:1;min-width:80px;background:#f6f6fc;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.mini b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.mini span{font-size:11px;color:var(--sub)}
.vempty{font-size:13px;color:var(--sub);text-align:center;padding:10px 0;line-height:1.6}
/* 题组卡片 */
.set{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:14px 15px;margin-bottom:11px;cursor:pointer;border:2px solid transparent;transition:.15s;position:relative}
.set:active{transform:scale(.99)}
.set.done{border-color:#d8d5f3;background:#fbfbff}
.set .em{font-size:30px;line-height:1;flex-shrink:0;width:40px;text-align:center}
.set .tx{flex:1;min-width:0}
.set .tx b{display:block;font-size:15.5px;font-weight:800;line-height:1.35}
.set .tx span{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-top:3px}
.set .tx small{display:block;font-size:11px;color:var(--sub);margin-top:5px}
.set .tx small .tg{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:8px;margin-right:5px}
.tg-jc{background:#eeedfa;color:#5b53d9} .tg-nl{background:#fff1e6;color:#c9702a}
.tg-yf{background:#e6f6ee;color:#0e8a5c} .tg-xz{background:#fdecef;color:#c9455c}
.set .go{font-size:20px;color:var(--brand);font-weight:800;flex-shrink:0}
.rate{position:absolute;top:9px;right:12px;font-size:11.5px;font-weight:800}
/* 做题 */
#do,#done{display:none}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{font-size:24px;cursor:pointer;color:var(--sub);padding:4px 10px}
.progress{flex:1;height:9px;background:#e6e6f0;border-radius:6px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:.3s}
.count{font-size:13px;color:var(--sub);font-weight:700;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px 17px}
.qsrc{display:inline-block;font-size:11px;color:var(--sub);background:#f2f2f8;padding:3px 9px;border-radius:9px;

.qtag{display:inline-block;font-size:11px;color:#c9702a;background:#fff1e6;padding:3px 9px;border-radius:9px;
  font-weight:800;margin:0 0 11px 6px}
.qzh{font-size:15px;font-weight:800;line-height:1.7;margin-bottom:9px}
.qt{font-size:16.5px;line-height:1.95;font-weight:600}

.qt b.bk{color:var(--brand);font-weight:800}
.qhint{margin-top:11px;font-size:13px;color:var(--sub);font-weight:700;background:#f6f6fc;

  border-radius:14px;outline:none;margin-top:14px;font-family:inherit}
.ans:focus{border-color:var(--brand)}
.ans.right{border-color:var(--ok);background:#e8f7f0;color:var(--ok)}
.ans.wrong{border-color:var(--bad);background:#fdeceb;color:var(--bad)}
.opt{padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:15px;
  font-weight:600;margin-top:9px;cursor:pointer;line-height:1.6;display:flex;gap:9px}
.opt i{font-style:normal;font-weight:800;color:var(--sub);flex-shrink:0}
.opt.pick{border-color:var(--brand);background:#f4f3fd}
.opt.right{border-color:var(--ok);background:#e8f7f0}
.opt.right i{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdeceb}
.opt.wrong i{color:var(--bad)}
.res{margin-top:14px;border-radius:14px;padding:13px 15px;font-size:14px;line-height:1.85;display:none}
.res.show{display:block}
.res.ok{background:#e8f7f0;border:1px solid #bfe6d4}
.res.no{background:#fdeceb;border:1px solid #f5c9c9}
.res .rt{font-size:15px;font-weight:800;margin-bottom:6px}
.res .rk{font-weight:800;color:var(--ok)}
.res .ex{color:#4a5462;font-size:13.5px;line-height:1.9;margin-top:6px}
.res .wd{margin-top:9px;font-size:13px;background:rgba(255,255,255,.7);border-radius:9px;padding:8px 10px;font-weight:700}
.res .recall{margin-top:8px;font-size:12.5px;color:#c9702a;font-weight:800}

.btn:active{transform:scale(.98)}
.btn.ghost{background:#eeedfa;color:var(--brand);box-shadow:none;margin-top:10px}
.btn.sm{padding:13px;font-size:15px}
.essay{width:100%;min-height:150px;font-size:15.5px;line-height:1.9;padding:13px;border:2px solid var(--line);
  border-radius:14px;outline:none;margin-top:14px;font-family:inherit;resize:vertical}
.essay:focus{border-color:var(--brand)}
.model{white-space:pre-wrap;font-size:15px;line-height:1.9;background:rgba(255,255,255,.75);
  border-radius:10px;padding:11px 13px;margin-top:8px}
.selfcheck{margin-top:9px;font-size:13px;color:#7a5a1e;background:#fff8ec;border:1px solid #f0dfc0;
  border-radius:10px;padding:9px 11px;line-height:1.8;font-weight:700}
/* 阅读原文 */
.psg{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:17px;margin-bottom:12px}
.psg .pm{font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:9px;line-height:1.7}
.psg .pt{font-size:17px;font-weight:800;margin-bottom:9px}
.psg .pb{font-size:15.5px;line-height:1.95;white-space:pre-wrap}
.psg .pb u{text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:3px}
.psg .pb b.bk{color:var(--brand);font-weight:800;background:#eeedfa;border-radius:6px;padding:0 5px}
.psgfold{max-height:150px;overflow:hidden;position:relative}
.psgfold::after{content:'';position:absolute;left:0;right:0;bottom:0;height:56px;

.psgmore{text-align:center;font-size:13px;font-weight:800;color:var(--brand);padding:9px 0 0;cursor:pointer}
/* 成绩 */
.done{text-align:center;padding:26px 12px}
.done .em{font-size:56px}
.done h2{font-size:23px;margin:12px 0 6px}
.done p{color:var(--sub);font-size:14.5px;margin:4px 0;line-height:1.7}
.stat{display:flex;justify-content:center;gap:22px;margin:18px 0}
.stat b{font-size:26px;display:block}
.stat span{font-size:12px;color:var(--sub)}
.rec{margin-top:14px;background:#fff8ec;border:1px solid #f0dfc0;border-radius:12px;padding:12px 14px;

.wlist{margin-top:12px;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.witem{padding:10px 13px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.7}
.witem:last-child{border-bottom:none}
.witem b{color:var(--bad)}
.witem span{color:var(--ok);font-weight:800}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:8px;line-height:1.8}
@media (min-width:768px){
  .wrap{max-width:680px;padding:24px}
  h1{font-size:24px}
  .qt{font-size:18px}
  .btn{font-size:18px;padding:18px}
}

{id:'u4-s1r2-cloze',ord:404,u:4,sec:'Section 1　Reading (Ⅱ) 完形填空',tag:'能力',em:'🕊',mins:8,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：178　难度：★★★　语篇导读：本文介绍了人们通过结合飞行机器人和信鸽来高效送信',
  title:'Flying robots and homing pigeons',
  text:"In recent years, with more and more cars on the road, flying robots are used to deliver（递送）mail. Flying robots can __1__ mail to people's houses without having to deal with heavy __2__. But they will spend too much time in returning. A research centre is trying to improve its flying robots with the __3__ of homing pigeons（信鸽）.\n\nHoming pigeons are pigeons that are __4__ trained to fly home from somewhere else. In tests, researchers __5__ that homing pigeons were __6__ efficient（高效的）than flying robots at returning to their home. So the research centre is trying to use a flying robot, together with a __7__, to deliver mail. After the robot finishes its tasks, it can __8__ the pigeon back in the shortest possible time.\n\nAlthough it will cost more money to __9__ pigeons, the research centre says that it can __10__ time. And the time it saves will make up for the cost."},
 qs:[
 {n:1,t:'第 (1) 空',o:['invite','carry','blow','kick'],r:1,
  ex:"句意为：飞行机器人可以把邮件送到人们的家里……根据空后的 mail to people's houses 可知是飞行机器人把信件携带到人们家里，carry 符合语境。故选 B 项。"},
 {n:2,t:'第 (2) 空',o:['traffic','rain','fire','pollution'],r:0,
  ex:'根据上文的"In recent years, with more and more cars on the road, flying robots are used to deliver mail."可知，此处指交通。故选 A 项。'},
 {n:3,t:'第 (3) 空',o:['help','luck','treat','interest'],r:0,
  ex:'句意为：一家研究中心正试图在信鸽的帮助下改善其飞行机器人。根据下文讲到的让飞行机器人和信鸽一起送信件可推出，此处指在信鸽的帮助下，故用"with the help of…"，表示"在……的帮助下"。'},
 {n:4,t:'第 (4) 空',o:['poorly','carelessly','specially','musically'],r:2,
  ex:'根据空后的 to fly home from somewhere else 可知，信鸽是经过特殊训练的，故 specially 符合题意。'},
 {n:5,t:'第 (5) 空',o:['promised','joked','planned','found'],r:3,
  ex:'句意为：在测试中，研究人员发现，信鸽返回家园的效率比飞行机器人更高。根据语境，故选 D 项。'},
 {n:6,t:'第 (6) 空',o:['less','more','little','much'],r:1,
  ex:'句意见上一题解析。根据空后的 than 和语境可知，此处要用 efficient 的形容词比较级 more efficient，表示"更高效的"。'},
 {n:7,t:'第 (7) 空',o:['homing pigeon','big house','leading person','heavy car'],r:0,
  ex:'句意为：所以研究中心正在尝试使用一个飞行机器人和一只信鸽一起来投递信件。上下文都在讲信鸽对飞行机器人的帮助，故此处是说让信鸽和飞行机器人一起投递信件。'},
 {n:8,t:'第 (8) 空',o:['train','knock','follow','steal'],r:2,
  ex:'句意为：机器人完成任务后，它可以在最短的时间内跟随鸽子返回。上文讲到机器人返途耗时太久，又讲到信鸽擅长返回家园，由此可推出是让机器人跟随信鸽返回，follow 符合语境。故选 C 项。'},
 {n:9,t:'第 (9) 空',o:['dress','paint','clean','raise'],r:3,
  ex:'句意为：尽管养鸽子会花费更多的钱，但是研究中心表示，这样可以节省时间。上文讲到要让信鸽辅助飞行机器人送信件，结合选项可推出此处是指养鸽子，raise 符合语境。故选 D 项。'},
 {n:10,t:'第 (10) 空',o:['expect','show','kill','save'],r:3,
  ex:'根据下文的 And the time it saves 可知，此处是说节省时间，save 符合语境。故选 D 项。'}
]},

{id:'u4-s1r2-restore',ord:405,u:4,sec:'Section 1　Reading (Ⅱ) 阅读还原',tag:'能力',em:'🧷',mins:6,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：252　难度：★★　[2024 广东深圳期中]　语篇导读：本文主要介绍了如何实现当发明家的梦想',
  title:'How to become an inventor',
  text:'Have you ever had a wonderful idea and thought you would make a great invention? But you may not know what to do next. __11__ They will help you make your dreams come true and become an inventor.\n\nThe first thing is that you should do some research on the internet to see if anyone else has invented it. If not, you should search for patents on the internet to see if a patent was ever created for your type of invention. __12__ The easiest thing to do is to work with a company. It can help you present your ideas and get your products to the right companies. There is a very reputable company in Minnesota. It offers free advice for good ideas. If it thinks your product is marketable（有销路的）, it will introduce the right company for your invention. Call the company in Minnesota and make an appointment. You will be asked to bring a model of your invention and a complete description of your ideas. __13__ Then when you meet with the staff of the company, you can present them and they will tell you how marketable your invention is. If they decide to help you, they will work to present it to different companies and help you to go to the next step.\n\n__14__ But the benefits are worth the wait.\n\n【备选句子】\nA. It may take a year or two.\nB. You will be the next inventor.\nC. Write down exactly your invention.\nD. If there is no patent, go to the next step.\nE. Here are some steps that you can take.'},
 qs:[
 {n:11,t:'第 (11) 空该填哪一句？',
  o:['It may take a year or two.','You will be the next inventor.','Write down exactly your invention.','If there is no patent, go to the next step.','Here are some steps that you can take.'],r:4,
  ex:'根据上下文可知，E 选项（这里有一些你可以采取的步骤。）符合语境。'},
 {n:12,t:'第 (12) 空该填哪一句？',
  o:['It may take a year or two.','You will be the next inventor.','Write down exactly your invention.','If there is no patent, go to the next step.','Here are some steps that you can take.'],r:3,
  ex:'根据"If not, you should search for patents on the internet to see if a patent was ever created for your type of invention."可知，此处与专利有关，故 D 选项（如果没有专利，进入下一步。）符合语境。'},
 {n:13,t:'第 (13) 空该填哪一句？',
  o:['It may take a year or two.','You will be the next inventor.','Write down exactly your invention.','If there is no patent, go to the next step.','Here are some steps that you can take.'],r:2,
  ex:'根据上文和下文的"Then when you meet with the staff of the company, you can present them and they will tell you how marketable your invention is."可知，C 选项（确切地写下你的发明。）符合语境。'},
 {n:14,t:'第 (14) 空该填哪一句？',
  o:['It may take a year or two.','You will be the next inventor.','Write down exactly your invention.','If there is no patent, go to the next step.','Here are some steps that you can take.'],r:0,
  ex:'根据"But the benefits are worth the wait."可知，A 选项（这可能花费一两年的时间。）符合语境。'}
]},

{id:'u4-s2g-nl',ord:407,u:4,sec:'Section 2　Grammar 语法填空',tag:'能力',em:'🚲',mins:7,type:'read',
 psg:{meta:'[2024 广东肇庆期末]　语篇导读：本文主要介绍了自行车的相关信息',
  title:'The bicycle',
  text:"The bicycle with two wheels is one of the most useful __1__ (invention) in the world. The great painter Leonardo da Vinci __2__ (draw) the picture of a bicycle but people began to produce and ride it long after he died. Now, it __3__ (become) a common traffic tool since it was produced.\n\nWhen a person rides a bicycle, it needs very little energy to move, and there __4__ (be) no pollution when you are riding. However, some people don't go to work __5__ bicycle. It is not because they feel tired if they ride a bicycle to work. It's because __6__ number of cars on the roads has increased. They think it is dangerous __7__ (ride) a bicycle. So, more people put their bicycles away and go to work in __8__ (they) cars. In this way, the traffic jam must be __9__ (bad) than before. Maybe the best way to make riding safer __10__ more popular is to build roads only for bicycles and to make riding more convenient."},
 qs:[
 {n:1,t:'第 (1) 空',hint:'用所给词的适当形式：invention',a:['inventions'],
  ex:'"one of+the+形容词最高级+可数名词复数"意为"最……的……之一"，符合语境。故填 inventions。'},
 {n:2,t:'第 (2) 空',hint:'用所给词的适当形式：draw',a:['drew'],
  ex:'根据 began 及语境可知，此处为一般过去时，故填 drew。'},
 {n:3,t:'第 (3) 空',hint:'用所给词的适当形式：become',a:['has become'],
  ex:'根据 since it was produced 可知，此处用现在完成时，主语是 it，故填 has become。'},
 {n:4,t:'第 (4) 空',hint:'用所给词的适当形式：be',a:['is'],
  ex:'此处为 there be 句型，由 no pollution 可知 be 动词为第三人称单数形式，结合上下文可知该句为一般现在时，故填 is。'},
 {n:5,t:'第 (5) 空',hint:'不给词，根据句意填一个词',a:['by'],
  ex:'句意为：然而，一些人不骑自行车去上班。by bicycle 意为"骑自行车"。故填 by。'},
 {n:6,t:'第 (6) 空',hint:'不给词，根据句意填一个词',a:['the'],
  ex:'句意为：这是因为道路上的汽车数量增加了。"the number of…"意为"……的数量"，符合语境。故填 the。'},
 {n:7,t:'第 (7) 空',hint:'用所给词的适当形式：ride',a:['to ride'],

 {n:8,t:'第 (8) 空',hint:'用所给词的适当形式：they',a:['their'],

 {n:9,t:'第 (9) 空',hint:'用所给词的适当形式：bad',a:['worse'],

  t:'把这句话翻译成英文',hint:'提示：用 compared with; advantage',
  model:'Compared with other vehicles, the shared bike has more advantages.'},
 {n:3,essay:true,zh:'给美国笔友 Justin 写邮件介绍"共享单车"（80 词左右）',
  t:'假定你是李华，你的美国笔友 Justin 对中国的新四大发明（the high-speed railway, mobile payment, shared bikes, online shopping）很感兴趣，请你给他写一封邮件，对其中的"共享单车"做简单介绍。\n\n内容包括：（1）使用方法；（2）优势；（3）你的看法。\n要求：①80 词左右（开头和结尾已给出，不计入总词数）；②文中不得出现真实的姓名和校名；③可适当增加细节，使文章条理清晰、行文连贯；④标点正确，书面整洁。',
  hint:'开头已给出：Dear Justin, As we all know, China is developing at high speed and many kinds of new inventions have appeared.　结尾：Yours, Li Hua',
  model:"Dear Justin,\n\n　　As we all know, China is developing at high speed and many kinds of new inventions have appeared.\n\n　　I'm writing to tell you something about the shared bikes. It's very convenient to use the shared bike if you have a smartphone. What you need to do is to find a nearest shared bike through the APP, scan the QR code on the bike and ride it. Compared with other vehicles, the shared bike has more advantages. You can find a bike easily. Besides, it can reduce the traffic pressure and do good to the environment as well.\n\n　　I think it is a wonderful invention in China. Hope to ride a shared bike with you.\n\n　　　　　　　　　　　　　　　　　　Yours,\n　　　　　　　　　　　　　　　　　　Li Hua"}
]},

{id:'u4-wk',ord:412,u:4,sec:'外刊阅读速递',tag:'能力',em:'🌍',mins:8,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：274　难度：★★★★　素材来源：Skyfoxtv　语篇导读：本文主要介绍了梳子的相关信息',
  title:'The comb',
  text:"Used first as a grooming tool, the comb（梳子）has many forms for all types of hair. The type of comb you need will be different depending on your hair, as well as the purpose of the comb. Combing different hair requires a different comb.\n\nThe earliest use of the comb appeared about 5,000 years ago. In fact, many different kinds of combs came out in history. The ancient Egyptians could make combs. In ancient China, people used combs to show their social status（地位）. Over time, combs have become more efficient tools for hair care at present. Today, there are different combs for people to choose from and use.\n\nCombs serve different functions for different hair types and styles. People use combs to deal with disordered（凌乱的）or wet hair. Another common use for the comb is to <u>secure</u> hair in one position. During the 1900s, combs were the best choice of keeping hair beautiful.\n\nIn the earliest time, people made combs from bones of animals. But later, people began to make combs from wood or plastic. Now most people use these two kinds of combs because they are cheap. And high-end combs are made of expensive steel or gold.\n\nAt present, combs have different shapes and types in different colours. People can choose their favourite combs as they like. But when using combs, we should know we'd better not use others' combs. And we should wash or brush our combs with clean water as often as possible to keep them clean."},
 qs:[
 {n:1,t:'What does the type of comb you need depend on?',
  o:['Different hair and materials of the comb.','Different prices and the purpose of the comb.','Different hair and the purpose of the comb.','Different prices and materials of the comb.'],r:2,
  ex:'细节理解题。根据"The type of comb you need will be different depending on your hair, as well as the purpose of the comb."可知选 C 项。'},
 {n:2,t:'What do people use combs to do at present?',
  o:['To follow the fashion.','To give care to hair.','To show social status.','To find the history.'],r:1,
  ex:'细节理解题。根据"Over time, combs have become more efficient tools for hair care at present."可知选 B 项。'},
 {n:3,t:'What is the meaning of the underlined word "secure" in the passage?',
  o:['Keep.','Appear.','Cover.','Fill.'],r:0,
  ex:'词义猜测题。根据"Another common use for the comb is to secure hair in one position."可推知，此处指梳子的另一个普遍用途是将头发固定在一个位置上。故 secure 与 keep 意思相近。'},
 {n:4,t:'Why do most people use combs made of wood or plastic?',
  o:['Because they are soft.','Because they are short.','Because they are light.','Because they are cheap.'],r:3,
  ex:'细节理解题。根据"Now most people use these two kinds of combs because they are cheap."可知，大多数人使用木梳和塑料梳子是因为这两种梳子便宜。'},
 {n:5,t:'Which can be the best title for the passage?',
  o:['The future of the comb','The usage of the comb','The development of the comb','How to choose a comb'],r:2,
  ex:'主旨大意题。通读全文可知，本文主要介绍了梳子的发展。'}
]},

{id:'u4-b-yfxz',ord:413,u:4,sec:'B 阅读综合素养 · 语法选择',tag:'能力',em:'🍟',mins:7,type:'read',
 psg:{meta:'素养：文化意识　体裁：记叙文　词数：220　难度：★★★　[2024 广东广州期末]　语篇导读：本文主要介绍了炸薯片的来历',
  title:'How potato chips came out',
  text:"In 1853, a rich man was __1__ holiday and stayed at a hotel in Saratoga Springs, New York. One night, he went to a restaurant to have dinner. He __2__ at the menu and ordered a plate of fried potatoes.\n\nAfter a while, the dish was given to the man. But he didn't like it __3__ he thought the potatoes were too thick and not crispy enough. So he sent __4__ back to the kitchen.\n\nGeorge Crum was the cook of that restaurant. After __5__ that, he cut the potatoes __6__ and sent them to that man again. __7__ the man still thought the potatoes were not thin enough. Crum got angry and decided __8__ him a lesson. He __9__ cut the potatoes much thinner and cooked them for a long time. After they became crispy, he put some salt on them and served the new dish to the man for __10__.\n\nTo his __11__, the man liked the new dish very much. And many customers wanted to try __12__, which began to appear on the menu __13__ \"Saratoga Chips\". Soon the potato chips became popular in __14__ world. Crum opened his own restaurant __15__ this kind of potato chips."},
 qs:[
 {n:1,t:'第 (1) 空',o:['at','on','in','of'],r:1,ex:'固定搭配 on holiday 意为"在度假"。故选 B 项。'},
 {n:2,t:'第 (2) 空',o:['look','looks','looked','looking'],r:2,
  ex:'根据 ordered 可知，此处为一般过去时，动词用过去式。故选 C 项。'},
 {n:3,t:'第 (3) 空',o:['because','however','or','so'],r:0,
  ex:'设空前后内容之间为因果关系，且为前果后因。故选 A 项。'},
 {n:4,t:'第 (4) 空',o:['their','theirs','they','them'],r:3,
  ex:'动词 sent 后接人称代词宾格 them，表示"它们"。故选 D 项。'},
 {n:5,t:'第 (5) 空',o:['know','knew','knowing','known'],r:2,ex:'After 后接动词-ing 形式。故选 C 项。'},
 {n:6,t:'第 (6) 空',o:['thin','thinner','thinnest','more thin'],r:1,
  ex:'根据上下文可知，此处表示"更薄"，应用形容词比较级。thin 的比较级为 thinner，故选 B 项。'},
 {n:7,t:'第 (7) 空',o:['If','As','When','But'],r:3,ex:'根据语境可知，此处表转折，故选 D 项。'},
 {n:8,t:'第 (8) 空',o:['teach','to teach','teaching','to teaching'],r:1,
  ex:'teach sb a lesson 意为"给某人一个教训"，decide to do sth 意为"决定做某事"。'},
 {n:9,t:'第 (9) 空',o:['angry','angrier','angriest','angrily'],r:3,ex:'此处应用副词修饰动词，故选 D 项。'},
 {n:10,t:'第 (10) 空',o:['himself','him','his','he'],r:0,
  ex:'for oneself 意为"亲自"，为固定搭配，符合语境。'},
 {n:11,t:'第 (11) 空',o:['surprise','surprised','surprising','surprisingly'],r:0,
  ex:"to one's surprise 意为\"令某人惊讶的是\"，为固定搭配。"},
 {n:12,t:'第 (12) 空',o:['its','it','them','they'],r:1,ex:'此处应用 it 指代 the new dish，故选 B 项。'},
 {n:13,t:'第 (13) 空',o:['from','with','to','as'],r:3,ex:'根据语境可知，此处表示"作为"，故选 D 项。'},
 {n:14,t:'第 (14) 空',o:['a','an','the','/'],r:2,ex:'固定搭配 in the world 意为"全世界"，符合语境。'},
 {n:15,t:'第 (15) 空',o:['sell','sells','to sell','sold'],r:2,ex:'此处应用动词不定式表示目的。故选 C 项。'}
]},

{id:'u4-b-pipei',ord:414,u:4,sec:'B 阅读综合素养 · 信息匹配',tag:'能力',em:'🔗',mins:7,type:'read',
 psg:{meta:'素养：思维品质　体裁：应用文　词数：364　难度：★★★　下面的材料 A—F 分别介绍了六个发明与创造，请根据五个人的情况，帮助他们选出想要的发明与创造（选项中有一项为多余项）',
  title:'六个发明与创造 A—F',
  text:'A. A Special Watch\n　It can not only tell you the right time and the temperature. It also has technology that can collect a lot of health data. It can record your every movement and even tell you whether you sleep well or not.\n\nB. Time & Temperature Glasses\n　These special glasses show the time above your right eye and the temperature above your left eye. Wearing them is surely easier than wearing a watch, and you never have to guess the temperature.\n\nC. Smell This\n　Smell This is useful for you to make sure your breath smells nice. Smell This covers your nose and your mouth, so it is easy to smell the air that comes out of your mouth.\n\nD. So-14 Cooker\n　The cooker is much "friendlier" than other cookers because it produces less smoke and the user would be less likely to have breathing illnesses from harmful smoke.\n\nE. Kuaisou\n　The new chopsticks, called Kuaisou, are able to pick up a variety of reading materials on food freshness, acidity（酸性）and nutrients（营养物）. They allow people to take food safety in their own hands through an app on smartphones.\n\nF. Banana Suitcase\n　Are you worrying about the banana in your bag? If you put your banana in the Banana Suitcase, it can keep a banana safe, delicious, and looking like a banana!'},
 qs:[
 {n:16,t:'Sally often takes a banana to school for lunch. She often puts a banana in her bag in the morning, and when she opens the bag at noon, the banana looks as if someone drove a car over it.',

  ex:'根据"when she opens the bag at noon, the banana looks as if someone drove a car over it"可知，香蕉手提箱适合她。故选 F 项。'},
 {n:17,t:"Rose wants to know whether her breath smells nice or not, but it's difficult to know, because it's very hard to smell the air that comes out of her own mouth.",
  o:['A 智能手表（时间/温度/健康数据）','B 时间温度眼镜','C Smell This 口气检测','D So-14 炉具（少烟）','E Kuaisou 智能筷子（食品安全）','F 香蕉手提箱'],r:2,
  ex:"根据 it's very hard to smell the air that comes out of her own mouth 可知，C 项中提及的发明适合罗丝。故选 C 项。"},
 {n:18,t:"John used to have a watch that could tell him the time and temperature during the day. However, it doesn't work these days and he wants to buy something that can be worn more easily.",
  o:['A 智能手表（时间/温度/健康数据）','B 时间温度眼镜','C Smell This 口气检测','D So-14 炉具（少烟）','E Kuaisou 智能筷子（食品安全）','F 香蕉手提箱'],r:1,
  ex:'题干中的 used to have a watch that could tell him the time and temperature during the day 及 that can be worn more easily 与 B 项中的"These special glasses show the time above your right eye and the temperature above your left eye."及 Wearing them is surely easier than wearing a watch 相呼应。故选 B 项。'},
 {n:19,t:'It is reported that many people die as a result of breathing in smoke from wood-powered or coal-powered stoves while cooking. Anna wants to buy a cooker to avoid this problem.',

 {n:20,t:'Bruce often reads the news about food safety from newspapers, magazines or TV. It has great influences on people\'s health. He wants to find something that can help him check whether the food is safe or not.',

{id:'u4-b-biaoda',ord:415,u:4,sec:'B 阅读综合素养 · 阅读与表达',tag:'能力',em:'🔥',mins:7,type:'read',
 psg:{meta:'素养：文化意识　体裁：说明文　词数：208　难度：★★★　[2024 辽宁辽阳期末]　语篇导读：短文主要介绍了历史上火的使用和发展',
  title:'The use of fire',
  text:'Perhaps the use of fire is the most important event in human history. Lightning（闪电）would hit a tree in a forest and cause a large fire. People probably used the fire from lightning. People would use a small piece of burning wood from the fire at first.\n\nWith these fires, ancient people could cook food and keep warm. They could also see more easily at night. Of course, the piece of wood would soon stop burning, and they would not be able to create fire from it again. They had to find other ways to create fire by themselves. One way to create fire was by rubbing（摩擦）two pieces of wood together. This was difficult because it took a lot of time. Another way was by hitting two rocks together. This was also not an easy job. An easier way was by using a piece of glass and the light from the Sun to start a fire. However, it needed a good piece of glass and a sunny day for this.\n\nInventors in China created matches around 577 AD. However, early matches were difficult to make and could be dangerous to use. People did not develop the really useful and safe matches until the 1850s.'},
 qs:[
 {n:21,t:'What event might be the most important in human history?',
  hint:'用英文回答（三四个词就行）',a:['the use of fire','using fire'],
  ex:'根据"Perhaps the use of fire is the most important event in human history."可知答案。'},
 {n:22,essay:true,t:'What could ancient people do with fires?',
  hint:'用英文回答，一句话（写完对照参考答案）',
  model:'With fires, ancient people could cook food, keep warm and see more easily at night.'},
 {n:23,t:'How many ways could people use to create fire by themselves in the past?',
  hint:'用英文回答（一个词）',a:['three','3'],
  ex:'根据"One way to create fire was by rubbing two pieces of wood together."及"Another way was by hitting two rocks together."和"An easier way was by using a piece of glass and the light from the Sun to start a fire."可知，共有三种取火方法。'},
 {n:24,essay:true,t:'Imagine you are an ancient person who has just learnt to create fire. How would this change your daily life? Write 30 words or more.',
  hint:'开放性试题，言之有理且无语法错误即可（写 30 词以上）',
  model:'If I could create fire, my life would be improved greatly. I could stay warm in cold weather and have light at night for longer activities. Fire would also help scare away wild animals, making my home safer. Additionally, I could use fire to make tools and pottery, advancing my skills and daily comfort.'}
]},

{id:'u4-c-cloze',ord:416,u:4,sec:'C 单元限时检测 · 完形填空',tag:'能力',em:'⏱',mins:10,type:'read',
 psg:{meta:'单元限时检测（建议 60 分钟）第Ⅰ题　完形填空（10 分）　语篇导读：文章主要介绍了一款新型智能水杯',
  title:'Vessyl—the smart cup',
  text:'A famous designer（设计师）and a university student produce a new cup called Vessyl. They have spent several years __1__ it. The smart cup can not only tell Coca Cola from Pepsi Cola, __2__ also tell people whether they should drink water or not.\n\nWhen people __3__ liquid（液体）into this smart cup, a few seconds（秒）later, it can check this kind of liquid and tell them what it is. Then it gives __4__ information about the drink, such as its sugar, fat and calorie. When people put the cup in their __5__, it can also show them the condition of their bodies. If they are __6__, Vessyl can tell them to drink water.\n\n"My partner and I want people to __7__ healthy. In modern society, people are usually __8__ busy to do exercise, or even drink enough water every day. They have much __9__ of work. We produce this smart cup so that people can make a choice __10__," the designer said.'},
 qs:[
 {n:1,t:'第 (1) 空',o:['study','studying','studied','to studying'],r:1,
  ex:'spend some time (in) doing sth 意为"花费多长时间做某事"，故选 B 项。'},
 {n:2,t:'第 (2) 空',o:['and','though','nor','but'],r:3,
  ex:'固定结构"not only… but also…"意为"不仅……而且……"，故选 D 项。知识拓展："not only… but also…"连接两个主语时，谓语动词的形式要和离它最近的主语保持一致。'},
 {n:3,t:'第 (3) 空',o:['pour','pull','lift','regard'],r:0,
  ex:'根据 liquid 和 into this smart cup 可知，此处表示把液体"倒"进这个智能的杯子里，pour 意为"倒"。故选 A 项。'},
 {n:4,t:'第 (4) 空',o:['a few','a lot','lots of','many'],r:2,
  ex:'设空后的 information 是不可数名词，a few 和 many 都用于修饰可数名词复数，故排除 A 项和 D 项；a lot 不能用于修饰名词，排除 B 项；lots of 既可以修饰可数名词复数也可以修饰不可数名词，符合语境。故选 C 项。'},
 {n:5,t:'第 (5) 空',o:['desks','hands','bags','eyes'],r:1,
  ex:'根据 it can also show them the condition of their bodies 可知，此处表示把杯子放在手里。故选 B 项。'},
 {n:6,t:'第 (6) 空',o:['full','hungry','thirsty','awful'],r:2,
  ex:'根据 Vessyl can tell them to drink water 可知，此处表示如果他们渴了，thirsty 意为"渴的"。故选 C 项。'},
 {n:7,t:'第 (7) 空',o:['carry','have','touch','keep'],r:3,
  ex:'此处表示"我的伙伴和我想要让人们保持健康"，keep healthy 意为"保持健康"，符合语境。故选 D 项。'},
 {n:8,t:'第 (8) 空',o:['too','to','so','very'],r:0,
  ex:'"too… to do sth"意为"太……以至于不能做某事"，符合语境。故选 A 项。'},
 {n:9,t:'第 (9) 空',o:['danger','pressure','power','laughter'],r:1,
  ex:'由前文内容可知，此处表示人们有很多工作压力，pressure 意为"压力"。故选 B 项。'},
 {n:10,t:'第 (10) 空',o:['quietly','hardly','wisely','recently'],r:2,
  ex:'根据前文内容可知，此处表示"我们生产这种智能的杯子是为了让人们能明智地作出选择"，wisely 意为"明智地"。故选 C 项。知识拓展：wisely 作副词，其形容词形式是 wise，意为"明智的；合理恰当的"；固定短语 be wise after the event 意为"事后聪明"。'}
]},

{id:'u4-c-readA',ord:417,u:4,sec:'C 单元限时检测 · 阅读理解 A',tag:'能力',em:'♻️',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解（14 分）A 篇　语篇导读：本文主要介绍了电子垃圾的相关内容',
  title:'E-waste',
  text:'Electronic waste（电子垃圾）, also known as "E-waste", is used to describe the waste from useless electronics such as computers, phones, fridges, washing machines, TVs and so on. Most of these electronics are not often rubbish, but just given up. In 2019, the world produced 53.6 million tons of e-waste, and the world\'s e-waste will reach 74.7 million tons by 2030.\n\nLast week, Guangming Research Centre made surveys among 1,000 residents（居民）in Xingfu community. The surveys were mainly about different kinds of e-waste and how the residents deal with e-waste. The diagrams below show the results.\n\n【Diagram Ⅰ】居民每年产生的各类电子垃圾（柱状图）\n　Computers 13%　Phones 65%　Fridges 7%　Washing machines 10%　TVs 5%\n\n【Diagram Ⅱ】居民如何处理电子垃圾（饼图）\n　Residents who throw away e-waste 80%\n　Residents who collect and recycle e-waste 15%\n　Residents who do not deal with e-waste 5%\n\nE-waste is the world\'s fastest-growing kind of waste, and only a small part of it is collected and recycled. Some residents think they should recycle e-waste, because e-waste includes many valuable metals, such as gold, silver and so on. They say they try to repair some electronics rather than buy new ones. They also give away their electronics which they don\'t like any more to people in need.'},
 qs:[

 {n:12,t:'According to Diagram Ⅱ, 15% of the residents deal with e-waste ___.',
  o:['by doing nothing','by selling it cheaply','by throwing it away','by collecting and recycling it'],r:3,
  ex:'细节理解题。根据第二个图表中的 Residents who collect and recycle e-waste 15% 可知，15% 的居民通过收集和回收来处理电子垃圾。'},
 {n:13,t:'From the passage, we can know ___.',
  o:['people will give away their electronics if they are broken','now some people are trying to deal with e-waste properly','e-waste will become the most useful in the residents\' homes','most people are ready to collect and recycle e-waste nowadays'],r:1,
  ex:'细节理解题。根据"Some residents think they should… in need."可知，现在一些人正试图妥善处理电子垃圾。'}
]},

{id:'u4-c-readB',ord:418,u:4,sec:'C 单元限时检测 · 阅读理解 B',tag:'能力',em:'🍳',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解 B 篇　语篇导读：本文主要介绍了"会说话的厨房"',
  title:'The French Digital Kitchen',
  text:'What do you think of a "talking kitchen"? A French Digital Kitchen has been developed at Newcastle University in the UK. It teaches students how to cook French food and speak French at the same time. For the first time, students can learn a language by following cooking steps.\n\nAll grammar and ▲ have been carefully chosen to make sure the users can understand French well. After learning for some time, the users can test themselves by doing a short test on the computer.\n\nThe kitchen project was started by Professor Paul Seedhouse. He became interested in the idea after he visited another kind of talking kitchen. He said, "The purpose of the French Digital Kitchen is to make learning a language more interesting and more educational."\n\nHow does the kitchen work? There is a computer in the kitchen. With this computer, the users can first choose a French recipe that they want to follow. Using information in the computer, the kitchen starts to "teach" the users how to make a French dish. If you follow the instructions on the computer, it moves on to the next. If you go wrong, the program goes back and repeats the recipe or information. At any time, the users can also ask the kitchen to repeat the recipe or any information.\n\nThe new kitchen can be used in schools, universities and even people\'s homes. The researchers will also be developing the European Digital Kitchen, for the next three years.'},

 {n:16,t:"If the users don't follow the instructions on the computer, the kitchen ___.",
  o:['chooses another recipe','goes on to the next step','repeats the recipe or information','stops working at once'],r:2,
  ex:'细节理解题。根据第四段的倒数第二句"If you go wrong, the programme goes back and repeats the recipe or information."可知选 C 项。'},
 {n:17,t:'The passage is written to ___.',
  o:['show you how a computer works','introduce the French Digital Kitchen','teach you how to cook French food','tell you the importance of languages'],r:1,
  ex:'推理判断题。本文主要介绍了一种新的法语数字厨房项目。故选 B 项。'}

{id:'u4-c-restore',ord:419,u:4,sec:'C 单元限时检测 · 阅读还原',tag:'能力',em:'☎️',mins:8,type:'read',
 psg:{meta:'第Ⅲ题　阅读还原（10 分）　[2024 广东河源期末]　语篇导读：本文主要介绍了电话的发明者',
  title:'Who invented the telephone?',
  text:"Most of us think the telephone was invented by Alexander Graham Bell. __18__ In fact, an Italian named Antonio Meucci was officially recognized（官方认定）as the inventor a few years ago. Who is Meucci and why wasn't he known for his invention at the time?\n\nAntonio Meucci was born in Italy in 1808. He studied engineering and drawing. During his studies, Meucci started to do experiments with electricity. __19__ When two places were connected with a wire（电线）, people in those places could hear each other.\n\nIn 1850, Meucci and his wife moved to New York. Meucci was worried about his wife, because she had become very ill. __20__ To solve this problem, he connected metal cables between his home and his workshop. This way, they could talk to each other conveniently.\n\nMeucci asked a group of people to see his new invention. They listened happily as the voice of a singer was heard through the wires. __21__ Even worse, Meucci didn't take out a patent on his invention. Meanwhile, Alexander Graham Bell was working on the same idea and in 1876 the patent for the telephone was given to him.\n\nIn 2002, more than a century after Meucci's death, his work was finally recognized by the government. __22__\n\n【备选句子】\nA. So Bell is known in the whole world.\nB. However, he wasn't the first person to think of the idea.\nC. He needed to keep in touch with her at all times.\nD. He will now be known all over the world as the telephone's inventor.\nE. Unluckily, only a few people knew this talk.\nF. He found that sound could travel through metal cables."},

  ex:'根据"Most of us think the telephone was invented by Alexander Graham Bell."和"In fact, an Italian named Antonio Meucci was officially recognized as the inventor a few years ago."可知，选项 B（然而，他不是第一个想到这个主意的人。）符合语境。'},

  ex:'根据"When two places were connected with a wire, people in those places could hear each other."可知，选项 F（他发现声音可以通过金属电缆传播。）符合语境。'},

{id:'u4-c-tianci',ord:420,u:4,sec:'C 单元限时检测 · 语篇填词',tag:'基础',em:'🖇',mins:5,type:'read',
 psg:{meta:'第Ⅳ题　语篇填词（5 分）　语篇导读：本文介绍了电脑的发展、其广泛用途及其局限性',
  title:'Computers in our life',
  text:'Computers are very common in our modern life now. The first computers were bigger than cars. But now they are becoming much smaller and better. Some computers are so tiny that you may be __23__ of them. There is probably one inside your TV or washing machine. You __24__ on computers more than you can realize.\n\nWe can do many things with computers. For example, we can use computers to calculate things. They can calculate things at a very fast speed and almost never give __25__ answers. We can also type and draw things with them. In __26__, computers can do important jobs like operating railways and flying planes and spaceships.\n\nHowever, computers cannot be cleverer than us. Our __27__ can produce new ideas but computers cannot. But one day computers may be able to do a better job than human beings.'},
 qs:[
 {n:23,t:'第 (23) 空',hint:'首字母提示：u',a:['unaware'],
  ex:'句意为：有些电脑如此小，以至于你可能注意不到它们。根据 Some computers are so tiny 和首字母提示可知，此处指注意不到它们，故填 unaware。'},
 {n:24,t:'第 (24) 空',hint:'首字母提示：d',a:['depend'],w:'depend',

{id:'u4-c-xiezuo',ord:421,u:4,sec:'C 单元限时检测 · 书面表达',tag:'写作',em:'📝',mins:20,type:'essay',
 qs:[
 {n:28,essay:true,zh:'给校报投稿，介绍学校科技节的情况并谈谈感受（80 词左右）',
  t:'[2024 广东清远期中] 上周五，你们学校举办了一年一度的科技节，全校学生都参与其中。假设你是李华，请根据以下表格内容给校报投稿，介绍你校科技节的情况，并谈谈自己的感受。\n\n　活动 1：三分之二的学生看电影 —— 观看一部有关发明家爱迪生的电影\n　活动 2：其余学生参加机器人比赛\n　　　外观：一些机器人像汽车一样大，一些像杯子一样小\n　　　功能：① 回答学生的问题，减少电脑和手机的使用　②……（自行补充至少一点）\n　感受：① 有意义　②……（自行补充至少一点）\n\n要求：①80 词左右（开头和结尾已给出，不计入总词数）；②文中不得出现真实的姓名和校名；③文章须包含表格提示的全部内容，可适当增加细节；④标点正确，书面整洁。\n参考词汇：机器人 robot　爱迪生 Edison　比赛 competition',
  hint:'标题 The Science Festival in Our School　开头：Last Friday, our school held a science festival. All the students had a really good time.　结尾：I can\'t wait to take part in the science festival next year.',
  model:"The Science Festival in Our School\n\n　　Last Friday, our school held a science festival. All the students had a really good time.\n\n　　Two thirds of the students went to the cinema. They watched a film about the inventor Edison. The rest of the students attended the robot competition. These robots have different shapes. Some robots are as big as cars. Some are as small as cups. Some robots can answer the students' questions. This reduces the use of computers and mobile phones. Some robots are like snakes. When the buildings fall down, this kind of robots can help look for people under the buildings. I think this festival is meaningful. I'm amazed at how fast technology is developing.\n\n　　I can't wait to take part in the science festival next year."}
]},

{id:'m1-readA',ord:902,u:9,sec:'期中综合测试 · 阅读理解 A',tag:'能力',em:'👓',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解（16 分）A 篇　[2024 辽宁鞍山期末]　语篇导读：本文主要介绍了一款 AR 眼镜',
  title:'AR glasses for deaf people',
  text:'Imagine a group of people are talking about something happily. But there is one man who cannot follow them. Why? He has a hearing problem. How can we help such people?\n\nNow a new and exciting invention allows deaf people to see conversations in real time. Using augmented reality（AR，增强现实技术）glasses and a smartphone, deaf people are also able to join in everyday conversations.\n\nThe AR glasses were developed by Dan Scarfe after he had a Christmas dinner with his family. The man saw his 97-year-old hearing-impaired grandfather sitting alone in silence while the rest of the family were talking excitedly. The images of his grandfather always watching TV shows with subtitles（字幕）crossed Scarfe\'s mind. He suddenly realized that maybe the AR glasses could help.\n\nScarfe got to work, working with Nreal, an AR glasses maker. Six months later, a new pair of AR glasses came out. The glasses have a microphone that receives the audio（音频）from the environment and sends it to a connected smartphone. The phone then creates subtitles from that audio and these subtitles then appear on the user\'s glasses screen.\n\nThe company first tested the glasses in the UK. The UK was chosen as a testing ground as over 13 million adults in Britain have hearing loss. However, when the product goes global, it could change the lives of millions of people.\n\nThis is a great change for the deaf. Mark Atkinson, who is using the AR glasses, said, "As a deaf person myself, I <u>am blown away by</u> this new technology. When I tried on the glasses for the first time, I was so happy. Real-time subtitles made me become part of the conversation as never before."'},
 qs:[
 {n:11,tag:'新考法·选项选择',t:'What tools must a deaf person have if he wants to join in the conversation?\n① A microcomputer.　② A smartphone.\n③ A pair of AR glasses.　④ A laptop.',
  o:['①②','②③','①③','②④'],r:1,
  ex:'细节理解题。根据"Using augmented reality glasses and a smartphone, deaf people are also able to join in everyday conversations."可知选 B 项。'},
 {n:12,t:'Who made Dan Scarfe want to develop the AR glasses?',
  o:['His father.','His friend.','His grandfather.','A glasses maker.'],r:2,
  ex:'细节理解题。根据"The man saw his 97-year-old hearing-impaired grandfather sitting alone in silence while the rest of the family were talking excitedly."可知，是祖父让他想要开发 AR 眼镜。'},
 {n:13,t:'Why was the UK chosen as a testing ground for the AR glasses?',
  o:['Because it has a large population with hearing loss.','Because the company Nreal is based in the UK.','Because the government provided the money.','Because Dan Scarfe is from the UK.'],r:0,
  ex:'细节理解题。根据"The UK was chosen as a testing ground as over 13 million adults in Britain have hearing loss."可知，这是因为英国有很多成年人有听力丧失。'},
 {n:14,t:'What does the underlined part "am blown away by" probably mean?',
  o:['Be scared of.','Be excited at.','Be worried about.','Be bored with.'],r:1,
  ex:'词义猜测题。根据"As a deaf person myself, I am blown away by this new technology. When I tried on the glasses for the first time, I was so happy."可知，他因这种技术感到兴奋。'}
]},

{id:'m1-readB',ord:903,u:9,sec:'期中综合测试 · 阅读理解 B',tag:'能力',em:'🐝',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解 B 篇　[2025 广东深圳期末]　语篇导读：本文主要介绍了蜜蜂经过训练后可以辨认数量并有很强的运算能力',
  title:'Bees can do maths',
  text:'Can you say the meaning of "zero"? Can you do addition and subtraction（加减法）? Most people can. But do you know bees can do these things too? A study shows that bees have even greater maths abilities. After some training, they can know the difference between even numbers（ending with 0, 2, 4, 6 and 8）and odd numbers（ending with 1, 3, 5, 7 and 9）.\n\nSome Australian scientists put up different cards with an odd or even number of triangles（三角形）. They used the numbers 1 to 10. Then they trained the first group of bees to choose odd numbers and the second group to choose even numbers. If a bee flew to the right card, it would get sugar water. If it chose the wrong card, it got bitter（苦的）water.\n\nIn a short time, all the bees knew what odd numbers or even numbers were. They could fly to the right numbers 80% of the time. After that, the scientists added new cards with the numbers 11 and 12. The bees never saw the numbers in their training before, but they could choose rightly 70% of the time. Surprisingly, the bees even learnt odd numbers more quickly than people.\n\nHow did the bees learn the numbers so fast? Scientists didn\'t have a clear idea. But they believe if they find the answer, it will help them build better and faster computers. After all, a bee\'s brain must be smaller than ours!'},
 qs:[
 {n:15,tag:'新考法·写作手法',t:'How does the passage start?',
  o:['By listing facts.','By giving examples.','By asking questions.','By using pictures.'],r:2,
  ex:'细节理解题。根据"Can you say the meaning of \'zero\'? Can you do addition and subtraction? Most people can. But do you know bees can do these things too?"可知，文章是通过问问题的方式开始的。'},
 {n:16,tag:'新考法·选项选择',t:'Which of the following card should the second group of bees fly to?\n（书上配了四张卡片图：① 3 个三角形　② 4 个三角形　③ 6 个三角形　④ 7 个三角形）',
  o:['①④','②③','①②','③④'],r:1,
  ex:'细节理解题。根据 the second group to choose even numbers 可知，第二组选择偶数，所以②③（4 个和 6 个）符合题意。温馨提示：even 在本句中作形容词，意为"双数的；偶数的"。'},
 {n:17,t:'Which of the following is TRUE according to the passage?',
  o:['Our brains might be smarter than bees.','Bees like bitter water rather than sugar water.','After training, bees can learn even numbers more quickly than people.','After training, bees can know the difference between even numbers and odd numbers.'],r:3,
  ex:'细节理解题。根据"After some training, they can know the difference between even numbers… and odd numbers…"可知，经过训练蜜蜂可以知道偶数和奇数之间的区别。'},
 {n:18,t:'What can we learn from the last paragraph?',
  o:['Bees may be able to contribute to science and technology.','Bees like odd numbers better than even numbers.','Scientists know how bees learn numbers.','Scientists know why bees can tell different numbers.'],r:0,
  ex:'推理判断题。根据最后一段内容可知，蜜蜂可能对科技有所贡献。'}
]},

{id:'m1-yf',ord:904,u:9,sec:'期中综合测试 · 语法填空',tag:'能力',em:'🦋',mins:8,type:'read',
 psg:{meta:'第Ⅲ题　语法填空（10 分）　[2025 辽宁沈阳期中]　新素材·中国文化：庄子　语篇导读：本文介绍了庄子的相关信息',
  title:'Zhuangzi',
  text:"Zhuangzi, whose given name was Zhou, lived during the Warring States Period. He told us many meaningful __19__ (story) in his book named Zhuangzi. Most of __20__ (he) ideas were included in this book. In his opinion, being free is much more important than having a rich and famous life. He believed both life and death were __21__ (nature). He also __22__ (advise) people to keep healthy. Zhuangzi often showed his ideas in the form of stories. Zhuangzi Dreaming of Becoming a Butterfly is the __23__ (famous) of all. One night, Zhuangzi went to sleep and dreamed that he was __24__ butterfly. He flew freely and __25__ (happy) among flowers. It was amazing for him to see the world as a butterfly. __26__ a strange dream! After waking up, Zhuangzi couldn't help __27__ (think) about a question, \"Was I Zhuangzi dreaming of being a butterfly, or was I a butterfly dreaming of being Zhuangzi?\" __28__ fact, Zhuangzi used this dream to tell us that there must be a difference between all things. However, the difference would go away sometimes."},
 qs:[
 {n:19,t:'第 (19) 空',hint:'用所给词的适当形式：story',a:['stories'],
  ex:'句意为：他在他的名为《庄子》的书中告诉了我们许多有意义的故事。根据 many 可知，此处用可数名词的复数形式。故填 stories。'},
 {n:20,t:'第 (20) 空',hint:'用所给词的适当形式：he',a:['his'],
  ex:'句意为：他的大部分思想都被收录在这本书中。此处指"庄子的思想"，用形容词性物主代词 his。'},
 {n:21,t:'第 (21) 空',hint:'用所给词的适当形式：nature',a:['natural'],
  ex:'句意为：他认为生与死都是自然的。此处表示"自然的"，用形容词作表语。故填 natural。'},
 {n:22,t:'第 (22) 空',hint:'用所给词的适当形式：advise',a:['advised'],
  ex:'句意为：他还建议人们保持健康。根据上下文可知，此处用一般过去时，动词用过去式。故填 advised。'},
 {n:23,t:'第 (23) 空',hint:'用所给词的适当形式：famous',a:['most famous'],
  ex:'句意为：《庄周梦蝶》是所有故事中最著名的。根据 is the 和 of all 可知，此处用形容词的最高级形式。'},
 {n:24,t:'第 (24) 空',hint:'不给词，根据句意填一个词',a:['a'],
  ex:'句意为：一天晚上，庄子去睡觉，梦见他是一只蝴蝶。此处表示泛指，用不定冠词；butterfly 是发音以辅音音素开头的单词。故填 a。'},
 {n:25,t:'第 (25) 空',hint:'用所给词的适当形式：happy',a:['happily'],
  ex:'句意为：他在花丛中自由快乐地飞翔。此处修饰动词，应用副词。故填 happily。'},
 {n:26,t:'第 (26) 空',hint:'不给词，根据句意填一个词',a:['what'],
  ex:'句意为：多么奇怪的梦啊！此处是感叹句，中心词是单数名词 dream，应用"What+a(n)+adj.+n.!"结构，且设空位于句首。故填 What。'},
 {n:27,t:'第 (27) 空',hint:'用所给词的适当形式：think',a:['thinking'],
  ex:"句意为：醒来后，庄子忍不住思考一个问题……固定搭配 can't help doing sth 表示\"忍不住做某事\"。故填 thinking。"},
 {n:28,t:'第 (28) 空',hint:'不给词，根据句意填一个词',a:['in'],
  ex:'句意为：事实上，庄子用这个梦告诉我们，万物之间必有区别。固定搭配 in fact 表示"事实上"。设空处位于句首，故填 In。'}
]},

{id:'m1-xiezuo',ord:905,u:9,sec:'期中综合测试 · 书面表达',tag:'写作',em:'📝',mins:25,type:'essay',
 qs:[
 {n:29,essay:true,zh:'报告英语口语能力问卷调查数据并谈谈如何提高口语（80—120 词）',
  t:'某中学对八年级新生进行了英语口语能力问卷调查，以下是其中两个问题的调查数据。假如你是该校八年级新生，请向你的班级报告下列调查数据并谈谈如何提高英语口语水平。\n\n【问题一】How often do you practise speaking English?（饼图）\n　usually 45%　sometimes 38%　hardly ever 17%\n\n【问题二】How do you practise speaking English?（条形图）\n　speak more in class 67%　talk with friends in English 39%　other ways to practise 58%\n\n要求：①80—120 词，开头已给出，不计入总词数；②文中不能出现自己的姓名和所在学校的名称。\n参考信息：①描述问卷调查结果（频率、方法）；②学习口语的方法。',
  hint:'开头已给出：The results of the survey show that 17% of the students hardly ever practise speaking English.　　先把两张图的数据说清楚，再写自己的建议',
  model:"The results of the survey show that 17% of the students hardly ever practise speaking English. 45% of the students usually practise speaking English and 38% of the students practise speaking English sometimes. As for the way of practising English, most students speak more in class. Some of the students talk with friends in English. And some students practise speaking English in other ways.\n\n　　In my opinion, we should talk with our partners in English as much as we can. Also, we should often listen to English stories in order to improve our understanding about English. Never be afraid of speaking English in front of others! This is quite important. Finally, we should learn more English words. Only in this way can we be good English speakers!"}
]},

{id:'u5-s1r1-nl',ord:502,u:5,sec:'Section 1　Reading (Ⅰ)',tag:'能力',em:'🏫',mins:8,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：293　难度：★★★　语篇导读：本文主要介绍了世界上的一些学校正在建立智慧校园',
  title:'Smart campuses',
  text:'What will the schools in the future look like? Smart campuses（校园）are being built all over the world. Their high-tech features（特性）help students learn more effectively（有效地）and safely, as well as bring convenience（便利）to teachers.\n\nThe University of British Columbia has built Canada’s first 5G-powered smart campus, according to The Star, a Canadian newspaper. The school worked with a tech company to build a 5G network across its campus. Its researchers can use the network to test 5G software（软件）.\n\nAt Staffordshire University in the UK, many students enjoy talking to Beacon and asking it questions. Beacon is an AI chatbot（聊天机器人）that was made by the university. It is like a personal helper for students. They can ask it questions, such as whether or not one of their classes is cancelled.\n\nAmazon also has smart campus products. Alexa, the company’s voice-activated（声控的）smart assistant, can be used to help teachers run their classes. For example, Alexa can remember the teacher’s classroom preferences（偏好）, such as how bright the lights should be, and then change them.\n\n“Cities are so big, and there are so many players and stakeholders（利益相关者）. It can be difficult. But universities have control over their estate（财产）. They own all the buildings… so they can become like a living lab,” said Gemma Ginty, a designer who is working on a smart campus development strategy（策略）for the University of Glasgow.'},
 qs:[
 {n:1,t:"Which of the following can't smart campuses bring to students and teachers?",
  o:['Effectiveness.','Safety.','Convenience.','Independence.'],r:3,

{id:'u5-s1r2-cloze',ord:504,u:5,sec:'Section 1　Reading (Ⅱ) 完形填空',tag:'能力',em:'🖌',mins:7,type:'read',
 psg:{meta:'体裁：记叙文　题材：日常活动　词数：234　难度：★★★　[2024 广东深圳期末]　语篇导读：本文主要讲述了作者练习书法的经历',
  title:'Learning Chinese calligraphy',
  text:'I came to China as an exchange student in 2018. I have lived in China for many years. Now I am __1__ in Chinese culture.\n\nI fell in love with it all by accident. One day, I saw some people writing Chinese characters with ink brushes. It was so amazing. Later I started to __2__ many Chinese calligraphers, such as Wang Xizhi of the Jin dynasty.\n\nI joined a __3__ class four years ago. The teacher showed me many of his calligraphy（书法）works. I told myself that I would __4__ hard and try to become as good as him.\n\nAt first, I followed the teacher carefully. As soon as the teacher wrote a character, I __5__ one. Before long I could write many characters. I was happy and believed that I have the __6__ to learn the Chinese calligraphy well.\n\nHowever, the teacher pointed out a problem in my calligraphy. He told me that Chinese calligraphy is a(n) __7__ that comes from the heart and is not just about copying. He said that the __8__ of doing it well is that the writer should think carefully about what he wants to show before writing.\n\nI’m not sure if I __9__ understood the teacher. But __10__, I have spent a lot of time thinking and practising. I hope one day I can know the essence（本质）of Chinese calligraphy.'},

{id:'u5-s2g-nl',ord:507,u:5,sec:'Section 2　Grammar 语法填空',tag:'能力',em:'🇫🇷',mins:8,type:'read',

  title:'Dear Laura,',
  text:"Thanks for your message. Yes, I'm having a great time on my exchange programme in France. I was a bit nervous before I arrived here, but there was no reason to be. My host family is really nice.\n\nThey go out of their way __1__ (make) me feel at home. The grandmother has a teenage granddaughter at about __2__ (I) age who is really kind. She always talks to me in French to help me practise. And you wouldn't believe how quickly my French has __3__ (improve)! I'm very comfortable speaking French now. Though I still make lots of __4__ (mistake), it doesn't worry me as it used to.\n\nMy biggest challenge is learning how to behave at the dinner table. __5__ you can imagine, things are really different from the way they are at home. For example, you shouldn't put your bread on your plate. You __6__ (suppose) to put it on the table! I thought that was pretty strange __7__ first, but now I'm used to it. You shouldn't eat anything with your hands except bread, not even fruit. You have to cut it up and eat it with a fork. Another thing is that it is very __8__ (polite) to say you're full. If you don't want any more food, you should just say, \"It was delicious.\" Also, you shouldn't put your elbows on the table. I have to say that I find it difficult to remember everything, but I'm __9__ (gradual) getting used to it. I don't find French customs so strange any more.\n\nI'll write again soon and tell you more about my life in France. Hope you are having __10__ good school year.\n\n　　　　　　　　　　　　　　　　　　Yours,\n　　　　　　　　　　　　　　　　　　Lin Yue"},

 {n:4,essay:true,zh:'谈谈你在英国交流学习的收获和感受（100 词左右）',
  t:'假设你刚从英国的一所学校交流学习回国。请根据下面的内容提示，用英语写一篇 100 词左右的短文，谈谈你交流学习的收获和感受。\n\n内容提示：\n（1）学会依靠自己；\n（2）学会与不同的人相处，结识很多朋友；\n（3）学会在团队中工作；\n（4）有利于学英语；\n（5）……（自行补充）\n\n要求：①短文需要包含内容提示的所有内容，可适当发挥；②文中不得出现真实的人名和校名；③字迹工整，行文连贯，语言流畅。',
  hint:'可以用 Firstly / Secondly / Thirdly / What’s more / Finally 把几点串起来，最后用一句感叹句收尾',
  model:"My exchange visit was great. Firstly, I learnt to depend on myself. It's the key to learning to live independently. Secondly, I learnt how to get along with different people and I made lots of friends. Thirdly, I learnt to work in a team. What's more, it was very great for me to learn English in an English-speaking country. Finally, I picked up useful knowledge about local culture and traditional customs. What an unforgettable educational exchange I had!\n\n　　It is a good chance and fantastic experience for us to study in an exchange programme. I hope I can have another chance to study in an exchange programme one day."}
]},

{id:'u5-wk',ord:512,u:5,sec:'外刊阅读速递',tag:'能力',em:'🌍',mins:8,type:'read',
 psg:{meta:'体裁：应用文　题材：学校　词数：294　难度：★★★　素材来源：KNOWLEDGELINK　语篇导读：本文主要介绍了来自美国的交换生萨姆在中国的生活和学习情况',
  title:'An interview with Sam',
  text:"A 10th grader at the St. Mary's School（SMS）home campus in Medford, Oregon, Sam recently had a one-month exchange study in Zhejiang Province. He not only improved his Chinese language skills, but also made new friends, enjoyed his favourite foods and experienced the Chinese lifestyle.\n\n【What was your first impression of China?】\nThe people here were so nice and warm-hearted. They were willing to help me whenever I ran into trouble. On one of my first days in China, the Chinese headteacher（校长）of my school showed me around the city to give me a better understanding of the environment, the school, the culture, and the city's background.\n\n【What is your favourite food in China?】\nChinese food is always delicious, and even though I am a vegetarian, the food has never let me down. I now have two favourite foods here. One is called baozi, and it is a type of steamed bun filled with meat or vegetarian fillings. It is a popular food for any meal, and I usually have it for breakfast. My other favourite food here is Mapo Tofu, a dish typically set in a spicy sauce.\n\n【Do you have a favourite book in Chinese?】\nThe only Chinese book I have tried to read is one on the teachings of Confucius. While it was difficult to understand, I liked how insightful（有洞察力的）the stories were. One story tells me to look at things in a different way. My Chinese teacher recently taught me a poem by the famous Chinese poet Li Bai. He wrote about missing his hometown. I can understand these emotions because I sometimes feel homesick while I'm here in China."},

{id:'u5-b-yfxz',ord:513,u:5,sec:'B 阅读综合素养 · 语法选择',tag:'能力',em:'🇷🇺',mins:7,type:'read',
 psg:{meta:'素养：文化意识　体裁：记叙文　词数：273　难度：★★★　[2024 广东江门期末]　语篇导读：本文主要讲述了作者作为交换生在俄罗斯学习的经历以及感悟',
  title:'My exchange visit to Russia',
  text:"It is said that a new culture can always keep your eyes and your mind open. Now I am studying in Russia as __1__ exchange student. I learn about it from my own experience.\n\nOne of __2__ differences is about people's way of life. One day, a Russian friend invited me to a well-known restaurant in Moscow. I __3__ to try local food. After arriving there, I found nothing on the table but some small plates. To my greater surprise, on the plates there __4__ only a few slices of tomatoes, nuts, and several pieces of onions.\n\n__5__ the dishes were simple, we drank a lot and I felt the passion（热情）from the bottom of my friend's heart. In China, when we invite our friends or relatives, we always provide __6__ with a big dinner with all kinds of dishes. We like to prepare __7__ we can to show our friendliness.\n\n__8__ Russian custom also surprises me greatly. As we know, it is __9__ cold in winter there that it takes a lot of courage to just go outside. However, when winter comes, Russians enjoy __10__. They even take their kids outside to swim. Like their parents, Russian kids rub（揉擦）their bodies __11__ snow before jumping into the water. The water is freezing cold, but they all play __12__ in it! Sometimes they invite us to join them, but we have to say no, because it is really difficult for us __13__ it just like them!\n\nI __14__ a lot from the exchange visit and it's been educational in many ways. __15__ interesting the visit is!"},
 qs:[
 {n:1,t:'第 (1) 空',o:['a','an','the','/'],r:1,
  ex:'句意为：我现在正作为一名交换生在俄罗斯学习。根据语境可知，此处泛指一名交换生，exchange 的发音以元音音素开头，故用不定冠词 an。'},

  ex:'句意为：其中一个最大的不同是关于人们的生活方式。固定用法"one of+the+形容词最高级+名词复数"表示"最……的……之一"，符合语境。'},

  ex:'句意为：我期待尝试一下当地的食物。结合上文的 invited 和下文的 found 可知此句应用一般过去时，空处应用动词过去式 expected。'},

  ex:'句意为：更让我惊讶的是，盘子上只有几片西红柿、一些坚果和几片洋葱。此处是 there be 句型，主语为复数，故选 D 项。'},
 {n:5,t:'第 (5) 空',o:['Although','But','So','And'],r:0,

  text:"I'm Susan, a student from China. I decided to study English for two weeks in the summer vacation, so I chose a language school in the UK.\n\nThe school was beautiful and the teachers were very nice. When I studied in the school, I stayed with an English family. The family couldn't speak Chinese, so I had to try hard to talk with them in English. But it was a good way to practise my English.\n\nEvery morning after breakfast, I took the bus to school. Lessons started at 9:00 a.m. and ended at 1:00 p.m. I was free in the afternoon, so I had lots of time to read English books after school. I learnt a lot and I met people from all over the world. Of course, the only language we used was English. We watched some sports games and visited some famous places at the weekend.\n\nIt was a wonderful summer vacation! My English got much better and I made a lot of new friends. Now I'm back in China and I'm sure my English grades will be much better!"},

{id:'u5-c-readA',ord:517,u:5,sec:'C 单元限时检测 · 阅读理解 A',tag:'能力',em:'📕',mins:6,type:'read',

  title:'Two exchange programmes',
  text:"More wonderful educational exchange programmes are waiting for you. Here is some information that can help learn more.\n\n【Au pair programme】\nThrough the Au pair programme, students can experience a cultural exchange in the USA. Students will live with a host family in America and take care of the children. In this way, students can continue their education while experiencing everyday life with an American family. At the same time, hosts can get good childcare from students who become part of the family.\n\nRequirements（要求）:\n　Aged between 18 and 26\n　Have experience in working with children\n　Have a driving licence（驾照）\n　Have no trouble understanding English\nTime to Apply: October 21st—November 21st\nFor more information, please call us at 866-2839.\n\n【The Summer Work Travel Programme】\nThe Summer Work Travel Programme provides foreign students with a chance to live and work in the United States during the summer vacation. As an exchange student, you can experience the way of life and culture in the United States.\n\nRequirements:\n　Aged between 18 and 20\n　Pass the TOEFL test with a score higher than 80\n　Be good at English and talking with people\n　Hard-working and outgoing\nTime to Apply: November 18th—December 18th\nFor more information, please email us at DesignationCC@state.gov."},

{id:'u5-c-readB',ord:518,u:5,sec:'C 单元限时检测 · 阅读理解 B',tag:'能力',em:'🌍',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解 B 篇　[2024 辽宁锦州期末]　语篇导读：本文主要讲述了作者在意大利和中国遭受的文化冲击的经历',
  title:'Culture shock',
  text:"① Exploring different parts of the world can be exciting, but it can also be challenging and lead to culture shock and feelings of stress.\n\n② When I moved to Tuscany, Italy, right after my college, I was fascinated by the beautiful views. Who wouldn't be? The high mountains, historical buildings and delicious food made every minute of the long flight journey deserve. I was excited about my new beginning. But then, I started to notice little things.\n\n③ As an American, we are used to a bit of personal space. Where I'm from, bumping（碰撞）up against or standing very close is considered impolite. However, this couldn't be further from the truth in Italy.\n\n④ Not knowing the language was also challenging. Sometimes, I would feel helpless. This, though, is where one part of Italian culture came in handy. Italians like to speak with their hands—a habit I've carried over until this day.\n\n⑤ Of course, having experienced culture shock in one country doesn't mean you can get used to it in another.\n\n⑥ Years later, when I moved to China, my experience was special. The culture there was something very foreign—down to how to buy things. Before moving there, I had never heard of WeChat or Alipay. I wasn't prepared at all for how important these things would be.\n\n⑦ Although maybe being far away from my home country can sometimes seem upsetting, experiencing culture shock reminds me that I am exploring different parts of the world and that I should be thankful for what I'm taking in. An American-British author once said that \"the greatest payback of travel is to be able to experience everyday things as if for the first time\"."},
 qs:[
 {n:14,t:'What culture shock did the author experience in Italy?',
  o:['The views in Italy is not as beautiful as imagined.',"Italians don't learn foreign languages.",'Italians stand quite close to each other.','The Italian way of speaking with feet.'],r:2,
  ex:'细节理解题。根据"As an American, we are used to a bit of personal space. Where I\'m from, bumping up against or standing very close is considered impolite. However, this couldn\'t be further from the truth in Italy."可知选 C 项。'},
 {n:15,t:'What happened when the author arrived in China?',
  o:['She started to buy things online.','She experienced culture shock again.','Her experience in Italy helped get used to the life in China.','She realized that WeChat and Alipay were not important.'],r:1,
  ex:'细节理解题。根据"Years later, when I moved to China, my experience was special. The culture there was something very foreign…"并结合上文可知，作者在中国又经历了一次文化冲击。'},
 {n:16,tag:'新考法·篇章结构',t:'Which of the following best shows the structure of the passage?（数字代表段落）',
  o:['①；②③④；⑤；⑥；⑦','①②；③④；⑤⑥；⑦','①；②③④；⑤⑥⑦','①②；③④⑤⑥；⑦'],r:0,
  ex:'推理判断题。通读全文可知，第一段点明主题；第二至四段介绍作者在意大利的经历；第五段为过渡段；第六段介绍作者在中国的经历；第七段总结全文。故选 A 项。'}
]},

  title:'Living and studying in London',
  text:"As an exchange student, I've been in London for about a year until now. Before I came here, I had no idea what it would be like to live and study in London. __17__\n\n【Food in London】\nIt is easy to find delicious food in London. __18__ Here it is possible to taste food from all over the world. Traditional British food is very delicious such as fish and chips, pudding, pies, cheese, tea and cakes.\n\n【Weather in London】\nDoes it always rain in London? Not really. Sometimes it rains, and sometimes it's sunny and beautiful. __19__ In fact, local people carry both sunglasses and an umbrella with them throughout the year.\n\n【Attractions in London】\nThere are many famous attractions in London such as the London Eye, the Tower of London and the Science Museum. You can take a double-decker（双层公共汽车）. __20__ The bus usually stops near most tourist attractions. You can get off the bus at any stop. Outside the city there is the beautiful countryside and a lot of castles, parks and gardens.\n\n__21__ It is a great place to visit and learn about.\n\n【备选句子】\nA. But now I have a clear answer.\nB. In a word, London is a good city.\nC. It will take you to tour around the city.\nD. London is a good place for further studies.\nE. There are a lot of restaurants and food markets.\nF. The weather in London can change very quickly."},

  ex:'根据"Before I came here, I had no idea what it would be like to live and study in London."及下文的介绍可知，A 选项（但现在我有了一个明确的答案。）符合语境。'},

{id:'u5-c-xiezuo',ord:521,u:5,sec:'C 单元限时检测 · 书面表达',tag:'写作',em:'📝',mins:25,type:'essay',
 qs:[
 {n:27,essay:true,zh:'写一份竞选"最佳文化交流大使"的英语演讲稿（100 词左右）',
  t:'[2024 广东湛江期末] 为迎接外国的交换生，你校现准备举办一场"最佳文化交流大使"选拔活动。假如你是李华，你准备参加。请写一份英语竞选演讲稿。\n\n内容包括（思维导图）：\n　【Who am I?】1. personality（性格）2. hobby\n　【What are my advantages?】1. language ability　2. social skills\n　【What will I do as a cultural ambassador?】1. teach them some Chinese traditional skills（请补充 1—2 点）\n\n参考词汇：election 竞选　the Best Ambassador of Cultural Exchange 最佳文化交流大使\n要求：①100 词左右，开头和结尾已给出，不计入总词数；②演讲稿内容合理，句子准确、连贯；③不得透露真实学校、姓名等个人信息。',
  hint:"开头：Good morning, ladies and gentlemen. I'm Li Hua.　结尾：Please support me and I will never let you down.",
  model:"Good morning, ladies and gentlemen. I'm Li Hua. Now I am speaking for the election of the Best Ambassador of Cultural Exchange in our school.\n\n　　My classmates and teachers always see me as a cheerful friend or responsible helper. I'm very positive and always willing to help. After class, I enjoy watching English movies and reading books, so I know a lot about the foreign culture and social skills. And I can speak fluent English so I am not afraid of chatting with foreigners.\n\n　　If I am elected, I plan to invite the exchange students to experience Chinese culture by teaching them traditional things like paper-cutting and Chinese paintings. Moreover, I'd like to invite them to my home so that they will know better about Chinese family life.\n\n　　Please support me and I will never let you down."}
]},

{id:'u6-s1r1-nl',ord:602,u:6,sec:'Section 1　Reading (Ⅰ)',tag:'能力',em:'⛰',mins:8,type:'read',
 psg:{meta:'体裁：记叙文　题材：故事与诗歌　词数：260　难度：★★★　[2025 云南昆明一模]　新素材·中国文化：愚公移山',
  title:'Yu Gong Moves the Mountains',
  text:'Long long ago, there was an old man named Yu Gong. He was nearly 90 years old. There were two mountains in front of his house.\n\nOne day, Yu Gong said to the whole family, "The mountains stop the doorway of our house. It is very <u>inconvenient</u> for us to come and go. Let us try our best to move away the mountains." After hearing this, all his sons and grandsons said, "You are right. Let\'s start tomorrow!"\n\nThe following day, Yu Gong led the whole family and started to move the mountains. His neighbour was a woman with a son. When her son heard of this, he also came to help happily. They worked nonstop every day, fearing neither heat in summer nor cold in winter, neither wind nor rain.\n\nWhen an old man named Zhi Sou saw Yu Gong\'s family moving the mountains, he thought it useless to do that and said to Yu Gong, "You are so old that you can hardly walk. Can you move the mountains?"\n\nYu Gong answered, "You are not even as clever as a child. Though I am about to die, I have sons. When my sons die, there are still grandsons. Generation after generation, there\'s no end. If we work without stopping every day, why can\'t we move away the mountains?"\n\nYu Gong led his family to dig the mountains continually from early morning till late night. They finally moved the Emperor of Heaven, and he helped them move away the mountains.'},
 qs:[
 {n:1,t:'How old was Yu Gong when he decided to move the mountains?',
  o:['Nearly 19 years old.','Nearly 90 years old.','Nearly 79 years old.','Nearly 69 years old.'],r:1,
  ex:'细节理解题。根据"He was nearly 90 years old."以及"Let us try our best to move away the mountains."可知，愚公决定移山时快 90 岁了。'},
 {n:2,t:'What does the underlined word "inconvenient" mean in Paragraph 2?',
  o:['不融洽的','难以理解的','简单的','不方便的'],r:3,
  ex:'词义猜测题。根据第二段的"The mountains stop the doorway of our house."可知，山挡住了房子的出入口，因此愚公一家人进出是非常不方便的，由此可知画线词表示"不方便的"。'},
 {n:3,t:'What did Yu Gong think of Zhi Sou?',
  o:["Zhi Sou wasn't clever.",'Zhi Sou was right.','Zhi Sou would help move the mountains.',"Zhi Sou didn't laugh at him."],r:0,
  ex:'细节理解题。根据"You are not even as clever as a child."可知，愚公认为智叟不聪明。'},
 {n:4,tag:'新考法·顺序排列',t:"What's the correct order of the events?\na. Zhi Sou thought Yu Gong couldn't move the mountains.\nb. The Emperor of Heaven helped to move away the mountains.\nc. His neighbour came to help him.\nd. Yu Gong gathered his family to move the mountains.",
  o:['bacd','acdb','dcab','cadb'],r:2,
  ex:'细节理解题。根据"One day, Yu Gong said to the whole family…""His neighbour was a woman with a son. When her son heard of this, he also came to help happily.""When an old man named Zhi Sou saw Yu Gong\'s family moving the mountains… Can you move the mountains?"以及"They finally moved the Emperor of Heaven, and he helped them move away the mountains."可知，事件发展的正确顺序为 dcab。'},
 {n:5,t:'What can we learn from the story?',
  o:['An old woman can also make a difference.','Nothing is difficult if you put your heart into it.','Convenient transportation is very important to us.','In fact, Yu Gong could not move the two mountains.'],r:1,
  ex:'主旨大意题。通读全文可知，愚公一家坚持不懈地移山，最终感动天帝并达成目标，说明了"世上无难事，只怕有心人"的道理。'}
]},

  title:'Colours and Moods（情绪）',
  text:'Some people believe that colours can influence our moods. __11__ In fact, colours can change our moods and make us feel happy, sad or energetic（充满活力的）. This article talks about what colours can do and what characteristics they represent（代表）.\n\n【Energetic colours】When you feel tired or weak, you should wear energetic colours like green. __12__ Because it is the colour of nature and represents new life.\n\n【Strong colours】If you need strength in your body or mind, red may be helpful. Red is the colour of heat. It represents power and strong feelings. Wearing red can also make it easier to take action. This may help when you are having difficulty doing something.\n\n【Calm colours】Have you ever walked into a room and felt relaxed? It could be because the walls were painted blue. Blue is a calm colour. It brings peace to our mind and body. __13__ So you may say "I\'m feeling blue" when you are feeling sad.\n\n【Warm colours】Some colours, such as orange and yellow, can make you feel warm. People in cold areas prefer warm colours in their homes to create a warm and comfortable feeling. Orange represents joy. It can cheer you up when you are feeling sad. __14__\n\n【备选句子】\nA. Yellow is the colour of the sun, and it can remind you of a warm sunny day.\nB. Green can give you energy.\nC. Blue can also represent sadness.\nD. Green can usually make you feel sad.\nE. Others think that colours can change people\'s mind.'},

  ex:'根据上文的"Some people believe that colours can influence our moods."以及下文的"In fact, colours can change our moods and make us feel happy, sad or energetic."可知，此处说的是颜色对人的影响。结合选项可知，E 项符合语境。'},
 {n:12,t:'第 (12) 空该填哪一句？',
  o:['Yellow is the colour of the sun, and it can remind you of a warm sunny day.','Green can give you energy.','Blue can also represent sadness.','Green can usually make you feel sad.',"Others think that colours can change people's mind."],r:1,
  ex:'根据"When you feel tired or weak, you should wear energetic colours like green."可知，此处与绿色的积极作用有关。结合选项可知，B 项符合语境。'},
 {n:13,t:'第 (13) 空该填哪一句？',
  o:['Yellow is the colour of the sun, and it can remind you of a warm sunny day.','Green can give you energy.','Blue can also represent sadness.','Green can usually make you feel sad.',"Others think that colours can change people's mind."],r:2,

  title:'Dear Millie,',
  text:"You asked me about the Dragon Boat Festival. Now let me tell you something about it.\n\nThe Dragon Boat Festival is a traditional Chinese festival we Chinese __1__ (celebrate) for over 2,000 years. It's one of the three most important lunar festivals in China, along with the Spring Festival and the Mid-Autumn Festival. The Dragon Boat Festival took place on the __2__ (thirty-one) of May in 2025.\n\nThroughout the years, many stories have been told about the __3__ (begin) of this festival. Among them, the __4__ (famous) one is about Qu Yuan, a well-known scholar in ancient China. He not only __5__ (write) good poems but also gave suggestions to the king. Although he devoted himself to __6__ (he) country, the king didn't like him. This great person drowned（溺水）himself in the Miluo River on the 5th day of the 5th Chinese lunar month because his Chu State fell to Qin State. Local people tried to save him or find his body, but they didn't __7__ (success). Qu Yuan was later considered as __8__ national hero. To remember him, every fifth day of the fifth lunar month, people beat drums and go boat racing on the river as they once did __9__ (keep) fish away from his body.\n\nDragon boat racing is one of the most important customs Chinese people practise to celebrate the Dragon Boat Festival. This activity is held __10__ (wide) in China's southern and southeastern areas where there are lots of rivers and lakes.\n\n　　　　　　　　　　　　　　　　　　Lots of love,\n　　　　　　　　　　　　　　　　　　Windy"},

  t:'在我国有很多经典的神话故事、寓言故事和成语故事。这些都是中国传统文化的一部分。假定一些美国中学生将会来到你们学校交流学习，请你以"A story I want to share"为题，用英语写一篇小短文，宣扬中国文化。\n\n内容包括：\n（1）介绍一则中国故事；\n（2）谈谈你的读后感（不少于两点）；\n（3）呼吁来访的美国中学生多读中国故事，了解更多中国文化。\n\n要求：①不得在文中提及真实校名、班级和姓名等；②语句连贯，词数不少于 80。',

]},

{id:'u6-wk',ord:612,u:6,sec:'外刊阅读速递',tag:'能力',em:'🐎',mins:8,type:'read',
 psg:{meta:'体裁：夹叙夹议　题材：故事与诗歌　词数：282　难度：★★★　素材来源：iStudy-China　语篇导读：本文通过塞翁失马的故事阐述了福祸相依，事物具有两面性的道理',
  title:'The Old Man at the Fort',
  text:'Do things in our daily life have anything to do with luck? Can good things turn into bad ones? Or can bad things turn into good ones? Many people always think so. In fact, there is no such thing as good luck or bad luck. The great thinker Liu An told the famous story of "The Old Man at the Fort".\n\nAn old man lived with his son and he had a horse, but one day he lost it. His neighbours came to comfort him. The old man asked, "How do you know it\'s bad luck?" After several days, his horse returned with another good horse. His neighbours came again. They congratulated（祝贺）him on his good luck. The old man answered, "How do you know it is good luck?" Several days later, his son learnt to ride the horse. He fell off the horseback and broke his leg. How can this be a good thing? The next year, there was a war. The son didn\'t have to go to the front because of his broken leg…\n\nEvery coin has two sides. Just as the saying goes, "Good luck and bad luck <u>rotate</u>." When you are lucky, you\'d better keep calm, or you may get into trouble at last. When you are in danger or trouble, you should see it in a good way and you can turn it around with a strong will.\n\nYou can return to this story whether you are in good luck or in trouble. No matter what you are going through, you should keep your mind cool, see things in another way, and think about the changes in things.'},
 qs:[
 {n:1,tag:'新考法·写作手法',t:'How does the writer start the passage?',
  o:['By showing facts.','By giving examples.','By asking questions.','By offering advice.'],r:2,
  ex:'推理判断题。根据第一段开头的三个问句可知，作者是通过提问题的方式开始这篇文章的。'},
 {n:2,t:'How did the old man feel when he lost his horse?',
  o:['Angry.','Calm.','Bored.','Worried.'],r:1,
  ex:'推理判断题。根据第二段中的"The old man asked, \'How do you know it\'s bad luck?\'"并结合常识可推断出老人很平静。'},
 {n:3,t:'What was the life of the son like during the war?',
  o:['He got more wild horses.','He learnt to ride horses again.','He helped his army.','He lived at home with his father.'],r:3,
  ex:'推理判断题。根据第二段最后两句可知，儿子由于学习骑马受伤而没有上前线，由此推断出他应该和父亲在家里生活。'},
 {n:4,t:'What does the underlined word "rotate" mean?',
  o:['Come in turn.','Wait in line.','Leave in order.','Work in pairs.'],r:0,
  ex:'词义猜测题。根据上下文内容可知，好运和厄运会交替出现。由此可以猜测出画线词表示"交替出现"。'},
 {n:5,t:'What does the writer try to tell people in this passage?',
  o:["It's good to meet more bad things than good ones.",'We have to find more happiness in everyday life.','We should turn to others when meeting problems.','Every cloud has a silver lining.'],r:3,
  ex:'推理判断题。通读全文可知，作者通过讲述塞翁失马的故事告诉人们福祸相依，事物具有两面性的道理。'}
]},

{id:'u6-b-yfxz',ord:613,u:6,sec:'B 阅读综合素养 · 语法选择',tag:'能力',em:'🔺',mins:8,type:'read',
 psg:{meta:'素养：文化意识　体裁：说明文　词数：226　难度：★★★　语篇导读：本文主要介绍了埃及金字塔的相关信息',
  title:'The pyramids',
  text:'Pyramids（金字塔）are one of the most interesting buildings in the world. Many of the pyramids still survive along the Nile River in Egypt today for us __1__ and study. In modern days, people look at them and ask, "Who built __2__? Why? When? What is inside?"\n\n__3__ years ago, some kings of Egypt created the pyramids. They __4__ them as tombs（坟墓）. They thought the pyramids could __5__ people remember them as important people.\n\nAs we know, the oldest pyramid is about __6__ old today. Some of them are huge. __7__ pyramid is the Pyramid of Khufu. It is about 146 metres high and it is made __8__ about 2,300,000 stones. The stones are very big and heavy. Most of them are taller than __9__ man. Scientists estimate（估计）it __10__ at least 100,000 workers over 20 years to build the pyramid. As one of the Seven Wonders of the Ancient World, the Pyramid of Khufu is a very popular place of __11__. Every year, travellers from all over the world come to visit it.\n\nHow did ancient people build the pyramids? __12__ did they carry and lift up the large stones? Each stone fits with one another so well, __13__ the people didn\'t have modern machines at all! Now scientists __14__ hard to study the pyramids. However, __15__ can say how ancient people built them. How amazing the pyramids are!'},
