 psg:{meta:'素养：文化意识　体裁：记叙文　词数：205　难度：★★★　语篇导读：本文主要讲述了有关中国饺子的两则故事',
  title:'Two stories about jiaozi',
  text:'Do you know that almost each Chinese dish has its own story behind it? Here are two stories about jiaozi—Chinese dumplings.\n\nThe earliest record（记录）of jiaozi was from the Eastern Han dynasty. It is said that Zhang Zhongjing, a famous doctor in Chinese history, made jiaozi for the first time. He made jiaozi to help people keep healthy in cold winter.\n\nAnother story of jiaozi had something to do with Wang Xizhi, a calligrapher（书法家）in ancient China. When Wang Xizhi was young, his calligraphy was so wonderful that many people liked it. Wang thought his calligraphy was good enough and he began to spend little time practising it. One day Wang saw an old woman making jiaozi. Her jiaozi was in good shape and tasted delicious. Wang Xizhi asked her how long it took her to make such great jiaozi. She said, "Almost my whole life. If someone wants to be really good at something, he needs to spend his life doing that." Hearing this, Wang Xizhi knew that he should keep studying calligraphy. He spent all his life on it and became a great calligrapher finally.'},

 {n:23,t:'What did Wang Xizhi think of his calligraphy at first?',

  text:'A king was defeated in a war and ran away. It was getting dark. Luckily, he saw a __1__ shining not far away. Then he started walking towards it and soon reached a hut（小屋）. An old lady was cleaning the yard outside. Thinking he was a __2__ from the army, she welcomed him in and gave a plate of hot food to him. The king was so __3__ that he quickly put his fingers on the hot food. The hot food __4__ his fingers and made him drop some rice.\n\nThe old lady saw this and said, "Oh, you seem too __5__ like your king. That is why you have burnt your fingers and lost some food."\n\nSurprised to hear this, the king asked, "Why do you think so?"\n\nThe old lady explained, "My dear son, our king is having a big __6__ of capturing all his enemy\'s forts. However, he doesn\'t care about all the small forts and only __7__ the big ones."\n\nThe king asked, "That\'s a good thing. What is the problem with that?"\n\nShe patiently replied, "Just like you lost your food, the king\'s impatience to beat the enemies quickly __8__ the loss of men in his army. But if you had eaten less hot food at the side first and then food in the centre, you would not have burnt your fingers. __9__, the king should capture the small forts and strengthen his position first. It helps him to capture the big forts without losing his men."\n\nHearing this, the king realized his __10__ and understood that one should have patience and think twice before he acts.'},

{id:'u6-c-readA',ord:617,u:6,sec:'C 单元限时检测 · 阅读理解 A',tag:'能力',em:'⛵',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解（12 分）A 篇　语篇导读：本文讲述了郑和的生平',
  title:'Zheng He',
  text:"Zheng He was an amazing man. He was born in 1371. 11 years later, he was caught by the army of a rich young man called Zhu Di and was made to work for him. Over time the rich man saw that Zheng He was very clever and strong and let him be responsible for many things. After Zhu Di was made the King, he asked Zheng He to join his government.\n\nThe King wanted to learn more about the world and show other countries his power. He ordered his men to build many new ships and made Zheng He their leader. Between 1405 and 1433, Zheng He led seven sea trips to different parts of the world. He certainly travelled to India, Africa and the Middle East. A few people think his ships have even reached South America and Australia.\n\nOn these trips he brought with him many Chinese goods like silk and medicine to give to foreign kings or to sell for local goods. He returned from each trip with boats filled with expensive things such as gold, treasures, and strange animals like the giraffe.\n\nIt is a pity that we may never learn everything about Zheng He's travel. The Columbus of the East, Zheng He, died in 1433. After that, the new king had these trips stopped and burnt almost all the books about Zheng He's travel, because he believed the trips were unlucky and too expensive. It is only in the last 50 years that historians have begun to carefully study the adventures of great Zheng He."},
 qs:[
 {n:11,t:'What do we know about Zheng He from the passage?',
  o:['He travelled to India and Africa.','Each trip lasted six years.','When he died, he was 72 years old.','He was a great king.'],r:0,
  ex:'细节理解题。由第二段的"He certainly travelled to India, Africa and the Middle East."可知选 A 项。'},
 {n:12,t:'Which of the following did Zheng He take to foreign countries from China?',
  o:['Gold.','Treasures.','Giraffes.','Silk.'],r:3,
  ex:'细节理解题。由第三段第一句"On these trips he brought with him many Chinese goods like silk and medicine to give to foreign kings or to sell for local goods."可知选 D 项。'},
 {n:13,t:"What's the best title for this passage?",
  o:["The King's Seven Sea Trips","The King's Travel to Western Countries",'Zheng He, the Columbus of the East','Zhu Di, the Great King'],r:2,
  ex:'主旨大意题。本文主要讲述了郑和的生平，故选 C 项。'}
]},

{id:'u6-c-readB',ord:618,u:6,sec:'C 单元限时检测 · 阅读理解 B',tag:'能力',em:'📜',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解 B 篇　[2024 广东深圳调研]　语篇导读：本文介绍了宋代著名词人——李清照',
  title:'Li Qingzhao',
  text:'① Li Qingzhao（1084—1155）is one of the best-known female writers in Chinese history. She showed great love for writing and was known as a talented special woman then. But her life was a bittersweet story.\n\n② Born into a famous literary（爱好文学的）family, Li was someone who always wanted to destroy old customs and traditions from the start. Women in the Song dynasty stayed indoors. They didn\'t discuss politics, and only spoke when spoken to. But just at the age of 17, Li Qingzhao made a name for herself.\n\n③ She was lucky in her marriage. In 1101, she married Zhao Mingcheng, with whom she shared the interest in the art collection. They lived in present-day Shandong. They were not wealthy, but they lived happily together. Li and her husband collected many books. They shared a love of poetry and often wrote poems for each other. They sold clothes and went hungry to slowly build up a big library, and they always spent their nights on literary drinking games like this one: An event would be chosen from a pile of books, and the person would win if he/she first named the book, chapter, page, and line where it was found.\n\n④ This happy life was ruined by the wars of 1127. The Northern Song capital fell this year during the Jin-Song wars. Fighting took place in Shandong and their house was burnt. The couple took many of their possessions and ran away to Nanjing, where they lived for a year. Zhao Mingcheng died in 1129, leaving her childless and alone. Li Qingzhao\'s life was full of twists and turns（波折）, but she left many valuable poems to us.'},
 qs:[
 {n:14,t:'What can we know about Li Qingzhao from the first two paragraphs?',
  o:['She was different from other women of her age.','She often guided other women to write poems.','She liked staying indoors when she was young.','She always followed old customs and traditions.'],r:0,
  ex:'推理判断题。根据文章前两段内容可知，当时的女性待在户内，不讨论政治，只在被问到的时候才说话，但是李清照总想打破旧习俗和传统，所以她和其他同龄的女性不一样。故选 A 项。'},
 {n:15,t:"Which of the following is NOT Li Qingzhao's hobby?",
  o:['Collecting books.','Planting flowers.','Writing poems.','Playing literary drinking games.'],r:1,
  ex:'细节理解题。根据第三段内容可知，种花不是她的爱好。故选 B 项。'},
 {n:16,tag:'新考法·篇章结构',t:'What is the structure of this passage?（①②③④ 代表四个段落）\n　A. ①→②→③→④ 依次推进\n　B. ① 在上，②③④ 并列在下（总分结构）\n　C. ①②③ 并列在上，④ 在下（分总结构）\n　D. ① 在上，②③ 并列，最后到 ④',
  o:['A 图','B 图','C 图','D 图'],r:1,
  ex:'推理判断题。第一段总领全文，引出介绍对象；第二段到第四段叙述了李清照的生平。由此可知，本文是总分结构。故选 B 项。'}
]},

{id:'u6-c-restore',ord:619,u:6,sec:'C 单元限时检测 · 阅读还原',tag:'能力',em:'⌨️',mins:8,type:'read',
 psg:{meta:'第Ⅲ题　阅读还原（10 分）　[2024 辽宁沈阳期末·改编]　语篇导读：本文主要介绍了键盘上的字母的顺序排列的由来',
  title:'Why QWERTY?',
  text:'Have you ever wondered why the letters on a keyboard are not in the "ABC" order?\n\nThe keyboard we use every day is called the QWERTY keyboard. Q, W, E, R, T, Y are the first six letters on this kind of keyboards, starting from the upper left-hand corner. __17__\n\nThe first manual typewriter（手动打字机）, with a keyboard which looked like a piano, was invented in the late 19th century. __18__ However, it was later discovered that as the typing speed increased, some keys failed to come back to their places quickly. As a result, they got jammed（卡住）very easily. __19__ To solve this problem, the first QWERTY keyboard was developed. It placed keys in a way that the most used letters were spaced out（隔开）so that the keys were more likely to work freely.\n\n__20__ With the arrival of the computer, the typists in offices were the same as people who now operate computers. This meant the typists had to be trained to use the new devices（设备）. __21__ It was easier to design the keyboards following the layout（设计）of typewriters, which was the QWERTY layout, and this continues till today.\n\n【备选句子】\nA. But training required too much time and money.\nB. However, another problem came about in the 1940s.\nC. This kind of typewriters did have the ABC keyboard layout.\nD. Here are some tips to help you get used to the QWERTY keyboard.\nE. To understand why we went with QWERTY, we need to go back to history.\nF. Most typists ended up breaking the typewriter altogether when separating the keys.'},

  ex:'上文介绍我们每天使用的键盘被称为 QWERTY 键盘，下文讲述了这种键盘的由来，选项 E（为了理解我们为什么使用 QWERTY 键盘，我们需要回顾一下历史。）符合语境。'},
 {n:18,t:'第 (18) 空该填哪一句？',
  o:['But training required too much time and money.','However, another problem came about in the 1940s.','This kind of typewriters did have the ABC keyboard layout.','Here are some tips to help you get used to the QWERTY keyboard.','To understand why we went with QWERTY, we need to go back to history.','Most typists ended up breaking the typewriter altogether when separating the keys.'],r:2,
  ex:'根据上下文可知第一台手动打字机确实有 ABC 布局的键盘，然而随着打字速度的提高，一些键无法快速返回原位，选项 C 符合语境。'},

  ex:'根据后文的 To solve this problem 可知，此处应说明手动打字机的问题，选项 F（大多数打字员在分离按键时，最后都把打字机完全弄坏了。）符合语境。'},

  ex:'根据下文"With the arrival of the computer, the typists in offices were the same as people who now operate computers. This meant the typists had to be trained to use the new devices."并结合选项可知，此处表示随着电脑的到来，另一个问题出现了。选项 B 符合语境。'},

{id:'u6-c-tianci',ord:620,u:6,sec:'C 单元限时检测 · 语篇填词',tag:'基础',em:'🏯',mins:5,type:'read',
 psg:{meta:'第Ⅳ题　语篇填词（5 分）　[2025 广东广州调研]　新素材·中国文化：空城计　语篇导读：文章主要讲述了诸葛亮巧用空城计拯救西城的故事，展现了诸葛亮的足智多谋',
  title:'The Empty City Plan',
  text:"In ancient China, there was a wise man called Zhuge Liang. One day, Zhuge Liang found himself in a difficult situation. Sima Yi's army was coming and Zhuge Liang's support was still far away. There were not enough soldiers in West City. But Zhuge Liang thought of a method to __22__ this problem.\n\nSeveral soldiers were ordered to open the city gates and clean the roads. Zhuge Liang himself went up the city wall and began to play his favourite music softly there and seemed __23__.\n\nWhen Sima Yi's army arrived, they saw the open gates and empty streets. Only a few old soldiers were working as cleaners. Sima Yi's army couldn't believe their eyes. They __24__ what they saw, so they didn't enter the city. Zhuge Liang told them that the city was empty and that they were welcome. But Sima Yi thought it was a trick, because Zhuge Liang had never taken any unsure plans. He wouldn't __25__ Zhuge Liang.\n\nAfter some time, Sima Yi made a __26__ to leave. Zhuge Liang saved the whole city."},
 qs:[
 {n:22,t:'第 (22) 空',hint:'首字母提示：s',a:['solve'],

  ex:'空处应用形容词作表语，根据 play his favourite music softly 和首字母提示可知，诸葛亮在城墙上弹琴，在大敌当前的情况下，显得很放松，relaxed 意为"放松的"，修饰人，符合语境。故填 relaxed。'},

  ex:"句意为：他们怀疑自己所看到的，所以没有进城。根据上文\"When Sima Yi's army arrived, they saw the open gates and empty streets…\"和首字母提示可知，此处是指他们怀疑他们所看到的一切，doubt 意为\"怀疑\"，为动词；句子时态为一般过去时，谓语动词应用过去式 doubted。"},

{id:'u6-c-xiezuo',ord:621,u:6,sec:'C 单元限时检测 · 书面表达',tag:'写作',em:'📝',mins:25,type:'essay',
 qs:[
 {n:27,essay:true,zh:'给美国笔友 Tom 回邮件，讲述"程门立雪"的故事（100 词左右）',
  t:'假如你是李华，你的美国笔友 Tom 在昨天的电子邮件中告诉你，最近他对中国文化产生了浓厚的兴趣，希望你能给他介绍一些经典故事。请你根据下面所给内容，给 Tom 回复一封邮件，向他讲述"程门立雪"这一经典故事，并希望知道他对该故事主人公的看法。\n\n故事内容（四格漫画）：\n　① 杨时与游酢去拜见老师程颐。\n　② 到达老师家时，老师正在睡觉。\n　③ 杨时和游酢不想吵醒老师，就站在外面等待。\n　④ 老师醒来时，杨时和游酢站在厚厚的雪地里。\n\n要求：①文章需要包括以上所给的内容，可以适当发挥，使全文连贯；②文中不得出现可能透露考生真实身份的任何信息；③100 词左右（邮件的开头、结尾已给出，不计入总词数）。',
  hint:'开头：Dear Tom, I\'m very happy that you are interested in traditional Chinese stories. Well, let me tell you a famous one with the name "Waiting in the snow to meet Master Cheng respectfully".　结尾：I am looking forward to hearing from you. Yours, Li Hua',
  model:"Dear Tom,\n\n　　I'm very happy that you are interested in traditional Chinese stories. Well, let me tell you a famous one with the name \"Waiting in the snow to meet Master Cheng respectfully\".\n\n　　Long long ago, there was a man called Yang Shi. Once he went to visit Master Cheng Yi with You Zuo. Unluckily, Cheng was sleeping in the room when they arrived. They didn't want to wake up Cheng and waited outside. At that moment, there were flakes of snow flying over their heads and it was very cold but they still stood in the snow waiting. When Cheng woke up, the snow was very deep. They were standing in the thick snow like snowmen. Finally, Cheng was moved deeply.\n\n　　What do you think of Yang Shi and You Zuo and what do you learn from the story?\n\n　　I am looking forward to hearing from you.\n\n　　　　　　　　　　　　　　　　　　Yours,\n　　　　　　　　　　　　　　　　　　Li Hua"}
]},

{id:'u7-s1r1-nl',ord:702,u:7,sec:'Section 1　Reading (Ⅰ)',tag:'能力',em:'🧠',mins:7,type:'read',
 psg:{meta:'体裁：说明文　题材：饮食　词数：255　难度：★★★　[2024 广东佛山期末]　语篇导读：文章主要介绍了一些能够帮助你提高记忆力的食物和饮品',
  title:'Food that helps your memory',
  text:'Do you have trouble remembering where you put your eraser? Doing puzzles may help keep your mind sharp, but diet can make a big difference too.\n\n● According to many studies, some food and drinks may help to improve your memory. Why not try them? Scientists have found that sufficient（足够的）amounts of vitamin B2 can improve your memory. It\'s found in common things like milk and dark green vegetables.\n\n● You can add a banana to your breakfast. It will be easier for you to focus on what the teachers say.\n\n● Studies have shown that eating fish once a week produces a 10 per cent slower decline（衰退）in memory.\n\n● Try a cup of tea. Not only does it keep your brain working right, it also helps to relax and fight against mental tiredness.\n\n● We know that eggs are full of vitamin B12, which helps to fight against brain shrinkage（收缩）that is bad for the memory.\n\n● To improve your intake of zinc（锌）, you can eat more wholegrains. Wholegrains help your brain work well.\n\nIf you\'re really serious about improving your memory, don\'t forget to make time for a good breakfast. A study found breakfast helped people score better on memory tests. And when kids eat a morning meal, their exam scores improve. "You are what you eat." A well-balanced diet is of course great for your body. What\'s more, junk food like hamburgers, chips and candies is bad for your health and memory. You should try to keep away from it.'},

 {n:1,t:'How many healthy foods are mentioned in the article?',
  o:['Five.','Seven.','Eight.','Ten.'],r:0,
  ex:'细节理解题。根据文中内容可知提到了深绿色蔬菜、香蕉、鱼、鸡蛋、全麦五种食物。'},

 {n:4,t:"What's the purpose of this article?",

{id:'u7-s1r2-cloze',ord:704,u:7,sec:'Section 1　Reading (Ⅱ) 完形填空',tag:'能力',em:'📷',mins:8,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：250　难度：★★★　语篇导读：本文主要介绍了拍照可能会损害大脑储存记忆的能力，并提出了一些解决方法',
  title:'Taking photos and memory',
  text:'You may use your phone to remember some perfect moments in your life. But before you do this, here\'s a(n) __1__ finding that photo-takers need to know: Taking photos is not the perfect memory-storage（记忆储存）tool.\n\n__2__, taking too many pictures could harm the brain\'s __3__ to keep memories, according to Elizabeth Loftus, a psychological（心理学的）science professor at the University of California. So you may get the photo __4__ kind of lose some memories.\n\nIt works in two ways. Loftus explains, "We __5__ let go of the duty of remembering moments, or we\'re so distracted（使分心）by the process of taking a photo."\n\nSimilarly, if you write down someone\'s phone number, you\'re less likely to remember it at any time __6__ your brain tells you there\'s just no need.\n\nBut photo-takers don\'t need to __7__. Here are some tips.\n\n● Take a few good pictures, then put down the phone. If your goal is to remember a special trip or event, __8__ the time with your camera is necessary.\n\n● Have someone else take the photos. Ask a friend or a family member to take photos for you at important events so you can __9__ enjoy the activity.\n\n● __10__ your photos regularly. Photos are a useful tool for memory keeping only if we spend time looking through photos, but not every one can do that.'},
 qs:[
 {n:1,t:'第 (1) 空',o:['surprised','excited','surprising','exciting'],r:2,
  ex:'句意为：但在你这样做之前，拍照者需要知道一个令人惊讶的发现：拍照并不是完美的记忆储存工具。根据空前的 But 及语境可知，此处表示"令人惊讶的"，且设空处修饰事物，故选 C 项。'},
 {n:2,t:'第 (2) 空',o:['In fact','At first','In short','At times'],r:0,
  ex:'空后描述的是一个事实，in fact 意为"事实上"，符合语境。故选 A 项。'},
 {n:3,t:'第 (3) 空',o:['advantage','health','ability','activity'],r:2,
  ex:"根据 harm the brain's 以及 keep memories 可知，此处表示损害大脑保持记忆的能力。ability 意为\"能力\"，故选 C 项。"},
 {n:4,t:'第 (4) 空',o:['or','but','however','so'],r:1,
  ex:'句意为：所以你可能会得到照片，但稍微失去一些记忆。设空前后内容之间为转折关系，应用 but。故选 B 项。'},
 {n:5,t:'第 (5) 空',o:['either','whether','none','neither'],r:0,
  ex:'"either… or…"意为"要么……要么……"，符合语境。故选 A 项。'},
 {n:6,t:'第 (6) 空',o:['unless','until','because','although'],r:2,
  ex:'句意为：同样，如果你写下某人的电话号码，你就不太可能在任何时候记住它，因为你的大脑告诉你根本没有必要。设空前后内容之间为因果关系，且空后表原因，应用 because 引导原因状语从句。故选 C 项。'},
 {n:7,t:'第 (7) 空',o:['think over','feel down','take care','try out'],r:1,
  ex:'后文描述了解决问题的方法，故此处表示不需要沮丧。故选 B 项。'},
 {n:8,t:'第 (8) 空',o:['warning','regretting','reducing','spending'],r:2,
  ex:'句意为：如果你的目标是记住一次特殊的旅行或活动，那么减少带相机的时间是必要的。根据语境，故选 C 项。'},
 {n:9,t:'第 (9) 空',o:['fully','angrily','suddenly','politely'],r:0,
  ex:'句意为：请朋友或家人在重要活动中为你拍照，这样你就可以充分享受活动。fully 意为"完全地"，符合语境。故选 A 项。'},
 {n:10,t:'第 (10) 空',o:['Take away','Work out','Put away','Look at'],r:3,
  ex:'根据下一句可知，此处指定期看你的照片。look at 意为"看"，故选 D 项。'}
]},

{id:'u7-s1r2-restore',ord:705,u:7,sec:'Section 1　Reading (Ⅱ) 阅读还原',tag:'能力',em:'🧷',mins:7,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：203　难度：★★　语篇导读：本文主要介绍了科学家的一个发现',
  title:'Forgetting is part of learning',
  text:'Have you ever forgotten where your socks are when you wake up in the morning? Can you remember what you ate for lunch a week ago? __11__ But now you should be thankful.\n\nScientists from the University of Toronto found that forgetting is actually a key part of learning. Clearing out unnecessary information can help our brains work better. __12__ Scientists say that this may have something to do with the environment we live in. __13__ For example, a supermarket cashier（收银员）meets many people every day and will probably only remember them for a short time. But a designer who often meets his or her customers will remember longer.\n\nThat\'s because our brains keep making new neurons（神经元）from stem cells（干细胞）, said Paul Frankland, a professor at the University of Toronto. There is a special area in our brains called the hippocampus（海马体）. __14__ When new neurons go into the hippocampus, they renew our old memories.\n\nHowever, sleep has a great influence on our memories. __15__ Sleep helps the brain store and keep new facts and information, said Matthew Walker from the University of California.\n\n【备选句子】\nA. What kind of information is unnecessary?\nB. It is important for us when we learn and remember things.\nC. You may think that being forgetful is not a good thing.\nD. When we don\'t have enough sleep, we may have a hard time remembering new information.\nE. In an environment that is always changing, our brains may require us to remember less.'},
 qs:[
 {n:11,t:'第 (11) 空该填哪一句？',
  o:['What kind of information is unnecessary?','It is important for us when we learn and remember things.','You may think that being forgetful is not a good thing.',"When we don't have enough sleep, we may have a hard time remembering new information.",'In an environment that is always changing, our brains may require us to remember less.'],r:2,
  ex:'根据"But now you should be thankful."可知空处应该是和"心存感激"相反的内容。选项 C（你可能认为健忘不是一件好事。）符合语境。'},
 {n:12,t:'第 (12) 空该填哪一句？',
  o:['What kind of information is unnecessary?','It is important for us when we learn and remember things.','You may think that being forgetful is not a good thing.',"When we don't have enough sleep, we may have a hard time remembering new information.",'In an environment that is always changing, our brains may require us to remember less.'],r:0,
  ex:'根据语境可知选项 A（哪种信息是不必要的？）符合语境，空前的 unnecessary information 为提示信息。'},
 {n:13,t:'第 (13) 空该填哪一句？',
  o:['What kind of information is unnecessary?','It is important for us when we learn and remember things.','You may think that being forgetful is not a good thing.',"When we don't have enough sleep, we may have a hard time remembering new information.",'In an environment that is always changing, our brains may require us to remember less.'],r:4,
  ex:'根据"Scientists say that this may have something to do with the environment we live in."可知，此处与环境有关，选项 E 符合语境。'},
 {n:14,t:'第 (14) 空该填哪一句？',
  o:['What kind of information is unnecessary?','It is important for us when we learn and remember things.','You may think that being forgetful is not a good thing.',"When we don't have enough sleep, we may have a hard time remembering new information.",'In an environment that is always changing, our brains may require us to remember less.'],r:1,
  ex:'根据上文介绍海马体以及下文"When new neurons go into the hippocampus, they renew our old memories."可知，选项 B（当我们学习和记忆事物时，它对我们很重要。）符合语境。'},
 {n:15,t:'第 (15) 空该填哪一句？',
  o:['What kind of information is unnecessary?','It is important for us when we learn and remember things.','You may think that being forgetful is not a good thing.',"When we don't have enough sleep, we may have a hard time remembering new information.",'In an environment that is always changing, our brains may require us to remember less.'],r:3,
  ex:'根据"However, sleep has a great influence on our memories."以及下文可知，选项 D 符合语境。'}
]},

{id:'u7-s2g-nl',ord:707,u:7,sec:'Section 2　Grammar 语法填空',tag:'能力',em:'🇷🇺',mins:8,type:'read',
 psg:{meta:'[2025 辽宁沈阳期末]　语篇导读：本文以回忆的方式介绍了作者在俄罗斯生活和学习的美好回忆',
  title:'My memories of Moscow',
  text:"I still remember visiting Moscow. It is the capital of Russia, one of the __1__ (large) country in the world. I went there __2__ my parents when I was eight years old. I lived and studied there for one year and I had many happy __3__ (memory). One of the most interesting things of that city __4__ (be) that there were many dogs. Perhaps Russians liked dogs very much. You could see dogs here and there. Almost each of the families had a dog. I made friends with many __5__ (Russia) children when I was living and studying there. They were all very nice. They had fair hair and fair skin. I played with them __6__ (happy) though I could only speak a little Russian at first. They were __7__ (friend) to me. At that time, the weather in Moscow was very cold. It __8__ (snow) almost every day in winter. The ground was always __9__ (cover) with a lot of snow. We often made snowmen together. Now I am back in China and live a happy life, __10__ I still remember my life in Moscow."},
 qs:[
 {n:1,t:'第 (1) 空',hint:'用所给词的适当形式：large',a:['largest'],
  ex:'由 one of the 和 in the world 可知，此处表示世界上（面积）最大的国家之一，应用形容词的最高级形式。故填 largest。'},
 {n:2,t:'第 (2) 空',hint:'不给词，根据句意填一个词',a:['with'],
  ex:'句意为：当我八岁的时候，我和我的父母去那里。with 意为"与……一起"，符合语境。'},
 {n:3,t:'第 (3) 空',hint:'用所给词的适当形式：memory',a:['memories'],
  ex:'句意为：我在那里生活和学习了一年，我有许多快乐的记忆。根据 many 可知，memory 在此处作可数名词，所以应用其复数形式。'},
 {n:4,t:'第 (4) 空',hint:'用所给词的适当形式：be',a:['was'],
  ex:'句意为：那个城市最有趣的事情之一是有许多狗。结合上下文可知，此处时态为一般过去时；"one of…"作主语时，谓语动词应用第三人称单数形式。故填 was。'},
 {n:5,t:'第 (5) 空',hint:'用所给词的适当形式：Russia',a:['russian'],
  ex:'句意为：当我在那里生活和学习的时候，我和许多俄罗斯孩子成了朋友。此处作定语修饰 children，应用形容词形式。Russia 的形容词形式 Russian 意为"俄罗斯的"。'},
 {n:6,t:'第 (6) 空',hint:'用所给词的适当形式：happy',a:['happily'],
  ex:'句意为：尽管起初我只会说一点俄语，但是我和他们玩得很开心。设空处修饰动词 played，应用副词。'},
 {n:7,t:'第 (7) 空',hint:'用所给词的适当形式：friend',a:['friendly'],
  ex:'句意为：他们对我很友好。固定短语 be friendly to 意为"对……友好"。故填 friendly。'},
 {n:8,t:'第 (8) 空',hint:'用所给词的适当形式：snow',a:['snowed'],
  ex:'句意为：冬天几乎每天都下雪。由前一句中的 At that time 可知，此处时态应用一般过去时。'},
 {n:9,t:'第 (9) 空',hint:'用所给词的适当形式：cover',a:['covered'],
  ex:'句意为：地上总是覆盖着很多雪。be covered with 意为"（被）覆盖着……"。'},
 {n:10,t:'第 (10) 空',hint:'不给词，根据句意填一个词',a:['but'],
  ex:'句意为：现在我回到了中国并过着幸福的生活，但是我仍然记得我在莫斯科的生活。设空前后分句为转折关系，应用连词 but 连接。'}
]},

  t:'[2025 广东广州期末] 假设你是李华，你的英国笔友 Tom 向你请教如何提高记忆力。请你根据以下提示给他写封回信，提出你的建议。\n\n提示（思维导图·提高记忆力）：\n　【锻炼大脑】做新事情｜改变日常习惯\n　【健康生活】均衡饮食｜给大脑足够时间休息\n　【保持放松】不要太焦虑｜……（自行补充）\n\n要求：①词数不少于 80（短文的开头和结尾已给出，不计入词数）；②不得透露学校、姓名等任何个人信息，否则不予评分。',
  hint:"开头：Dear Tom, I'm glad to give you some advice on how to improve your memory.　结尾：I hope my advice can help you. I am looking forward to your improvement. Best wishes! Yours, Li Hua",
  model:"Dear Tom,\n\n　　I'm glad to give you some advice on how to improve your memory.\n\n　　First of all, in order to improve your memory, it's a good idea to do some new things and change your daily habits. In this way, you can make your brain become more active and creative. Besides, living a healthy lifestyle also makes sense, which requires a balanced diet and enough time for your brain to relax after a busy day. What's more, I suggest you not be too nervous and keep relaxed, or you can't focus on your study the next day. Finally, if you have any trouble, please talk to your friends and teachers anytime you need.\n\n　　I hope my advice can help you. I am looking forward to your improvement.\n\n　　Best wishes!\n\n　　　　　　　　　　　　　　　　　　Yours,\n　　　　　　　　　　　　　　　　　　Li Hua"}
]},

{id:'u7-wk',ord:712,u:7,sec:'外刊阅读速递',tag:'能力',em:'🌍',mins:7,type:'read',
 psg:{meta:'体裁：说明文　题材：科普知识与现代技术　词数：276　难度：★★★　素材来源：Verywell Mind　语篇导读：本文主要介绍了改善记忆的几种方法',
  title:'How to improve your memory',
  text:"If you've ever found yourself forgetting where you left your keys or forgetting information on important tests, you've probably wondered how to improve memory. There are a lot of things for you to do to improve your memory.\n\n【Focus your attention】\nAttention is one of the most important parts of memory. In order to move information from your short-term memory into your long-term memory, you need to actively attend to the information. Try to study in a place without television, music, and games. Remember, set aside a period of time to be alone. Ask your roommates to give you some space so you can focus on your work.\n\n【Remember important information】\nHave you ever noticed how it is sometimes easier to remember the information at the beginning or the end of a passage? Researchers have found that the order of information can play a role in recalling（回忆起）things. But recalling the middle information can be difficult. You can solve this problem by spending more time remembering this information.\n\n【Read out loud】\nResearchers have found that reading materials（材料）out loud can improve your memory for the materials. Students can use <u>this way</u> to remember words, sentences and passages. When using this way, you'd better ask others around you for permission or do together.\n\n【Get a good sleep】\nResearchers have long known that sleep is important for memory and learning. Research has shown that taking a short rest after you learn something new can actually help you learn faster and remember better. So the next time you want to learn new information, consider getting a good sleep after your study."},
 qs:[
 {n:1,t:'Why does the writer say "Ask your roommates to give you some space so you can focus on your work." in Paragraph 2?',
  o:['Because roommates can help to work.','Because you must finish the work on time.','Because more space can offer chances.','Because the quiet place is good for work.'],r:3,
  ex:'推理判断题。这句话是说让你的室友给你一些空间，这样你就可以专注于你的工作。结合语境可知，作者是说安静的地方有益于工作。'},
 {n:2,t:'If you read a book with five parts, which part is the most difficult for you to recall?',
  o:['The first part.','The third part.','The first two parts.','The fifth part.'],r:1,
  ex:'推理判断题。根据第三段第三句"But recalling the middle information can be difficult."可知，回忆中间部分很困难。故选 B 项。'},
 {n:3,t:'What do the underlined words "this way" refer to?',
  o:['Reading out loud.','Choosing good materials.','Asking for permission.','Improving your memory.'],r:0,
  ex:'词义猜测题。根据第四段前两句可知，这种方法指的是大声朗读。'},
 {n:4,t:'What do we know from the fifth paragraph?',
  o:['You need more time to remember information.','Learning some new things needs more time.','A good sleep can help you remember better.','A short rest is not helpful in learning new things.'],r:2,
  ex:'主旨大意题。通读第五段可知，好的睡眠能帮助你更好地记忆。'},
 {n:5,tag:'新考法·篇章结构',t:'What is the structure of this passage?（P = Paragraph）\n　A. P1、P2、P3、P4 四段并列，最后汇到 P5\n　B. P1 在上，分出 P2、P3、P4、P5 四段（总分结构）\n　C. P1 → P2 → P3；P1 → P4 → P5\n　D. P1 → P2、P3；P3 → P4、P5',
  o:['A 图','B 图','C 图','D 图'],r:1,
  ex:'推理判断题。通读全文可知，本文第一段引出话题，后面四段介绍改善记忆的方法。故选 B 项。'}
]},

{id:'u7-b-yfxz',ord:713,u:7,sec:'B 阅读综合素养 · 语法选择',tag:'能力',em:'👴',mins:7,type:'read',

  text:"My grandfather is 72. My grandmother celebrated her __1__ birthday last month. I first noticed that they were having trouble __2__ things when I went to their flat for dinner. My grandmother forgot a fish in the oven and burnt __3__. Everyone forgets things. I sometimes forget where I put my things __4__. I did not think much about it until another time.\n\nOur whole family arranged to go out for dinner together. My grandfather __5__ to meet us at the train station. However, my grandparents were not there when we arrived. My mother made a call to them and my grandparents said they __6__ for us at home at that moment. They knew we would have dinner together, but they forgot about __7__ meeting place. It turned out that they always forgot simple things. I then started thinking about what I __8__ do to help my grandparents improve their memory.\n\n__9__ my memory is not bad, I still make a list of things I need to bring to school the next day before I go to bed. It is a good habit __10__ me from forgetting anything. I told my grandparents to write more things down and share information __11__ each other.\n\nI talked with the school doctor __12__ often offered me great help. She told me that eating fish could improve memory. She also said that drinking more water could make it much __13__ to remember things. I wrote some advice on a piece of paper __14__ gave it to my grandparents.\n\nSince my grandparents began following the suggestions, they __15__ their memory a lot. They are happy. So am I!"},

{id:'u7-b-biaoda',ord:715,u:7,sec:'B 阅读综合素养 · 阅读与表达',tag:'能力',em:'📓',mins:7,type:'read',
 psg:{meta:'素养：学习能力　体裁：说明文　词数：304　难度：★★★　[2025 辽宁铁岭调研]　新素材·素材话题：学习新单词的方法',
  title:'How to learn new words',
  text:'Did you know that vocabulary is more important than grammar? Wide vocabulary can help us communicate successfully though the grammar is not perfect.\n\nHowever, one common problem is learning new words and then forgetting them. So when you want to use a new word in a conversation, you can\'t memorize it at that moment. Does this often happen to you? The reason for this difficulty is that most students try to learn vocabulary by studying lists and dictionaries and memorizing the words. But it may not work if you don\'t have a very good memory.\n\nThe best way to memorize the words successfully is to write the words and use them at once. You can do this with a very simple exercise. Every time you learn a new word, for example, from an English lesson or an article, write it down in your vocabulary notebook. Writing is more active than just reading a definition. You should write the word, the definition in English or translation, one example sentence from the article or the dictionary and another example sentence that you create.\n\nImagine you\'ve just learnt the word "generous", write it down in your vocabulary notebook: generous（adjective）, definition—giving or willing to give freely. Example one, from the article: Thanks for paying for my dinner. You\'re very generous. Example two, my example: My brother is generous because he always buys me some toys. Try to make your own example sentences true to your life because this creates a personal connection with the new word. The next day, read your vocabulary notebook again and try to add one more example sentences by using the new word. It\'s helpful for you to memorize it. These two simple steps—writing the word and using it at once—help you memorize and use new words.'},

{id:'u7-c-readA',ord:717,u:7,sec:'C 单元限时检测 · 阅读理解 A',tag:'能力',em:'💭',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解（12 分）A 篇　语篇导读：本文介绍了梦境与现实的相关信息',
  title:'What do dreams mean?',
  text:'① Just like a movie, a dream has a story to tell and it has something to do with your life. So, take a closer look at your dreams. And they can open doors into your world.\n\n② Martha, 35 years old, said that last night she had an unusual dream. She dreamt that she was flying. When she moved her arms up and down, she moved higher into the sky. She felt as free as a bird. Flying is a good symbol in a dream. Flying in dreams may mean success, confidence（自信）, and "being on top of it all".\n\n③ Jason, a 14-year-old boy, said that he had a bad dream that kept coming back. He walked out of his bedroom, and a monster（怪物）came out and ran after him. Monsters in dreams often show fears（恐惧）. For Jason, the monsters may stand for the adults who control his life. Or it may mean Jason\'s fears about growing up and he is very sad.\n\n④ Here are some other common symbols in dreams. Mountains are difficulties, so dreams about successfully climbing a mountain can show a true feeling of achievement（成就）. Water is peaceful in life. But a big wave in dreams probably means an emotional（情绪的）worry. Food is a symbol of knowledge, because it nourishes（滋养）the body just as information nourishes the brain.\n\n⑤ Dreaming is a way to make memories of your emotions. You may dream the same things again and again. They are like a bridge which connects your experiences with your emotions and memories. They will help you get a better understanding of yourself.'},

{id:'u7-c-readB',ord:718,u:7,sec:'C 单元限时检测 · 阅读理解 B',tag:'能力',em:'🧩',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解 B 篇　[2024 辽宁本溪期末]　语篇导读：本文介绍了如何提高我们的记忆力',
  title:'Ways to improve memory',
  text:'We\'ve all been there—looking at a book directly, hoping that what we study will stick in our mind. Many of us have probably wondered, "Is there any ways to improve memory?" So, why don\'t we look at what memory experts say about this?\n\nEvery student knows that it\'s helpful to review what they\'ve studied before. According to experts, we can learn things better if we wait some time before trying to study them again. They say that trying to recall something will make it easier to remember in future.\n\nSimilarly, studies have shown that taking some time just to do nothing after studying might mean that you can remember things better afterwards（之后）. It is not clear why this happens. But some think it has something to do with the relationship between long-term and short-term memory.\n\nAnother study tip is to change between different topics as you study. This can help you make connections between different ideas. Now, connecting <u>them</u> to each other or to images is often considered to be a good way to remember something. The world memory champion Jonathan Hancock says picturing pieces of information in different physical locations（位置）or connecting them to memorable images makes them easier to remember.\n\nThere are also more things that we can do to improve our memory. Hancock says that being generally organized makes things easier for your brain. Many other experts also suggest that we should get a lot of rest and exercise. So, the good news to take from this is that while it may be hard, improving our memory is something we can do.'},
 qs:[

  ex:'推理判断题。根据第一段最后两句可知，作者通过提出问题引出文章的主题——如何提高记忆力。'},

 {n:16,tag:'新考法·选项选择',t:'What would Hancock advise?\n① Doing nothing after studying.\n② Having enough rest.\n③ Connecting new things with memorable images.\n④ Being generally organized.',

  ex:'细节理解题。根据 connecting them to memorable images 和 being generally organized makes things easier for your brain 可知③④符合题意。'}

  title:'How to become a better student',
  text:"Maybe you are an ordinary student. __17__ However, anyone can become a better student if he or she wants to. Here's how:\n\n【Plan your time carefully.】\nWhen planning your work, you should make a list of things that you have to do. After making this list, you should make a schedule（进度表）of your time. First, arrange（安排）your time for eating, sleeping, dressing, etc. Then decide a good regular time for studying. __18__ It's also important to relax. A weekly schedule may not solve all your problems, but it will help you realize what is happening to your time.\n\n【Make good use of your time in class.】\n__19__ Listening carefully in class means less work later. Taking notes will help you remember what the teacher says.\n\n【Study regularly.】\nWhen you get home from school, go over your notes, review the important points that your teacher is going to discuss the next day, and read that material. __20__ If you do these things regularly, the material will become more meaningful, and you will remember it longer.\n\n__21__\nThe purpose of a test is to show what you have learnt about a subject. The world won't end if you don't pass a test, so don't be overworried.\n\nThere are some ways that might help you with your study. You will probably discover many others after you have tried these.\n\n【备选句子】\nA. These will help you understand the next class.\nB. You probably think you will never be a top student.\nC. Don't forget to set aside enough time for entertainment（娱乐）.\nD. No one can become a top student unless he or she works hard.\nE. Develop a good attitude（态度）towards tests.\nF. Take advantage of class time to listen to everything the teacher says."},

  text:'A new study shows that pigeons（鸽子）have amazing memories. The report says they can use landmarks（地标）to __22__ their way, even after four years.\n\nThe report came from an experiment in 2015. In the experiment the birds tried to go back their home from a farm 8.6 kilometres away. When they were brought back to the __23__ place in 2019 and 2020, the birds were __24__ to plan their routes in a correct way. A zoologist said, "It seemed that the last time they __25__ there was just the day before, not four years ago."\n\nPigeons have had a long connection with people. They are among the cutest domesticated（家养的）birds. Their ability to remember way home made them valuable. In ancient times, people used them to carry important __26__ quickly over long distances.'},

{id:'u7-c-xiezuo',ord:721,u:7,sec:'C 单元限时检测 · 书面表达',tag:'写作',em:'📝',mins:25,type:'essay',
 qs:[
 {n:27,essay:true,zh:'以《A Good Memory》为题写一篇短文（80 词以上）',
  t:'请以"A Good Memory"为题，根据下面的内容要点写一篇短文。\n\n内容包括：\n（1）好的记忆力在我们的学习中起着越来越重要的作用，好成绩常和好的记忆力有关；\n（2）好的记忆力给我们带来很多好处，使我们的学习更轻松；\n（3）好的记忆力偶尔也给我们的生活带来麻烦——我们花更长时间忘记他人的错误等；\n（4）拥有好的记忆力很有必要。\n\n要求：①词数不少于 80（标题已给出，不计入总词数）；②文章必须包含所有提示内容，并可作适当发挥；③条理清楚，语句通顺，意思连贯，书写规范。',
  hint:'可以用 On the one hand… On the other hand… / However… / In my opinion… 三段来写',
  model:"A Good Memory\n\n　　A good memory plays a more and more important role in our study. It can bring us lots of benefits. On the one hand, a good memory often helps us get better marks. On the other hand, we can remember things more quickly and learn lessons more easily. So we can have more free time to do the things we like.\n\n　　However, we sometimes can meet trouble with a good memory. For example, it takes us longer time to forget others' mistakes and we may be unkind to those people who hurt us.\n\n　　In my opinion, it is necessary for us to have a good memory if we want to live a better life."}
]},

  title:'Volunteering with cats',
  text:"I am a history teacher. I have been in a middle school in San Francisco for the past five years. I have also been volunteering to work with the cats. It really __1__ my life.\n\nI have helped to get the cats adopted（领养）, cleaned their home and fed them with __2__ and attention. There are so many cats on the street with no one to care for them, and I have helped over a hundred cats get adopted. This includes very lovable and young cats that are __3__ to get adopted as well as some seriously hurt, unwelcome, old cats. It has been a different __4__ for me.\n\nWhen I started, I only __5__ to do it to stay busy for the summer, because I'm a teacher and I get the summers off; but then I got __6__. There's nothing like watching a cat go out the door with a happy new pet parent.\n\nIt has made me grateful for the things I have, and also for my own cats. I am sure that people are born to be __7__, because I get to see everyone at their best. It is proud of me to have the responsibility and help someone __8__ their favourite cats.\n\nSome people like active cats which they can play with a lot, and some like the cats that can just lie around and stay __9__ with them while they watch TV.\n\nThis experience has made me realize that every cat is special, and everyone needs the joy of pet __10__. I do benefit a lot from this volunteering experience!"},

{id:'u8-s1r2-restore',ord:805,u:8,sec:'Section 1　Reading (Ⅱ) 阅读还原',tag:'能力',em:'🐶',mins:6,type:'read',
 psg:{meta:'体裁：说明文　题材：自然　词数：175　难度：★★　[2024 广东广州期中]　语篇导读：本文介绍了一项关于狗看到久别重逢的主人会喜极而泣的研究',
  title:'Dogs cry tears of joy',
  text:"There is a saying that dogs are humans' best friends. __11__ Scientists believe the bond（纽带）between humans and dogs is deeper than we thought. The scientists discovered that dogs cry tears of joy when they see their owners after a period of absence. __12__ They tested the behaviour of the dogs. They especially looked at how the dogs reacted when they reunited（重聚）with their owners and with other people they had daily contact with. The scientists said that when the dogs saw their owners, they cried.\n\nThe scientists, from Azabu University and Jichi Medical University, put some strips of paper under the dogs' eyes. __13__ The scientists found that when the humans and dogs reunited after five to seven hours of separation（分开）, the dogs shed tears. Researcher Takefumi Kikusui said, \"We had never heard of the discovery that animals shed tears in joyful situations, such as reuniting with their owners.\" He added, \"__14__ It's possible that dogs who show teary eyes during interaction（交流）with humans would be cared for more.\" He believes the tears may make humans love their dogs more.\n\n【备选句子】\nA. The scientists studied 22 dogs.\nB. They then checked to see if, and when, the dogs cried.\nC. He believes people will love their dogs more.\nD. Dogs and humans have shared close and loving relationships for thousands of years.\nE. Their tears might play a role in deepening each other's relationships."},
 qs:[
 {n:11,t:'第 (11) 空该填哪一句？',

  ex:"根据 dogs are humans' best friends 可知，此处介绍狗和人的关系，故选 D 项。"},
 {n:12,t:'第 (12) 空该填哪一句？',
  o:['The scientists studied 22 dogs.','They then checked to see if, and when, the dogs cried.','He believes people will love their dogs more.','Dogs and humans have shared close and loving relationships for thousands of years.',"Their tears might play a role in deepening each other's relationships."],r:0,
  ex:'根据"They tested the behaviour of the dogs."可知，此处介绍了一项关于狗的研究，故选 A 项。'},
 {n:13,t:'第 (13) 空该填哪一句？',
  o:['The scientists studied 22 dogs.','They then checked to see if, and when, the dogs cried.','He believes people will love their dogs more.','Dogs and humans have shared close and loving relationships for thousands of years.',"Their tears might play a role in deepening each other's relationships."],r:1,
  ex:"根据\"The scientists… put some strips of paper under the dogs' eyes.\"可知，此处应是介绍这些纸条的用途。结合选项，故选 B 项。"},
 {n:14,t:'第 (14) 空该填哪一句？',

{id:'u8-s2g-nl',ord:807,u:8,sec:'Section 2　Grammar 语法填空',tag:'能力',em:'🐾',mins:8,type:'read',
 psg:{meta:'[2025 辽宁沈阳期中]　语篇导读：本文主要论述了人们对养宠物的不同看法以及作者对此的观点',
  title:'Different opinions about pets',
  text:"Now more and more people like keeping pets. They think pets are useful to __1__ (they). Many families see pets as their family members like their daughters or sons. On the one hand, they think pets can stay with them when they are alone, because they are afraid __2__ being lonely. On the other hand, some pets are brave. When some people are in danger, the pets can save them, even in __3__ earthquake. Several days ago, some guide dogs even helped to send some old people to the hospital __4__ (success).\n\n__5__, other people are against keeping pets because of so many reasons. They think it is very wasteful（浪费的）to spend __6__ (hundred) of dollars on pets. In their opinion, the money should be used to help the poor. Some people are also worried about the illness that pets may bring to them. Pets don't know that people need a quiet __7__ (environment). So their sounds become the __8__ (big) problem in people's lives.\n\nHow different the opinions about pets are! I think __9__ (keep) pets is a personal choice. But if you can't deal with it well, that __10__ (make) your neighbours dislike you."},
 qs:[
 {n:1,t:'第 (1) 空',hint:'用所给词的适当形式：they',a:['them'],
  ex:'句意为：他们认为宠物对他们有用。这里的 to 是介词，后面需接人称代词的宾格形式，they 的宾格是 them。'},
 {n:2,t:'第 (2) 空',hint:'不给词，根据句意填一个词',a:['of'],
  ex:'be afraid of 是固定短语，意为"害怕……"，符合语境。'},
 {n:3,t:'第 (3) 空',hint:'不给词，根据句意填一个词',a:['an','the'],
  ex:'earthquake 是可数名词，此处可表示"一场地震"，且 earthquake 的发音以元音音素开头，所以用不定冠词 an；此处也可用定冠词 the 指一类事物。'},
 {n:4,t:'第 (4) 空',hint:'用所给词的适当形式：success',a:['successfully'],
  ex:'send 是动词，要用副词修饰；success 的副词形式 successfully 意为"成功地"，符合语境。'},
 {n:5,t:'第 (5) 空',hint:'不给词，根据句意填一个词',a:['however'],
  ex:'前文讲的是喜欢养宠物的原因，这里说其他人反对养宠物，因此设空前后是转折关系，且空后有逗号，应用 however；设空位于句首，故填 However。'},
 {n:6,t:'第 (6) 空',hint:'用所给词的适当形式：hundred',a:['hundreds'],
  ex:'hundreds of 是固定搭配，意为"数百……"，符合语境。'},
 {n:7,t:'第 (7) 空',hint:'用所给词的适当形式：environment',a:['environment'],
  ex:'句意为：宠物不知道人们需要一个安静的环境。根据 a 可知，此处应用单数名词。'},
 {n:8,t:'第 (8) 空',hint:'用所给词的适当形式：big',a:['biggest'],
  ex:'句意为：所以它们的声音成了人们生活中最大的问题。空前有定冠词 the，结合语境可知，这里表示"最大的问题"，应用 big 的最高级形式。'},
 {n:9,t:'第 (9) 空',hint:'用所给词的适当形式：keep',a:['keeping'],
  ex:'句意为：我认为养宠物是一种个人选择。I think 后接宾语从句，从句中 keeping pets 是动名词短语作主语。'},
 {n:10,t:'第 (10) 空',hint:'用所给词的适当形式：make',a:['will make'],
  ex:'句意为：但如果你不能处理好它，那会让你的邻居不喜欢你。这是一个含有 if 引导的条件状语从句的主从复合句，遵循"主将从现"原则，主句用一般将来时。'}
]},

 {n:4,essay:true,zh:'给英语周报编辑 Justin 回信，谈"养猫好还是养狗好"（80—100 词）',
  t:'[2024 辽宁沈阳期中] 假定你是李华，英语周报英文编辑 Justin 来信询问你对"养宠物是养猫好还是养狗好"这一话题的观点，请你用英文给他回信。\n\n内容包括：\n（1）陈述观点；\n（2）陈述原因或事实；\n（3）发表结论。\n\n要求：①词数 80~100，格式和开头已给出，不计入总词数；②可以适当增加细节，以使行文连贯。',
  hint:'开头：Dear Justin, Nowadays, many people like keeping pets. Most people choose to keep cats or dogs as their pets.　结尾：Yours, Li Hua　　可以用 First… Second… Finally… 讲三条理由',
  model:"Dear Justin,\n\n　　Nowadays, many people like keeping pets. Most people choose to keep cats or dogs as their pets. As for me, I prefer to keep cats as my pets.\n\n　　First, it's much easier to keep cats. You needn't walk them or play with them all the time. Second, I think cats are lovelier than dogs. In general, cats are smaller than most dogs so it feels nicer to hold them in our arms. Finally, cats are cleaner than dogs. They seldom go outside and they can clean themselves by licking their hairs.\n\n　　So I think it's a good idea to keep cats because they will bring me lots of happiness.\n\n　　　　　　　　　　　　　　　　　　Yours,\n　　　　　　　　　　　　　　　　　　Li Hua"}
]},

{id:'u8-wk',ord:812,u:8,sec:'外刊阅读速递',tag:'能力',em:'🌍',mins:7,type:'read',
 psg:{meta:'体裁：说明文　题材：自然　词数：278　难度：★★★　素材来源：Man Writes　语篇导读：本文主要介绍了三个人的宠物狗',
  title:'Describing your dog',
  text:"To many people, a dog is a part of the family. Describing your dog should not be too difficult, for you know your dog so well.\n\nI'm Dick. My German Shepherd dog is quite big. His coat is brown. He has long, pointed ears that always stand straight. But if he is angry, his ears lay flat on his head. He also has dark brown eyes that always seem very bright to me. His body is very strong. When I play with him, I can feel how strong he is. He is probably stronger than me. If he has a stick in his mouth, it can be very hard to pull it from him—he refuses to let it go.\n\nI'm Amy. My Labrador is happy most of the time. He likes to play and he always seems happy to see me. Sometimes my dog has a very sad look on his face. Maybe it's just the way he looks, as he has big sorrowful eyes. My dog can be quite angry sometimes. He gets angry when people knock at the door. I always teach him not to do so, but he doesn't change this. But in the most time my dog is friendly. He loves people and other dogs…\n\nI'm Peter. My pug is a small dog and kind of fat. He loves to go for walks in the countryside. Every time we go to the forest for a walk, my dog starts chasing（追逐）after squirrels. He hasn't caught <u>one</u> yet, but it doesn't stop him from trying. And whenever my dog sees another dog outside, he always has to run up to it and start playing."},
 qs:[
 {n:1,tag:'新考法·选项选择',t:"Which of the following is right about Dick's German Shepherd dog?\na. He has brown coat.\nb. His ears always lay flat.\nc. His eyes are dark brown.\nd. He has a strong body.",
  o:['abc','acd','abd','bcd'],r:1,
  ex:'细节理解题。根据第二段中的"His coat is brown."和"He also has dark brown eyes that…"以及"His body is very strong."可知 a、c、d 正确；b 项与"He has long, pointed ears that always stand straight."不符。'},
 {n:2,t:"How does Amy's Labrador sometimes feel?",
  o:['Happy and friendly.','Worried and sorrowful.','Sad and angry.','Angry but friendly.'],r:2,
  ex:'细节理解题。根据第三段中的"Sometimes my dog has a very sad look on his face."和"My dog can be quite angry sometimes."可知选 C 项。'},
 {n:3,tag:'新考法·后续发展',t:'What will Amy say in the end?',
  o:['He is always happy to meet them.','He will leave my home.','He will change his idea.','He becomes angry with them.'],r:0,
  ex:'推理判断题。根据第三段最后"But in the most time my dog is friendly. He loves people and other dogs…"可推知，艾米接下来会说她的狗总是很高兴见到他们。'},

  ex:'词义猜测题。根据"my dog starts chasing after squirrels. He hasn\'t caught one yet"可知，one 指代 squirrel（松鼠）。'},
 {n:5,t:'Which one of the statements below is a fact according to the passage?',
  o:['A dog is a part of the family to all the people.','Dick sometimes finds he is stronger than his dog.','Amy always teaches her dog not to get angry.','Peter likes to chase after animals with his pug.'],r:2,
  ex:'细节理解题。根据第三段中的"I always teach him not to do so"可知选 C 项。'}
]},

{id:'u8-b-yfxz',ord:813,u:8,sec:'B 阅读综合素养 · 语法选择',tag:'能力',em:'🐦',mins:8,type:'read',
 psg:{meta:'素养：文化意识　体裁：记叙文　词数：292　难度：★★★　语篇导读：本文主要讲了一只出生时比其他鸟脆弱的小鸟经过自己的不懈努力变强的故事',
  title:'Little Six',
  text:"It was a beautiful spring day in a forest in ancient China. High up in a tree, a mother bird was watching __1__ six baby birds come out of the eggs lovingly. Five of them were strong. They chirped loudly. But __2__ last one that came out was not strong at all. This little one __3__ Little Six. He was weak and quiet. He was not fast enough __4__ the worms（虫子）Mama Bird brought back. Little Six ate __5__ food, so he was always hungry. And he didn't like that.\n\nLittle Six didn't have a strong body, __6__ he had a strong will. He decided __7__ he would get stronger. He would do exercise and flap（拍动）his wings every day.\n\nEvery morning, Little Six would rise __8__ the sun even came up. When his brothers and sisters woke, Little Six had already finished all his exercise. Morning after morning, he practised __9__ his wings, and they were getting stronger and stronger. He always got the first worms Mama Bird brought back home.\n\nAll through the spring, Little Six woke up __10__ than his brothers and sisters. Week after week, he worked harder than they did. He __11__ eat big meals and did not go hungry any more.\n\nAfter a couple of months, all the baby birds had grown well. Mama Bird brought them together and __12__ them to fly. __13__ everyone's surprise, Little Six was the first to start flying!\n\n\"Chirp! Chirp! __14__ at me!\" Little Six cried __15__ while his brothers and sisters still fought hard, trying to fly up."},
 qs:[
 {n:1,t:'第 (1) 空',o:['she','her','hers','herself'],r:1,ex:'空处修饰 six baby birds，应用形容词性物主代词。'},
 {n:2,t:'第 (2) 空',o:['a','an','the','/'],r:2,ex:'此处特指最后一只鸟，应用 the。'},
 {n:3,t:'第 (3) 空',o:['called','was calling','was called','were called'],r:2,
  ex:'此处 This little one 与 call 之间是被动关系，应用被动语态，且主语是第三人称单数。'},
 {n:4,t:'第 (4) 空',o:['get','got','getting','to get'],r:3,
  ex:'"adj.+enough+to do sth"意为"足够……去做某事"。'},
 {n:5,t:'第 (5) 空',o:['little','few','much','many'],r:0,
  ex:'根据"… so he was always hungry. And he didn\'t like that."可知此处表示否定，且此处修饰不可数名词 food，应用 little。'},
 {n:6,t:'第 (6) 空',o:['and','but','because','so'],r:1,ex:'根据语境可知设空前后是转折关系。'},
 {n:7,t:'第 (7) 空',o:['what','why','when','that'],r:3,ex:'根据句子结构及语境可知此处应用 that 引导宾语从句。'},
 {n:8,t:'第 (8) 空',o:['before','after','until','if'],r:0,ex:'根据后一句可知是在太阳升起之前。'},
 {n:9,t:'第 (9) 空',o:['flap','to flap','flapping','flapped'],r:2,
  ex:'practise doing sth 意为"练习做某事"，为固定搭配。'},
 {n:10,t:'第 (10) 空',o:['early','earlier','earliest','the earliest'],r:1,ex:'根据 than 可知用比较级。'},
 {n:11,t:'第 (11) 空',o:['could','might','should','must'],r:0,ex:'根据语境可知此处表示"能"。'},
 {n:12,t:'第 (12) 空',o:['teach','teaches','taught','will teach'],r:2,
  ex:'根据 brought 和 and 可知时态是一般过去时。'},
 {n:13,t:'第 (13) 空',o:['In','To','For','At'],r:1,
  ex:"to one's surprise 意为\"令某人/某物吃惊的是\"，为固定搭配。"},
 {n:14,t:'第 (14) 空',o:['Look','Looks','To look','Looking'],r:0,ex:'此处是祈使句，应以动词原形开头。'},
 {n:15,t:'第 (15) 空',o:['happy','happier','happiness','happily'],r:3,ex:'空处修饰动词 cried，应用副词。'}

{id:'u8-b-biaoda',ord:815,u:8,sec:'B 阅读综合素养 · 阅读与表达',tag:'能力',em:'🐟',mins:7,type:'read',
 psg:{meta:'素养：思维品质　体裁：说明文　词数：213　难度：★★★　[2025 辽宁丹东期中]　新素材·素材话题：养鱼　语篇导读：本文主要介绍了人们为什么养鱼、鱼需要什么以及鱼吃什么',
  title:'Keeping fish',
  text:"Do you like animals? Do you want to keep animals? Many people like animals and want to keep a lovely animal as a pet. But it's a pity that they don't have enough place to keep most animals. So, keeping fish may be the best choice.\n\n【Why do people keep fish?】\nPeople keep dogs and cats because they enjoy their friendship. Fish can not be friendly, but they have beautiful shapes and colours. It's a pleasure to watch as they swim in their tank.\n\n【What do fish need?】\nFirst of all, the fish need a good tank, and you must fill the tank with some water. It is good for them to have a few water plants in the tank to keep the water clean. Putting a few snails（蜗牛）in the tank is also a good idea, because they will keep the tank clean.\n\n【What do fish eat?】\nThere are many kinds of fish food that you can get in the shops. Most are good for all kinds of fish. You should decide how many times a day to feed your fish based on their different species and body size. This will keep them healthy."},

{id:'u8-c-readA',ord:817,u:8,sec:'C 单元限时检测 · 阅读理解 A',tag:'能力',em:'📱',mins:6,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解（14 分）A 篇　语篇导读：本文主要介绍了一种可以辨别宠物感受的应用程序',
  title:'Happy Pets—an app that reads pets',
  text:"Do you know about pets' feelings? When is your dog happy? A new app called Happy Pets can tell you the answer.\n\nThe app can analyse（分析）the faces of cats and dogs. Then it can tell you what kind your pet is and how it is feeling. It can show you some feelings—happiness, anger, sadness and fear.\n\nScientists in Australia make the app. The key of the app is facial recognition（人脸识别）, a common use of AI（人工智能）. We can unlock our mobile phones with <u>it</u>. But this is the first time this technology has been applied to animals.\n\nHow does the app work? First, it analyses a picture of an animal. Then, it analyses the face of your pet. Is it a dog or a cat? Next comes the most important thing—finding out the feeling of the animal. For example, if a dog shouts at you with its wagging（来回摇摆的）tail, it means the dog is happy enough and it loves you. If a dog closes its eyes and mouth while moving its ears back, this means the dog is afraid. When a dog is quiet and lies on the ground, it may feel sick or unhappy. To get this skill, the app \"saw\" and \"read\" a lot of example pictures before.\n\nCan the app tell us the feeling of pets exactly? The scientists are sure about it. They also find that cats are more difficult to read than dogs. In the future maybe the app will analyse different sounds pets make."},
 qs:[

  o:['the picture','facial recognition','the mobile phone','the pet'],r:1,
  ex:'词义猜测题。根据"The key of the app is facial recognition… with it."可知 it 指代"人脸识别"。'},
 {n:12,t:'A dog named Puppy keeps moving back its ears with its eyes closed, it probably feels ___.',
  o:['happy','sad','afraid','angry'],r:2,
  ex:'细节理解题。根据"If a dog closes its eyes and mouth while moving its ears back, this means the dog is afraid."可知这意味着它害怕。'},
 {n:13,t:'Who may like this passage best?',

{id:'u8-c-readB',ord:818,u:8,sec:'C 单元限时检测 · 阅读理解 B',tag:'能力',em:'🦜',mins:7,type:'read',
 psg:{meta:'第Ⅱ题　阅读理解 B 篇　语篇导读：本文主要讲述了养宠物可以给身体有问题的人带来的好处',
  title:'Get Healthy with Animal Helpers',
  text:'① In today\'s world of modern science and medicine, a more traditional treatment（治疗）is once again becoming popular—animal friendship.\n\n② It is now well-known that people with problems such as heart disease（疾病）or cancer（癌症）live longer and get better more quickly if they have pets. Keeping pets lowers（降低）blood pressure and makes people less worried. Animals are increasingly important in treating older people who have memory loss（失忆）and other brain problems. These people often feel nervous and upset. Activities with animals help them improve their physical condition and also give them happiness, and loving friendship.\n\n③ Here is a case that shows the benefits（益处）of animals. John was a speech-impaired six-year-old boy. He had no physical problems. He just refused to talk. His older cousin, Ned, had a parrot（鹦鹉）called Sally, and John used to visit it. When he arrived, Ned used to say, "Hi, John!" We all know parrots copy what they hear. After a few visits, Sally began saying "Hi, John!" when John came into the room. Then, one day John turned to the parrot and replied, "Hi, Sally!" Saying with the parrot encouraged John to begin talking.\n\n④ Another use of animal helpers is in schools. In some cases, animals are used to help children with physical or personal problems. In other cases, they are used to teach children to get on and share with others, and even to teach them about animals.\n\n⑤ If you want to know more about animal helper programmes, you can get in touch with organizations like Riding for the Disabled or do research on the Internet. You don\'t have to be an animal trainer or a doctor to join in. You can work there as a volunteer. People there will welcome you.'},
 qs:[
 {n:14,t:'What does the second paragraph mainly tell us?',
  o:['The problems of keeping pets for people with physical problems.','The advantages of keeping pets for people with physical problems.','Some new medical studies on people with physical problems.','The reasons why so many people nowadays have physical problems.'],r:1,
  ex:'主旨大意题。根据第二段内容可知，该段主要介绍了身体有问题的人养宠物的好处。'},
 {n:15,t:'How are the third and fourth paragraphs mainly developed?',

  o:['①/②/③④/⑤','①②/③/④/⑤','①/②/③/④⑤','①②/③④⑤'],r:0,

{id:'u8-c-restore',ord:819,u:8,sec:'C 单元限时检测 · 阅读还原',tag:'能力',em:'🧷',mins:8,type:'read',

  title:'The benefits of keeping pets',
  text:"Do you have a pet? If you do, you must be an animal lover. Pets bring us more than we can imagine.\n\nAccording to a report, people who have pets usually have a better physical condition than those who don't. __18__ These advantages may come from the exercise of walking and playing with pets.\n\nOne study shows that petting animals can help those who are under stress relax while animal toys can't help people with this. __19__ In a study published in the journal Gerontology, old people who were given five crickets（蟋蟀）in a cage became happier than before.\n\nOther research studied pets' influence on children who have difficulty reading. __20__ \"Their opinions change and their skills improve,\" says Lisa Freeman, director of the Tufts Institute for Human-Animal Interaction in the United States.\n\n__21__ When staying with their pets, children don't need to be judged（评价）by their behaviour or grades. Experts said that pets give children the feeling of being accepted.\n\nBy keeping a pet, children can also learn to be responsible. __22__ They can't just throw them away after playing with them. Besides feeding and cleaning them, they need to care for them just as parents do for them.\n\n【备选句子】\nA. They will know that pets are their friends rather than their toys.\nB. Whether it is a gold fish, a dog or a cat, it can be with the old for a long time.\nC. That's because pet owners can have less stress by having a good animal friend.\nD. For most shy children, keeping a pet is a good way to increase their confidence.\nE. They usually have lower blood pressure and a lower risk of having heart problems.\nF. When the children were asked to read aloud to a trained dog, they were less nervous."},

{id:'u8-c-tianci',ord:820,u:8,sec:'C 单元限时检测 · 语篇填词',tag:'基础',em:'🖇',mins:5,type:'read',
 psg:{meta:'第Ⅳ题　语篇填词（5 分）　[2025 广东广州期末]　语篇导读：本文介绍了人们养宠物的原因和一些未来设想',
  title:'Pets now and in the future',
  text:"Many people like animals, and take them as their pets. The old people think pets can stay with them when they feel __23__. Pets can even bring them __24__ when they are sad. Scientists think that pets will probably be much smaller because people in the future will be living in much smaller spaces. Scientists are already working on making very small farm animals such as smaller cats and dogs. It's also said that some day you might own a panther（黑豹）as a pet. Scientists might have to start turning __25__ animals into pets. What about a robot for a pet? This may sound silly, but it could become true. Robot dogs have been made to bark like real dogs. After all, robots don't lose hair or chew on things the way real pets do. People don't need to __26__ them or take care of them either. Lots of people miss their pets __27__ they are on holiday. Some hotels have solved this problem. They lend cats to their guests. Many experts believe this idea will become more and more popular. It is very possible that in the future you will be able to order a pet, as well as room service, at a hotel."},
 qs:[
 {n:23,t:'第 (23) 空',hint:'首字母提示：l',a:['lonely'],w:'lonely',
  ex:'句意为：老人认为宠物能在他们感到孤独时和他们待在一起。根据 The old people think pets can stay with them 可知，此处表示在他们孤独的时候；feel 后接形容词，lonely 意为"孤独的"。'},
 {n:24,t:'第 (24) 空',hint:'首字母提示：h',a:['happiness'],
  ex:'句意为：当他们难过的时候，宠物甚至可以给他们带来快乐。根据 when they are sad 可知，happiness 意为"快乐"，为不可数名词。'},
 {n:25,t:'第 (25) 空',hint:'首字母提示：w',a:['wild'],
  ex:'句意为：科学家们可能不得不开始把野生动物变成宠物。根据"turning… animals into pets"可知是把野生动物变成宠物，wild animals 意为"野生动物"。'},
 {n:26,t:'第 (26) 空',hint:'首字母提示：f',a:['feed'],
  ex:'句意为：人们也不需要喂养它们或照顾它们。根据语境和首字母提示可知，此处表示喂养它们，feed 意为"喂养"；动词不定式符号 to 后接动词原形。'},
 {n:27,t:'第 (27) 空',hint:'首字母提示：w',a:['when','while'],

{id:'u8-c-xiezuo',ord:821,u:8,sec:'C 单元限时检测 · 书面表达',tag:'写作',em:'📝',mins:25,type:'essay',
 qs:[
 {n:28,essay:true,zh:'写一份倡议书，倡导人们不要遗弃宠物狗（80 词左右）',
  t:'近年，城市的流浪狗越来越多。政府设置了流浪狗收容所，但是还是不能解决根本问题。现在请你以一名中学生的身份，写一份英文倡议书，倡导人们不要遗弃宠物狗。\n\n倡议书的要点包括：\n（1）狗会忠诚于主人，给人们带来乐趣；\n（2）饲养狗可以培养人的责任感；\n（3）狗是人类的朋友，应该和人类和谐相处；\n（4）我们应该爱护狗，不应该遗弃它们。\n\n提示词：被遗弃的 abandoned　陪伴 accompany　和谐 harmony\n要求：①80 词左右；②必须包括以上全部要点，可以适当发挥；③文中不得出现真实姓名和校名；④条理清楚，语句通顺，意义连贯，书写规范。',
  hint:'可以用 They are faithful to their owners… In addition… They should live in harmony with us… 这样的句子把四个要点串起来',
  model:"Recently, there are more and more abandoned dogs. Dogs are our good friends. They are faithful to their owners. They accompany us and bring us a lot of love and happiness. In addition, we can become responsible by taking care of dogs. They should live in harmony with us and we must love them. If we decide to keep a dog as a pet, it's necessary for us to take good care of it and never get rid of it, for we are friends forever."}
]},

 psg:{meta:'考向 2 跨学科综合：实现了英语与其他学科的结合，考查学生对不同学科的知识融会贯通的能力　[2024 山东德州中考·改编]　语篇导读：本文主要介绍了十七年蝉的生命周期',
  title:'The 17-year cicada',
  text:"You already know why cicadas（蝉）are so unbelievably noisy: males produce the sound to attract females. But do you know some of them appear above ground only every 17 years?\n\nThere are more than 3,000 kinds of cicadas, which fall into two types: annual cicadas, which emerge（出现）every year, and periodical（周期）cicadas, which spend most of their lives underground and only emerge once every few years. The 17-year cicada is one of the periodical cicadas with the longest known insect life cycle. Every 17 years, like clockwork, they appear. Shortly after hatching（孵化）from its egg, a 17-year-old cicada nymph（若虫）digs down into the ground, where it spends—as its name suggests—the first 17 years of its life. When it comes out from the ground, it lives only four to six more weeks—just long enough to lay eggs, and the cycle starts all over again.\n\nPeriodical cicadas don't spend their years sleeping underground. Instead, they are active in their wingless nymph forms, digging tunnels（隧道）.\n\nThough not proven, many scientists believe that the periodical cicada has a molecular clock（分子钟）inside its body that notes the passing of years through environmental signs. As trees go through their seasonal cycles, the sap（汁）of their roots（根）changes. And when cicada nymphs feed on this sap, they are likely to pick up signs of the passing of time. The 17th trees' seasonal cycle gives the nymphs their final sign: it's time to emerge.\n\nWhen the cicada nymphs come out from their underground homes depends on temperature. After their 17 years are up, the cicadas wait for the perfect temperature before making the journey to the surface—when the soil about 8 inches（20 cm）underground reaches 64°F, or 18°C. This means that cicadas will appear at different times in different parts of the world: the soil in one place may reach the ideal temperature before the soil in another. But once that temperature is reached, all the cicadas in the area will feel it and make the journey to the surface together.\n\nWhen they emerge, the cicadas aren't yet in their adult form. They're still nymphs, and they remain so until they molt（蜕皮）for the final time. Once their fresh exoskeletons（外骨骼）have hardened, they take to the trees with their new-found wings, and the males begin their loud mating calls in order to attract females. Then females lay eggs in dry branches. After that, both males and females die.\n\nAnd now we're back where we started. Newborn cicada nymphs fall or move down from the trees and go into the ground, not to be seen for another 17 years."},
 qs:[
 {n:1,t:'Which one is TRUE about periodical cicadas?',
  o:['All of them make loud noises.','They emerge every year.','They hatch underground.','They have different life-cycle lengths.'],r:3,
  ex:'细节理解题。根据第二段的"The 17-year cicada is one of the periodical cicadas with the longest known insect life cycle."可知，周期蝉有不同的生命周期长度。'},
 {n:2,t:'What may the 17-year cicadas do underground during the first 17 years of their lives?',
  o:['Lay eggs.','Sleep all the time.','Hatch from eggs.','Dig tunnels.'],r:3,
  ex:"细节理解题。根据第三段\"Periodical cicadas don't spend their years sleeping underground. Instead, they are active in their wingless nymph forms, digging tunnels.\"可知，它们在生命的前 17 年里会在地下挖隧道。"},
 {n:3,t:'How do cicadas know when 17 years have passed according to scientists?',
  o:['By feeling the environmental changes.','By climbing up trees.','By testing the temperature.','By getting information from adult cicadas.'],r:0,
  ex:'细节理解题。根据第四段的"Though not proven, many scientists believe that the periodical cicada has a molecular clock inside its body that notes the passing of years through environmental signs."可知，根据科学家的说法，这种蝉通过环境的变化来感知时间。'},
 {n:4,t:"What decides a cicada's emergence time?",
  o:['The temperature.','The soil.','The area where it stays.','Its exoskeleton.'],r:0,
  ex:'细节理解题。根据第五段的"When the cicada nymphs come out from their underground homes depends on temperature."可知，温度决定了这种蝉的出现时间。'},
 {n:5,t:"What's the main idea of the passage?",
  o:['Reasons why cicadas are unbelievably noisy.','Types of periodical cicadas.','The life cycle of the 17-year cicada.','Living habits of the 17-year cicada.'],r:2,
  ex:'主旨大意题。通读全文并结合"And now we\'re back where we started."可知，这篇文章主要介绍了十七年蝉的生命周期。'}
]},

{id:'zk-3',ord:1003,u:10,sec:'考向 3　创新性试题',tag:'能力',em:'✨',mins:7,type:'read',
 psg:{meta:'考向 3 创新性试题：不仅文章素材形式新颖，而且设题具有创新性，考查了学生对信息的归纳和总结能力　[2024 吉林中考]　语篇导读：本文主要介绍了如何让自己变得更好',
  title:'How to make yourself better',
  text:'It might be difficult to make yourself better. If you try the following ways, they may help you.\n\n__1__ You can\'t decide what you look like, but you can decide what you want to be. So accept yourself, and then anything will be possible.\n\n__2__ Learning is a lifelong journey. No matter how old you are, there will always be lessons in front of you. As the saying goes, "It\'s never too old to learn."\n\n__3__ Good learners keep practicing what they have learned. Try new things and practice them over and over again to make yourself better and better.\n\n__4__ Life is like a mirror. If you smile at it, it will smile back at you. There is a lot of trouble in your life. Keep smiling when you are in trouble.\n\n__5__ Maybe you don\'t dare to take part in school activities. That\'s because you don\'t believe in yourself. But actually you are great. Just have a try.\n\n【备选小标题】\nA. Believe in yourself.\nB. Smile at your life.\nC. Make new friends.\nD. Never stop learning.\nE. Try to accept yourself.\nF. Practice makes perfect.'},

  o:['A. Believe in yourself.','B. Smile at your life.','C. Make new friends.','D. Never stop learning.','E. Try to accept yourself.','F. Practice makes perfect.'],r:4,
  ex:'根据"So accept yourself, and then anything will be possible."可知，本段与试着接受自己有关。故选 E 项。'},

  o:['A. Believe in yourself.','B. Smile at your life.','C. Make new friends.','D. Never stop learning.','E. Try to accept yourself.','F. Practice makes perfect.'],r:3,
  ex:'根据"Learning is a lifelong journey."可知，本段与终身学习有关。选项 D（永远不要停止学习。）符合本段主题。'},
 {n:3,t:'第 (3) 段该配哪个小标题？',
  o:['A. Believe in yourself.','B. Smile at your life.','C. Make new friends.','D. Never stop learning.','E. Try to accept yourself.','F. Practice makes perfect.'],r:5,
  ex:'根据"Good learners keep practicing what they have learned."可知，本段与不断练习有关。选项 F（熟能生巧。）符合本段主题。'},
 {n:4,t:'第 (4) 段该配哪个小标题？',
  o:['A. Believe in yourself.','B. Smile at your life.','C. Make new friends.','D. Never stop learning.','E. Try to accept yourself.','F. Practice makes perfect.'],r:1,
  ex:'根据"Keep smiling when you are in trouble."可知，本段与要微笑面对生活有关。选项 B（微笑面对你的生活。）符合本段主题。'},
 {n:5,t:'第 (5) 段该配哪个小标题？',
  o:['A. Believe in yourself.','B. Smile at your life.','C. Make new friends.','D. Never stop learning.','E. Try to accept yourself.','F. Practice makes perfect.'],r:0,
  ex:"根据\"That's because you don't believe in yourself. But actually you are great. Just have a try.\"可知，本段与对自己自信有关。选项 A（相信你自己。）符合本段主题。"}
