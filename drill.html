 {n:2,t:'第 (2) 空',o:['long','longer','longest','the longest'],r:1,
  ex:'句意为：它们的前腿比后腿长。根据空后的 than 可知，此处应用比较级。'},

 {n:4,t:'第 (4) 空',o:['a','an','the','/'],r:1,
  ex:'此处表泛指，hour 是可数名词单数，且发音以元音音素开头，故选 B 项。'},
 {n:5,t:'第 (5) 空',o:['on','at','in','to'],r:2,
  ex:'根据空后的 Africa 可知应用 in。'},
 {n:6,t:'第 (6) 空',o:['can','should','must','need'],r:0,
  ex:'can 意为"能"；should 意为"应该"；must 意为"必须"；need 意为"需要"。根据语境可知，此处表示它们能活到 25 岁。'},
 {n:7,t:'第 (7) 空',o:['eating','to eating','eat','to eat'],r:0,
  ex:'spend time doing sth 为固定搭配，意为"花时间做某事"。'},

  ex:'根据语境可知，此处应用 other 修饰复数名词 plants，意为"其他的植物"。'},
 {n:9,t:'第 (9) 空',o:['until','but','or','so'],r:3,
  ex:'until 意为"直到……为止"；but 意为"但是"；or 意为"或者；否则"；so 意为"因此"。根据语境可知，设空前后内容之间是因果关系，且空后为结果，故用 so。'},
 {n:10,t:'第 (10) 空',o:['it','its','itself',"it's"],r:1,
  ex:'birthplace 作名词，意为"出生地"，前面缺少定语，所以使用形容词性物主代词 its。'},
 {n:11,t:'第 (11) 空',o:['to stand','stand','to standing','stood'],r:0,
  ex:'learn to do sth 意为"学会做某事"，故用 to stand。'},
 {n:12,t:'第 (12) 空',o:['little','some','few','many'],r:1,
  ex:'little 意为"不多的"，与不可数名词连用；some 意为"一些"，既可以与可数名词连用，也可以与不可数名词连用；few 意为"没有几个"，与可数名词连用；many 意为"很多"，与可数名词连用。milk 是不可数名词，所以可以用 little 和 some 修饰；结合语境，故用 some。'},
 {n:13,t:'第 (13) 空',o:['What a','What an','How','How an'],r:2,
  ex:'本句是感叹句，并且中心词是形容词，故用 How。知识拓展：若是 what 引导的感叹句，结构应为"What an amazing thing!"。'},
 {n:14,t:'第 (14) 空',o:['stays','stay','stayed','is staying'],r:0,
  ex:'本句陈述的是一个事实或经常发生的事情，故用一般现在时；主语是第三人称单数，故谓语动词用第三人称单数形式。'},
 {n:15,t:'第 (15) 空',o:['leave','left','leaving','will leave'],r:3,
  ex:'句意为：当它足够强壮时，它将离开自己的妈妈，开始新生活。根据语境可知，设空所在句的时态遵从"主将从现"原则，故用 will leave。'}
]},

{id:'u1-b-biaoda',ord:115,u:1,sec:'B 阅读综合素养 · 阅读与表达',tag:'能力',em:'🌸',mins:7,type:'read',
 psg:{meta:'素养：文化意识　体裁：说明文　词数：274　难度：★★★　[2025 辽宁阜新期末]　语篇导读：本文主要介绍了桂花的一些信息',
  title:'The osmanthus（桂花）',
  text:'The osmanthus（桂花）is one of the most beloved autumn flowers. It is widely planted in China, with a very long planting history of more than 2,500 years. This famous plant even appeared in The Classic of Mountains and Seas（《山海经》）. Hangzhou, Suzhou and Guilin see the flower as their city flower.\n\nThe name "osmanthus" comes from the Greek word osma, meaning "sweet", and anthos, meaning "flower". Since the ancient times, the osmanthus has been a symbol of good things, like peace, love and happiness.\n\nLegend（传说）has it that there is an osmanthus tree on the moon. A man named Wu Gang is ordered to cut it down. However, the tree can grow again. So Wu has to keep on cutting it again and again.\n\nThe osmanthus blooms between September and October, when the Mid-Autumn Festival is celebrated. So the osmanthus has become the best flower for people to enjoy with a full moon. It has been loved by many poets, including Li Qingzhao and Yang Wanli from the Song dynasty. Yang wrote that the sweetness of the osmanthus is so clean and rich that it\'s hard to believe it comes from nature, not the moon in heaven. Chinese people\'s love for the osmanthus has become a part of their food culture. Osmanthus wine and tea are popular traditional Chinese drinks. For those who have a sweet tooth, there are many different kinds of food made with osmanthus. The osmanthus can also be collected to make honey and jam.'},

  ex:'根据"The osmanthus… with a very long planting history of more than 2,500 years."可知，中国人种植桂花有超过 2,500 年历史了。'},
 {n:22,essay:true,t:'Why is the osmanthus considered the best flower to enjoy with a full moon?',

  a:['osmanthus wine and tea','wine and tea'],
  ex:'根据"Osmanthus wine and tea are popular traditional Chinese drinks."可知，桂花可以被制成桂花酒和花茶。'},
 {n:24,essay:true,t:'What flower do you like best? Why? Write 30 words or more.',

  text:'Ants have the ability to smell out cancerous cells（癌细胞）in humans, which has been found by a study, suggesting that they could be used to find the cancer in the future. Scientists from The French National Center for Scientific Research（CNRS）found that some ants have a good sense of smell. "But more tests must be carried out before they could be used in hospitals," the team said.\n\nThe scientists did tests with 36 ants, smelling cells in the lab. First, they let the ants smell some cancerous human cells. Every time the ants smelt cancerous cells, they were rewarded with sugar solution（糖溶液）. In the second step, the ants were put into two different smells. One was a new smell of healthy cells and the other was still the smell of the cancerous cells. Once the ants found the cancerous cells successfully, the researchers made them smell different cancerous cells. As such, the scientists found that ants could tell between cancerous and healthy cells and between two cancerous cells.\n\nThis isn\'t the first time that scientists have used the animals\' sense of smell to find cancerous cells. "Dogs are good at finding something with their noses. However, training dogs to do so needs several months or a year. On the other hand, ants can be easily raised in a short time. They are inexpensive, and hundreds of them can be trained with fewer times," scientists pointed out.\n\n"This study shows that ants are able to learn very quickly. The way can be used for other tasks including finding danger or other illnesses," scientists added.'},

/* ================= 存档 ================= */
const LS=JSON.parse(localStorage.getItem('drill8A')||'{}');
LS.done=LS.done||{};      /* {题组id:{n,ok,d}} 最近一次成绩 */
LS.wrong=LS.wrong||{};    /* {题组id#题号:1} 错题本 */
LS.u=LS.u||1;
LS.tot=LS.tot||0;         /* 累计做过的题数 */
function save(){localStorage.setItem('drill8A',JSON.stringify(LS));}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const LT='ABCDEF';   /* 选项序号，阅读还原有 5 个选项 */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* 原文里允许保留 <u> 下划线标记 */
function escKeepU(s){return esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>')
  .replace(/__(\d+)__/g,'<b class="bk">($1)</b>');}   /* 完形/还原的空位标成醒目的 (1)(2) */
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.。．,，!！?？;；:：]+$/,'')
  .replace(/[;；,，、\/]/g,' ').replace(/\s+/g,' ').trim();}   /* 两空题 some;any 写成 some any 也算对 */

/* 做错 → 把这个词打回背单词的复习计划（写 english.html 用的 vocabMS2，规则与它一致） */
const EB_STEP=[1,2,4,7,15,30];
function ebPlus(ds,n){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function recallWord(w){
  if(!w)return null;
  var key=WORDKEY[String(w).toLowerCase()];
  if(!key)return null;
  try{
    var V=JSON.parse(localStorage.getItem('vocabMS2')||'{}');
    V.marked=V.marked||{}; V.learn=V.learn||{};
    V.marked[key]=1;                                    /* 进错词本 */
    V.learn[key]={s:0,nx:ebPlus(today(),1),d:today()};   /* 打回第 0 轮，明天重新复习 */
    localStorage.setItem('vocabMS2',JSON.stringify(V));
    return key.split('|')[1]+'　'+key.split('|')[2];
  }catch(e){return null;}
}
function wordMean(w){
  var key=WORDKEY[String(w||'').toLowerCase()];
  return key?(key.split('|')[1]+'　'+key.split('|')[2]):null;
}

/* ================= 首页 ================= */
function allQs(s){return s.qs.length;}
document.getElementById('totalBadge').textContent='共 '+SETS.reduce(function(n,s){return n+allQs(s);},0)+' 题';
function renderStats(){
  var box=document.getElementById('dstats');
  var doneIds=Object.keys(LS.done);
  if(!doneIds.length){box.innerHTML='<div class="label">✍️ 我的刷题</div><div class="vempty">还没做过～做完第一组就会出现 🏁</div>';return;}
  var n=0,ok=0;doneIds.forEach(function(k){n+=LS.done[k].n;ok+=LS.done[k].ok;});
  var wrongN=Object.keys(LS.wrong).length;
  box.innerHTML='<div class="label">✍️ 我的刷题</div><div class="mini">'+
    '<div><b>'+doneIds.length+'</b><span>做完组数</span></div>'+
    '<div><b>'+LS.tot+'</b><span>累计题数</span></div>'+
    '<div><b style="color:var(--ok)">'+(n?Math.round(ok/n*100):0)+'%</b><span>最近正确率</span></div>'+
    '<div><b style="color:var(--bad)">'+wrongN+'</b><span>错题本</span></div></div>';
}
function renderUnits(){
  var box=document.getElementById('units');box.innerHTML='';
  UNITS.forEach(function(u){
    var has=SETS.some(function(s){return s.u===u.u;});
    var el=document.createElement('div');
    el.className='chip'+(LS.u===u.u?' on':'')+(has?'':' lock');
    el.textContent='U'+u.u+' '+u.zh+(has?'':' · 待录入');
    el.onclick=function(){ if(!has){alert('Unit '+u.u+'「'+u.t+'」的题目还在录入中～\n先做已经有的单元吧');return;}
      LS.u=u.u;save();renderUnits();renderList();};
    box.appendChild(el);
  });
}
const TAGCLS={'基础':'tg-jc','能力':'tg-nl','语法':'tg-yf','写作':'tg-xz'};
function renderList(){
  var box=document.getElementById('list');box.innerHTML='';
  var list=SETS.filter(function(s){return s.u===LS.u;})
    .sort(function(a,b){return (a.ord||0)-(b.ord||0);});   /* 按书上的先后顺序排 */
  if(!list.length){box.innerHTML='<div class="card vempty">这个单元还没录入题目</div>';return;}
  list.forEach(function(s){
    var d=LS.done[s.id],el=document.createElement('div');
    el.className='set'+(d?' done':'');
    var rate=d?Math.round(d.ok/d.n*100):null;
    el.innerHTML='<div class="em">'+s.em+'</div><div class="tx">'+
      '<b>'+esc(s.sec)+'</b><span>'+(s.type==='read'?'阅读理解 · '+allQs(s)+' 题':'共 '+allQs(s)+' 题')+
      ' · 建议 '+s.mins+' 分钟</span>'+
      '<small><span class="tg '+(TAGCLS[s.tag]||'tg-jc')+'">刷'+s.tag+'</span>'+
      (d?'上次 '+d.ok+'/'+d.n+'　'+d.d:'还没做过')+'</small></div><div class="go">›</div>'+
      (rate!==null?'<span class="rate" style="color:'+(rate>=80?'var(--ok)':rate>=60?'var(--warn)':'var(--bad)')+'">'+rate+'%</span>':'');
    el.onclick=function(){startSet(s.id);};
    box.appendChild(el);
  });
}
function wrongList(){
  var out=[];
  SETS.forEach(function(s){s.qs.forEach(function(q){ if(LS.wrong[s.id+'#'+q.n])out.push({s:s,q:q}); });});
  return out;
}
function renderWrong(){

    box.innerHTML+='<div class="vempty">还没有错题～做错的题会自动收进来，可以只刷错题</div>';return;
  }
  var w=document.createElement('div');w.className='wlist';
  list.slice(0,8).forEach(function(x){
    var it=document.createElement('div');it.className='witem';
    it.innerHTML='<b>'+esc(x.s.sec)+' 第 '+x.q.n+' 题</b>　<span>'+
      esc(x.q.a?x.q.a[0]:(x.q.o?LT[x.q.r]:''))+'</span>';
    w.appendChild(it);
  });
  box.appendChild(w);
  if(list.length>8){var m=document.createElement('div');m.className='vempty';m.style.padding='8px 0 0';
    m.textContent='…… 还有 '+(list.length-8)+' 题';box.appendChild(m);}
  var b=document.createElement('button');b.className='btn ghost sm';b.style.marginTop='10px';
  b.textContent='🔖 只刷错题（'+list.length+'）';
  b.onclick=function(){startWrong();};
  box.appendChild(b);
}

/* ================= 做题 ================= */
var cur=null,qi=0,right=0,answered=false,picked=-1,wrongThis=[],recalled=[];
function startSet(id){
  var s=SETS.filter(function(x){return x.id===id;})[0];
  cur={id:s.id,sec:s.sec,type:s.type,psg:s.psg,qs:s.qs.slice(),onlyWrong:false,set:s};
  beginRun();
}
function startWrong(){
  var list=wrongList();
  if(!list.length)return;
  cur={id:'__wrong__',sec:'错题重刷',type:'mix',qs:list.map(function(x){
    var q=JSON.parse(JSON.stringify(x.q));q.__set=x.s.id;q.__psg=x.s.psg;q.__sec=x.s.sec;return q;}),onlyWrong:true};
  beginRun();
}
function beginRun(){
  qi=0;right=0;wrongThis=[];recalled=[];
  document.getElementById('home').style.display='none';
  document.getElementById('done').style.display='none';
  document.getElementById('do').style.display='block';
  if(cur.psg){showPassage();}else{renderQ();}
  window.scrollTo(0,0);
}
function showPassage(){
  var box=document.getElementById('do');
  box.innerHTML='<div class="topbar"><span class="back" onclick="goHome()">‹</span>'+
    '<div style="flex:1;text-align:center;font-size:15px;font-weight:800">'+esc(cur.sec)+'</div>'+
    '<span class="badge">'+cur.qs.length+' 题</span></div>'+
    '<div class="psg"><div class="pm">'+esc(cur.psg.meta)+'</div>'+
    '<div class="pt">'+esc(cur.psg.title||'')+'</div>'+
    '<div class="pb">'+escKeepU(cur.psg.text)+'</div></div>'+
    '<button class="btn" onclick="renderQ()">读完了，开始答题 →</button>'+
    '<button class="btn ghost" onclick="goHome()">返回</button>';
  window.scrollTo(0,0);
}
function renderQ(){
  answered=false;picked=-1;
  var box=document.getElementById('do');
  if(qi>=cur.qs.length){finish();return;}
  var q=cur.qs[qi],psg=cur.psg||q.__psg;
  var html='<div class="topbar"><span class="back" onclick="goHome()">‹</span>'+
    '<div class="progress"><i style="width:'+(qi/cur.qs.length*100)+'%"></i></div>'+
    '<span class="count">'+(qi+1)+'/'+cur.qs.length+'</span></div>';
  if(psg){
    html+='<div class="psg" id="psgbox"><div class="psgfold" id="psgin">'+
      '<div class="pt">'+esc(psg.title||'')+'</div><div class="pb">'+escKeepU(psg.text)+'</div></div>'+
      '<div class="psgmore" onclick="togglePsg()" id="psgmore">▾ 展开原文</div></div>';
  }
  html+='<div class="qcard">';
  if(q.src)html+='<span class="qsrc">['+esc(q.src)+']</span>';
  if(q.tag)html+='<span class="qtag">'+esc(q.tag)+'</span>';
  if(q.__sec)html+='<span class="qsrc" style="background:#eeedfa;color:#5b53d9">'+esc(q.__sec)+'</span>';
  if(q.zh)html+='<div class="qzh">'+esc(q.zh)+'</div>';
  html+='<div class="qt">'+qtHtml(q.t)+'</div>';
  if(q.o){
    html+='<div id="opts">';
    q.o.forEach(function(o,i){html+='<div class="opt" data-i="'+i+'" onclick="pick('+i+')"><i>'+LT[i]+'.</i><div>'+esc(o)+'</div></div>';});
    html+='</div>';
  }else{
    html+='<div class="qhint">'+esc(q.hint||'')+'</div>';
    if(q.essay)html+='<textarea class="essay" id="essay" placeholder="在这里写…写完点下面的按钮看参考答案"></textarea>';
    else html+='<input class="ans" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="在这里填答案…">';
  }
  html+='<div class="res" id="res"></div></div>'+
    '<button class="btn" id="okbtn" onclick="submit()">'+(q.essay?'写好了，看参考答案 →':'确定 ✓')+'</button>';
  box.innerHTML=html;
  var inp=document.getElementById('ans');
  if(inp){inp.focus();inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();submit();}});}
  window.scrollTo(0,0);
}
function qtHtml(t){
  return esc(t).replace(/___+/g,'<u></u>').replace(/\n/g,'<br>');
}
function togglePsg(){
  var el=document.getElementById('psgin'),m=document.getElementById('psgmore');
  if(el.classList.contains('psgfold')){el.classList.remove('psgfold');m.textContent='▴ 收起原文';}
  else{el.classList.add('psgfold');m.textContent='▾ 展开原文';}
}
function pick(i){
  if(answered)return;
  picked=i;
  document.querySelectorAll('#opts .opt').forEach(function(e,j){e.classList.toggle('pick',j===i);});
}
function submit(){
  var q=cur.qs[qi],res=document.getElementById('res'),btn=document.getElementById('okbtn');
  if(answered){qi++;renderQ();return;}
  var ok,mine;
  if(q.essay){                    /* 写作题：不判对错，给参考答案让孩子自己比 */
    answered=true;right++;LS.tot++;save();
    res.className='res ok show';
    res.innerHTML='<div class="rt">📝 参考答案</div><div class="model">'+esc(q.model)+'</div>'+
      '<div class="selfcheck">自己比一比：①意思都写全了吗？②时态对不对？③单词拼写和大小写有没有错？<br>'+
      '差得多的话，照着参考答案再写一遍，比只看一眼管用。</div>';
    btn.textContent=(qi+1>=cur.qs.length)?'看成绩 →':'下一题 →';
    res.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  if(q.o){
    if(picked<0){res.className='res no show';res.innerHTML='<div class="rt">先选一个答案哦</div>';return;}
    ok=picked===q.r; mine=LT[picked];
    document.querySelectorAll('#opts .opt').forEach(function(e,j){
      e.classList.remove('pick');
      if(j===q.r)e.classList.add('right');
      else if(j===picked)e.classList.add('wrong');
    });
  }else{
    var inp=document.getElementById('ans');
    mine=inp.value.trim();
    if(!mine){res.className='res no show';res.innerHTML='<div class="rt">先把答案填上再确定～</div>';return;}
    ok=q.a.some(function(a){return norm(a)===norm(mine);});
    inp.classList.add(ok?'right':'wrong');
    inp.blur();
  }
  answered=true;
  var qid=(q.__set||cur.id)+'#'+q.n;
  if(ok){right++;delete LS.wrong[qid];}
  else{LS.wrong[qid]=1;wrongThis.push(q);}
  LS.tot++;save();
  var html='';
  if(ok)html+='<div class="rt">✅ 答对了</div>';
  else{
    html+='<div class="rt">❌ 答错了</div>';
    html+='<div>正确答案：<span class="rk">'+esc(q.o?(LT[q.r]+'. '+q.o[q.r]):q.a.join(' / '))+'</span></div>';
  }
  if(q.ex)html+='<div class="ex">'+esc(q.ex)+'</div>';
  var wm=wordMean(q.w);
  if(wm)html+='<div class="wd">📖 '+esc(wm)+'</div>';
  if(!ok&&q.w){
    var r=recallWord(q.w);
    if(r){recalled.push(r);html+='<div class="recall">🧠 已把「'+esc(r.split('　')[0])+'」放回背单词的复习计划，明天再背一次</div>';}
  }
  res.className='res '+(ok?'ok':'no')+' show';
  res.innerHTML=html;
  btn.textContent=(qi+1>=cur.qs.length)?'看成绩 →':'下一题 →';
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function finish(){
  var n=cur.qs.length,rate=n?Math.round(right/n*100):0;
  if(!cur.onlyWrong){LS.done[cur.id]={n:n,ok:right,d:today()};save();}
  var essayMode=cur.qs.every(function(q){return q.essay;});
  var em,head;
  if(essayMode){em='📝';head='写作练习完成';}
  else if(rate===100){em='🎉';head='全对！漂亮';}
  else if(rate>=80){em='💪';head='做得不错';}
  else if(rate>=60){em='📖';head='及格了，错的再看看';}
  else{em='📖';head='这组有点难，把解析读一遍';}
  var recs=[];
  if(recalled.length)recs.push('🧠 '+recalled.length+' 个做错的单词已放回背单词的复习计划：'+
    recalled.map(function(r){return r.split('　')[0];}).join('、'));
  var wn=Object.keys(LS.wrong).length;
  if(wn)recs.push('🔖 错题本里现在有 '+wn+' 题，回首页可以只刷错题');
  if(rate===100&&cur.onlyWrong)recs.push('✨ 错题全部清空，厉害！');
  var html='<div class="card done"><div class="em">'+em+'</div><h2>'+head+'</h2>'+
    (essayMode
      ? '<p>一共写了 <b>'+n+'</b> 段　对照参考答案改一改，进步最快</p>'
      : '<div class="stat"><div><b style="color:var(--ok)">'+right+'</b><span>答对</span></div>'+
        '<div><b style="color:var(--bad)">'+(n-right)+'</b><span>答错</span></div>'+
        '<div><b>'+rate+'%</b><span>正确率</span></div></div>');
  if(wrongThis.length){
    html+='<div class="wlist">';
    wrongThis.forEach(function(q){
      html+='<div class="witem"><b>第 '+q.n+' 题</b>　正确答案：<span>'+
        esc(q.o?(LT[q.r]+'. '+q.o[q.r]):q.a.join(' / '))+'</span></div>';
    });
    html+='</div>';
  }
  if(recs.length)html+='<div class="rec">'+recs.join('<br>')+'</div>';
  html+='<div style="margin-top:16px;display:grid;gap:10px">'+
    (wrongThis.length?'<button class="btn" onclick="redoWrong()">🔖 立刻重做这组错题（'+wrongThis.length+'）</button>':'')+
    '<button class="btn ghost" onclick="goHome()">返回题目列表</button></div></div>';
  document.getElementById('do').style.display='none';
  document.getElementById('done').style.display='block';
  document.getElementById('done').innerHTML=html;
  window.scrollTo(0,0);
}
function redoWrong(){
  var qs=wrongThis.slice();
  cur={id:cur.id,sec:cur.sec+' · 错题重做',type:cur.type,psg:cur.psg,qs:qs,onlyWrong:true};
  beginRun();
}
function goHome(){
  document.getElementById('do').style.display='none';
  document.getElementById('done').style.display='none';
  document.getElementById('home').style.display='block';
  renderStats();renderUnits();renderList();renderWrong();
  window.scrollTo(0,0);
}

renderStats();renderUnits();renderList();renderWrong();
</script>
