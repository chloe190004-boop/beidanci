<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="背单词">
<meta name="theme-color" content="#3b6ef0">
<title>初中英语背单词 · 新沪教</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1c2434; --sub:#6b7688;
  --brand:#3b6ef0; --brand2:#5b8def; --ok:#18a06a; --warn:#e8813a; --bad:#e14b5a;
  --gold:#d9a441; --line:#e7ebf2; --shadow:0 8px 30px rgba(30,50,90,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 30px}
.wrap{max-width:600px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 14px}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}
.badge{font-size:12px;color:var(--sub);background:#eef2fb;padding:4px 10px;border-radius:20px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.label{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.15s;user-select:none}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(59,110,240,.3)}
.chip.small{padding:8px 12px;font-size:12.5px}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grade{padding:14px 8px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:center;cursor:pointer;transition:.15s}
.grade.on{border-color:var(--brand);background:#f2f6ff}
.grade .t{font-size:15px;font-weight:800}
.grade .d{font-size:11px;color:var(--sub);margin-top:2px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:15px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:center;cursor:pointer;transition:.15s}
.mode.on{border-color:var(--brand);background:#f2f6ff}
.mode .big{font-size:23px}
.mode .t{font-size:13.5px;font-weight:800;margin-top:4px}
.mode .d{font-size:11px;color:var(--sub);margin-top:2px}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;background:var(--brand);
  color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(59,110,240,.35)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#eef2fb;color:var(--brand);box-shadow:none}
#study{display:none}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{font-size:24px;cursor:pointer;color:var(--sub);padding:4px 10px}
.progress{flex:1;height:9px;background:#e7ebf2;border-radius:6px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:.3s}
.count{font-size:13px;color:var(--sub);font-weight:700;min-width:56px;text-align:right}
.flash{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:32px 22px;min-height:280px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative}
.unittag{position:absolute;top:14px;left:16px;font-size:11.5px;color:var(--sub);background:#eef2fb;padding:3px 9px;border-radius:10px;font-weight:700}
.pos{position:absolute;top:14px;right:16px;font-size:12.5px;color:var(--warn);font-weight:800}
.star{position:absolute;top:40px;right:16px;font-size:12px;color:var(--gold);font-weight:800}
.word{font-size:40px;font-weight:800;line-height:1.15;word-break:break-word}
.zh{font-size:26px;font-weight:800;line-height:1.4}
.hint{font-size:13px;color:var(--sub);margin-top:18px}
.answer{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);width:100%;display:none}
.answer.show{display:block}
.answer .a{font-size:23px;font-weight:800;color:var(--brand)}
.ex{margin-top:14px;background:#f7f9fd;border-radius:12px;padding:12px 14px;text-align:left}
.ex .en{font-size:15.5px;line-height:1.5;color:var(--ink)}
.ex .en b{color:var(--brand)}
.ex .zh2{font-size:13.5px;color:var(--sub);margin-top:5px;line-height:1.5}
.speak{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--brand);
  background:#eef2fb;padding:9px 18px;border-radius:20px;border:none;cursor:pointer;font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.act{padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:800;cursor:pointer}
.act.no{background:#fdeceb;color:var(--bad)}
.act.yes{background:#e6f6ee;color:var(--ok)}
.act.wide{grid-column:1/3}
.spellin{width:100%;font-size:27px;font-weight:800;text-align:center;padding:15px;border:2px solid var(--line);
  border-radius:14px;outline:none;letter-spacing:1px;margin-top:16px}
.spellin:focus{border-color:var(--brand)}
.spellin.right{border-color:var(--ok);background:#e6f6ee;color:var(--ok)}
.spellin.wrong{border-color:var(--bad);background:#fdeceb;color:var(--bad)}
.done{text-align:center;padding:30px 12px}
.done .em{font-size:56px}
.done h2{font-size:24px;margin:12px 0 6px}
.done p{color:var(--sub);font-size:15px;margin:4px 0}
.stat{display:flex;justify-content:center;gap:24px;margin:18px 0}
.stat b{font-size:26px;display:block}
.stat span{font-size:12px;color:var(--sub)}
.hublink{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;text-decoration:none;padding:5px 11px;border-radius:20px;flex-shrink:0}
.hublink{color:var(--brand);background:#eef2fb}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:8px}
.wblist{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.wbitem{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.wbitem:last-child{border-bottom:none}
.wbitem b{font-weight:800;min-width:104px;word-break:break-word}
.wbitem span{flex:1;color:var(--sub);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbitem i,.wbitem em{font-style:normal;cursor:pointer;padding:5px 7px;border-radius:8px;font-size:14px;flex-shrink:0}
.wbitem i:active,.wbitem em:active{background:#eef2fb}
.wbitem em{color:var(--bad);font-weight:800}
.wbempty{font-size:13px;color:var(--sub);text-align:center;padding:12px 0;line-height:1.6}
/* iPad / 大屏 */
@media (min-width:768px){
  .wrap{max-width:680px;padding:24px}
  h1{font-size:24px}
  .word{font-size:52px}
  .zh{font-size:32px}
  .flash{min-height:340px;padding:40px 28px}
  .ex .en{font-size:18px}
  .ex .zh2{font-size:15px}
  .btn{font-size:18px;padding:18px}
  .act{font-size:17px;padding:18px}
  .spellin{font-size:32px}
  .mode .big{font-size:26px}
}
.mini{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
.mini>div{flex:1;min-width:80px;background:#f6f8fd;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.mini b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.mini span{font-size:11px;color:var(--sub)}
.spark{display:flex;align-items:flex-end;gap:5px;height:70px;margin-top:20px}
.spark>div{flex:1;background:linear-gradient(180deg,var(--brand2),var(--brand));border-radius:5px 5px 0 0;min-height:4px;position:relative}
.spark>div>i{position:absolute;top:-16px;left:-4px;right:-4px;text-align:center;font-size:10px;color:var(--sub);font-weight:800;font-style:normal}
.sparkcap{font-size:11px;color:var(--sub);text-align:center;margin-top:6px}
.vempty{font-size:13px;color:var(--sub);text-align:center;padding:10px 0;line-height:1.6}
.rec{margin-top:14px;background:#fff8ec;border:1px solid #f0dfc0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.9;text-align:left;color:#7a5a1e}
.exops{display:flex;gap:8px;justify-content:center;margin-top:9px}
.exbtn{border:1.5px solid #dde6ef;background:#fff;border-radius:14px;padding:6px 12px;font-size:12.5px;font-weight:800;color:#3b6ef0;cursor:pointer}
.exbtn:active{transform:scale(.96)}
.brk{margin-top:8px;text-align:left;background:#f6f9fc;border:1px solid #e3eaf2;border-radius:10px;padding:8px 10px;line-height:2.1}
.bw{display:inline-block;background:#fff;border:1px solid #e3eaf2;border-radius:8px;padding:2px 8px;margin:2px 3px;font-size:13px;font-weight:700}
.bw i{color:#7b8894;font-style:normal;font-weight:600;font-size:12px}
.bw.dim{opacity:.5}
.grade .gp{height:5px;background:#e8eef4;border-radius:3px;margin-top:6px;overflow:hidden}
.grade .gp i{display:block;height:100%;background:linear-gradient(90deg,#5b8def,#3b6ef0);width:0;transition:.3s}
.ipa{font-size:15px;color:#7b8894;font-weight:700;margin-top:6px;letter-spacing:.3px}
.a .ipa,.answer .ipa{margin-top:4px}
/* 艾宾浩斯复习计划 */
.ebcard{background:linear-gradient(135deg,#2a3f6b,#3b6ef0);color:#fff}
.ebcard .label{color:#c9d8ff}
.ebtop{display:flex;align-items:center;gap:14px}
.ebtop .ebem{font-size:40px;line-height:1;flex-shrink:0}
.ebtop b{display:block;font-size:22px;font-weight:800;line-height:1.3}
.ebtop span{display:block;font-size:12.5px;color:#c9d8ff;font-weight:700;margin-top:3px;line-height:1.5}
.ebmini{display:flex;gap:8px;margin-top:13px}
.ebmini>div{flex:1;background:rgba(255,255,255,.13);border-radius:12px;padding:9px 4px;text-align:center}
.ebmini b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25}
.ebmini span{font-size:10.5px;color:#c9d8ff;font-weight:700}
.ebbtn{display:block;width:100%;margin-top:13px;padding:14px;border:none;border-radius:13px;
  background:#fff;color:#2a3f6b;font-size:16px;font-weight:800;cursor:pointer}
.ebbtn:active{transform:scale(.98)}
.mode.wide{grid-column:1/3}
.mode.wide .big{font-size:20px}
</style>
</head>
<body>
<div class="wrap">

<div id="home">
  <header>
    <a class="hublink" href="./">‹ 切换</a>
    <h1 style="flex:1;text-align:center">🦅 初中背单词</h1>
    <span class="badge" id="totalBadge"></span>
  </header>

  <div class="card ebcard" id="ebcard"></div>

  <div class="card" id="vstats"></div>

  <div class="card">
    <div class="label">选课本（单选）</div>
    <div class="grades" id="grades"></div>
  </div>

  <div class="card">
    <div class="label">选单元（可多选）</div>
    <div class="chips" id="units"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="chip small" onclick="selAll()">全选</button>
      <button class="chip small" onclick="selNone()">清空</button>
    </div>
  </div>

  <div class="card">
    <div class="label">背诵方式</div>
    <div class="modes">
      <div class="mode on" data-mode="en2zh" onclick="pickMode(this)">
        <div class="big">🇬🇧→🇨🇳</div><div class="t">英译汉</div><div class="d">看单词想中文</div></div>
      <div class="mode" data-mode="zh2en" onclick="pickMode(this)">
        <div class="big">🇨🇳→🇬🇧</div><div class="t">汉译英</div><div class="d">看中文想单词</div></div>
      <div class="mode" data-mode="spell" onclick="pickMode(this)">
        <div class="big">⌨️</div><div class="t">拼写测试</div><div class="d">听/看中文拼单词</div></div>
      <div class="mode" data-mode="review" onclick="pickMode(this)">
        <div class="big">🔖</div><div class="t">复习不熟</div><div class="d">只背标记过的</div></div>
      <div class="mode wide" data-mode="due" onclick="pickMode(this)">
        <div class="big">🧠</div><div class="t">今日复习（艾宾浩斯）</div>
        <div class="d" id="dueDesc">按遗忘曲线，把该忘的词捞回来</div></div>
    </div>
  </div>

  <div class="card">
    <div class="label">选项</div>
    <div class="chips">
      <button class="chip on" id="optShuffle" onclick="toggle(this)">🔀 乱序</button>
      <button class="chip on" id="optSpeak" onclick="toggle(this)">🔊 自动发音</button>
      <button class="chip on" id="optEx" onclick="toggle(this)">📖 显示例句</button>
      <button class="chip" id="optSlow" onclick="toggle(this)">🐢 慢速</button>
    </div>
  </div>

  <div class="card" id="wrongbook"></div>

  <button class="btn" onclick="start()">开始背诵 →</button>
  <div class="foot">进度自动保存 · 无需联网 · ★为课本星标词</div>
</div>

<div id="study">
  <div class="topbar">
    <span class="back" onclick="goHome()">‹</span>
    <div class="progress"><i id="bar"></i></div>
    <span class="count" id="count">0/0</span>
  </div>
  <div id="stage"></div>
</div>

</div>

<script>

ealth is more important than wealth.", "sz": "健康比财富更重要。", "st": 0, "ph": "welθ"}, {"g": "八年级上", "u": "Unit 8", "w": "queen", "p": "n", "m": "女王；王后", "se": "The queen lived in a big and beautiful palace.", "sz": "女王住在一座又大又美的宫殿里。", "st": 0, "ph": "kwiːn"}, {"g": "八年级上", "u": "Unit 8", "w": "servant", "p": "n", "m": "仆人；佣人", "se": "The servant brought tea for the guests.", "sz": "仆人给客人们端来了茶。", "st": 0, "ph": "ˈsɜːvənt"}, {"g": "八年级上", "u": "Unit 8", "w": "pride", "p": "n", "m": "自豪；骄傲", "se": "He looked at his son with great pride.", "sz": "他满怀自豪地看着儿子。", "st": 0, "ph": "praɪd"}, {"g": "八年级上", "u": "Unit 8", "w": "among", "p": "prep", "m": "在……中", "se": "She is the tallest girl among us.", "sz": "她是我们中间个子最高的女孩。", "st": 0, "ph": "əˈmʌŋ"}, {"g": "八年级上", "u": "Unit 8", "w": "relationship", "p": "n", "m": "关系", "se": "They have a good relationship with their neighbors.", "sz": "他们和邻居们关系很好。", "st": 0, "ph": "riˈleɪʃənʃɪp"}, {"g": "八年级上", "u": "Unit 8", "w": "grow up", "p": "", "m": "长大；成熟", "se": "I want to be a teacher when I grow up.", "sz": "我长大后想当一名老师。", "st": 0, "ph": "ɡrəʊ ʌp"}, {"g": "八年级上", "u": "Unit 8", "w": "care for", "p": "", "m": "照顾；照料", "se": "She stays at home to care for her sick mother.", "sz": "她待在家里照顾生病的母亲。", "st": 0, "ph": "keə fɔː"}, {"g": "八年级上", "u": "Unit 8", "w": "in short", "p": "", "m": "总之；简言之", "se": "In short, we all had a wonderful time.", "sz": "总之，我们都玩得很开心。", "st": 0, "ph": "ɪn ʃɔːt"}, {"g": "八年级上", "u": "Unit 8", "w": "have no choice but to do", "p": "", "m": "别无选择；只能……", "se": "We had no choice but to walk home in the rain.", "sz": "我们别无选择，只能冒雨走回家。", "st": 0, "ph": "hæv nəʊ tʃɔɪs bʌt tuː duː"}, {"g": "八年级上", "u": "Unit 8", "w": "run free", "p": "", "m": "四处自由走动", "se": "The dogs love to run free in the park.", "sz": "狗狗们喜欢在公园里自由地奔跑。", "st": 0, "ph": "rʌn friː"}, {"g": "八年级上", "u": "Unit 8", "w": "lie around", "p": "", "m": "懒散度日；游手好闲", "se": "He just lies around at home all weekend.", "sz": "他整个周末只是在家里游手好闲。", "st": 0, "ph": "laɪ əˈaʊnd"}, {"g": "八年级上", "u": "Unit 8", "w": "complain about", "p": "", "m": "抱怨", "se": "She often complains about the noise at night.", "sz": "她常常抱怨夜里的噪音。", "st": 0, "ph": "kəmˈpleɪn əˈbaʊt"}, {"g": "八年级上", "u": "Unit 8", "w": "in addition", "p": "", "m": "除……以外（还）", "se": "In addition, we need more time to finish it.", "sz": "除此以外，我们还需要更多时间来完成它。", "st": 0, "ph": "ɪn əˈdɪʃən"}, {"g": "八年级上", "u": "Unit 8", "w": "catch the eye of somebody", "p": "", "m": "引起某人的注意", "se": "The red dress caught the eye of the girl.", "sz": "那条红裙子引起了女孩的注意。", "st": 0, "ph": "kætʃ ðə aɪ ʌv ˈsʌmbɒdi"}, {"g": "八年级下", "u": "Unit 1", "w": "raise", "p": "v", "m": "筹募；增加；提高", "se": "We raised money for the children in need.", "sz": "我们为需要帮助的孩子们筹款。", "st": 0, "ph": "reɪz"}, {"g": "八年级下", "u": "Unit 1", "w": "permission", "p": "n", "m": "准许；批准", "se": "You must ask for permission before you leave.", "sz": "离开前你必须请求准许。", "st": 0, "ph": "pəˈmɪʃən"}, {"g": "八年级下", "u": "Unit 1", "w": "disabled", "p": "adj", "m": "丧失能力的；有残疾的", "se": "The new building has lifts for disabled people.", "sz": "新大楼为残疾人设有电梯。", "st": 0, "ph": "dɪˈseɪbəld"}, {"g": "八年级下", "u": "Unit 1", "w": "teenager", "p": "n", "m": "青少年", "se": "Many teenagers enjoy playing basketball after school.", "sz": "许多青少年喜欢放学后打篮球。", "st": 0, "ph": "ˈtiːneɪdʒə"}, {"g": "八年级下", "u": "Unit 1", "w": "offer", "p": "v", "m": "主动提出", "se": "He offered to carry the heavy box for me.", "sz": "他主动提出帮我搬这个重箱子。", "st": 0, "ph": "ˈɒfə"}, {"g": "八年级下", "u": "Unit 1", "w": "suffer", "p": "v", "m": "（因疾病等）受苦；受折磨", "se": "She suffers from a serious illness.", "sz": "她患有一种严重的疾病。", "st": 0, "ph": "ˈsʌfə"}, {"g": "八年级下", "u": "Unit 1", "w": "serious", "p": "adj", "m": "严重的", "se": "Luckily, his illness is not serious.", "sz": "幸运的是，他的病不严重。", "st": 0, "ph": "ˈsɪəriəs"}, {"g": "八年级下", "u": "Unit 1", "w": "illness", "p": "n", "m": "（某种）病", "se": "He missed school because of his illness.", "sz": "他因为生病没去上学。", "st": 0, "ph": "ˈɪlnəs"}, {"g": "八年级下", "u": "Unit 1", "w": "organize", ": "他们与许多国家建立了友好关系。", "st": 0, "ph": "set ʌp"}, {"g": "九年级下", "u": "Unit 1", "w": "set sail", "p": "", "m": "起航", "se": "The fleet set sail from Nanjing in 1405.", "sz": "船队于1405年从南京起航。", "st": 0, "ph": "set seɪl"}, {"g": "九年级下", "u": "Unit 1", "w": "(be) known as", "p": "", "m": "被称为", "se": "This road is known as the Silk Road.", "sz": "这条路被称为丝绸之路。", "st": 0, "ph": "(biː) nəʊn æz"}, {"g": "九年级下", "u": "Unit 1", "w": "as well as", "p": "", "m": "也；还", "se": "They carried tea as well as silk.", "sz": "他们运载丝绸，还运载茶叶。", "st": 0, "ph": "æz wel æz"}, {"g": "九年级下", "u": "Unit 1", "w": "lead to", "p": "", "m": "导致", "se": "The voyages led to the growth of trade.", "sz": "这些航行促进了贸易的增长。", "st": 0, "ph": "led tuː"}, {"g": "九年级下", "u": "Unit 1", "w": "compare ... with ...", "p": "", "m": "把……与……对比", "se": "Compare Zheng He's ships with Columbus's ships.", "sz": "把郑和的船和哥伦布的船作比较。", "st": 0, "ph": "kəmˈpeə ... wɪð ..."}, {"g": "九年级下", "u": "Unit 2", "w": "culture shock", "p": "n", "m": "文化冲击；文化休克", "se": "He felt culture shock when he first went abroad.", "sz": "他第一次出国时感受到了文化冲击。", "st": 0, "ph": "ˈkʌltʃə ʃɒk"}, {"g": "九年级下", "u": "Unit 2", "w": "camp", "p": "n", "m": "度假营", "se": "She spent two weeks at a summer camp in America.", "sz": "她在美国的夏令营待了两周。", "st": 0, "ph": "kæmp"}, {"g": "九年级下", "u": "Unit 2", "w": "firework", "p": "n", "m": "烟火；烟花", "se": "People set off fireworks on the Fourth of July.", "sz": "人们在七月四日燃放烟花。", "st": 1, "ph": "ˈfaɪəwɜːk"}, {"g": "九年级下", "u": "Unit 2", "w": "turkey", "p": "n", "m": "火鸡", "se": "Americans eat turkey at Thanksgiving.", "sz": "美国人在感恩节吃火鸡。", "st": 1, "ph": "ˈtɜːki"}, {"g": "九年级下", "u": "Unit 2", "w": "international", "p": "adj", "m": "国际的", "se": "Students from many countries joined the international camp.", "sz": "来自许多国家的学生参加了国际营。", "st": 0, "ph": "ˌɪntəˈnæʃənl"}, {"g": "九年级下", "u": "Unit 2", "w": "admit", "p": "v", "m": "（常指勉强）承认", "se": "He admitted that he missed home a lot.", "sz": "他承认自己非常想家。", "st": 0, "ph": "ədˈmɪt"}, {"g": "九年级下", function vToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function vDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function vStreak(){var days=[...new Set(LS.hist.map(function(r){return r.d;}))].sort();
  if(!days.length)return 0; if(vDiff(days[days.length-1],vToday())>1)return 0;
  var n=1; for(var i=days.length-1;i>0;i--){if(vDiff(days[i-1],days[i])===1)n++;else break;} return n;}
function learner(){return (localStorage.getItem('learnerName')||'').trim();}

/* ---------- 艾宾浩斯复习计划 ----------
   LS.learn[key] 旧格式是 1（只表示背过），新格式 {s:已通过轮次, nx:下次复习日期, d:上次日期}。
   旧数据按「s=0 且今天到期」读，老用户升级后不丢进度、当天就能开始排复习。 */
const EB_STEP=[1,2,4,7,15,30];   /* 第 s 轮答对后隔几天再见；走完 6 轮算牢记 */
const EB_LIMIT=40;               /* 一轮复习最多背多少个，避免积压几百词一次全上 */
function ebPlus(ds,n){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ebGet(k){var v=LS.learn[k];
  if(!v)return null;
  if(typeof v!=='object')return {s:0,nx:vToday(),d:''};
  return {s:v.s||0,nx:v.nx||vToday(),d:v.d||''};}
function ebSet(d,ok){
  var k=wkey(d),cur=ebGet(k);
  var s=ok?Math.min((cur?cur.s:0)+1,EB_STEP.length):0;
  LS.learn[k]={s:s,nx:ebPlus(vToday(),s===0?1:EB_STEP[s-1]),d:vToday()};
}
function ebStat(){
  var td=vToday(),tm=ebPlus(td,1),due=[],tomorrow=0,done=0,learning=0;
  DATA.forEach(function(d){
    var e=ebGet(wkey(d));if(!e)return;
    if(e.s>=EB_STEP.length){done++;}else{learning++;}
    if(e.nx<=td)due.push(d); else if(e.nx===tm)tomorrow++;
  });
  due.sort(function(a,b){return ebGet(wkey(a)).nx<ebGet(wkey(b)).nx?-1:1;});
  return {due:due,tomorrow:tomorrow,done:done,learning:learning};
}
function renderEb(){
  var s=ebStat(),box=document.getElementById('ebcard'),n=s.due.length;
  var head,sub;
  if(!s.learning&&!s.done){head='还没开始排复习';sub='背完第一组，这里就会按遗忘曲线安排复习：1 天 → 2 天 → 4 天 → 7 天 → 15 天 → 30 天';}
  else if(n){head='今天该复习 '+n+' 个词';sub=n>EB_LIMIT?('这轮先背 '+EB_LIMIT+' 个，剩下的背完再来一轮'):'趁还没忘干净，捞回来最省劲';}
  else if(s.tomorrow){head='今天没有到期的词 ✅';sub='明天有 '+s.tomorrow+' 个词到期，明天见';}
  else{head='今天没有到期的词 ✅';sub='想多练就照常选单元背，背过的会自动排进复习计划';}
  var html='<div class="label">🧠 艾宾浩斯复习计划</div>'+
    '<div class="ebtop"><span class="ebem">'+(n?'⏰':(s.learning||s.done)?'🌤':'🌱')+'</span>'+
    '<div style="flex:1;min-width:0"><b>'+head+'</b><span>'+sub+'</span></div></div>'+
    '<div class="ebmini"><div><b>'+n+'</b><span>今天到期</span></div>'+
    '<div><b>'+s.tomorrow+'</b><span>明天到期</span></div>'+
    '<div><b>'+s.learning+'</b><span>复习中</span></div>'+
    '<div><b>'+s.done+'</b><span>🏆 已牢记</span></div></div>';
  if(n)html+='<button class="ebbtn" onclick="startDue()">🧠 开始今日复习（'+Math.min(n,EB_LIMIT)+'）</button>';
  box.innerHTML=html;
  var dd=document.getElementById('dueDesc');
  if(dd)dd.textContent=n?('今天有 '+n+' 个词到期'):'今天没有到期的词';
}

function renderVStats(){
  var box=document.getElementById('vstats'),H=LS.hist,nm=learner();

  var st=vStreak(),totalW=H.reduce(function(s,r){return s+r.n;},0),bestRate=Math.max.apply(null,H.map(function(r){return r.rate;}));

    '<div><b>'+totalW+'</b><span>累计词数</span></div></div>';

  if(last.length>=2){html+='<div class="spark">'+last.map(function(r){

    '</div><div class="sparkcap">📈 最近 '+last.length+' 组的正确率（越高越好）</div>';}
  box.innerHTML=html;
}

function unitsOf(g){return [...new Set(DATA.filter(d=>d.g===g).map(d=>d.u))].sort((a,b)=>(+a.split(' ')[1])-(+b.split(' ')[1]));}
function wkey(d){return d.g+'|'+d.w+'|'+d.m;}
function cleanSpeak(w){return w.replace(/[.…]+/g,' ').replace(/\s+/g,' ').trim();}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function boldWord(en,w){
  if(!en)return'';
  en=esc(en);
  const base=w.replace(/[^a-zA-Z]/g,'');
  if(base.length>2){
    const stem=base.slice(0,Math.max(3,base.length-2));
    try{en=en.replace(new RegExp('\\b('+stem+'[a-zA-Z]*)','ig'),'<b>$1</b>');}catch(e){}
  }
  return en;
}

let ENVOICE=null;
function loadVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  if(!vs.length)return;
  const good=['Samantha','Alex','Ava','Allison','Daniel','Karen','Moira','Serena','Google US English','Google UK English Female','Google UK English Male','Microsoft Zira','Microsoft Aria','Microsoft David','Microsoft Guy'];
  ENVOICE = vs.find(v=>/^en[-_]?US/i.test(v.lang)&&good.some(g=>v.name.includes(g)))
        || vs.find(v=>/^en[-_]?GB/i.test(v.lang)&&good.some(g=>v.name.includes(g)))
        || vs.find(v=>/^en[-_]?US/i.test(v.lang))
        || vs.find(v=>/^en[-_]?GB/i.test(v.lang))
        || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis'in window){ loadVoice(); speechSynthesis.onvoiceschanged=loadVoice; }
if(/HarmonyOS|HUAWEI|HMSCore|HuaweiBrowser/i.test(navigator.userAgent))window.__noTTS=true;
function ttsFallback(txt){ /* 无本地英文语音引擎（如鸿蒙/华为浏览器）时用有道在线发音 */
  try{
    if(window.__ttsA){window.__ttsA.pause();}
    var a=new Audio('https://dict.youdao.com/dictvoice?type=2&audio='+encodeURIComponent(txt));
    a.playbackRate=LS.slow?0.7:1;
    window.__ttsA=a; a.play().catch(function(){});
  }catch(e){}
}
function speak(w){
  let txt=cleanSpeak(w);
  if(/^[A-Za-z]{2}$/.test(w)&&w[0].toLowerCase()===w[1].toLowerCase())txt=w[0].toUpperCase();
  if(window.__noTTS||!('speechSynthesis'in window)){ttsFallback(txt);return;}
  speechSynthesis.cancel();
  if(!ENVOICE)loadVoice();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='en-US'; if(ENVOICE)u.voice=ENVOICE;
  u.rate=LS.slow?0.55:0.72; u.pitch=1;
  let fired=false;
  u.onstart=function(){fired=true;};
  u.onerror=function(){if(!fired){fired=true;window.__noTTS=true;ttsFallback(txt);}};
  speechSynthesis.speak(u);
  setTimeout(function(){
    if(!fired){window.__noTTS=true;speechSynthesis.cancel();ttsFallback(txt);}
  },900);
}

function start(){
  const sel=LS.units[LS.grade]||[];
  mode=LS.mode;
  let pool;
  if(mode==='due'){ pool=ebStat().due.slice(0,EB_LIMIT);   /* 跨册取到期词，按到期日最早优先 */

  else if(mode==='review'){ pool=DATA.filter(d=>d.g===LS.grade&&LS.marked[wkey(d)]);
    if(pool.length===0){alert('这一册的错词本还是空的～\n先用其它方式背，拼错或点「不熟」的词会自动收进错词本');return;} }
  else { if(sel.length===0){alert('请先选至少一个单元');return;}
    pool=DATA.filter(d=>d.g===LS.grade&&sel.includes(d.u)); }
  if(mode==='spell'&&pool.some(d=>d.say)){alert('音标册用翻卡方式学习哦～拼写测试请选其他课本');return;}
  if(LS.shuffle) pool=shuffle(pool.slice());
  queue=pool;idx=0;right=0;wrong=0;skipped=0;
  document.getElementById('home').style.display='none';
  document.getElementById('study').style.display='block';
  window.scrollTo(0,0); render();
}

let WIX=null,PIX=null;
function buildIx(){
  if(WIX)return;
  WIX={};PIX=[];
  DATA.forEach(function(x){
    const k=x.w.toLowerCase();
    const m=x.m.replace(/^\[pl\.\]\s*/,'').replace(/\(.*?\)/g,'').split(/[\uff1b;\uff0c,]/)[0].trim();
    if(/[\s]/.test(x.w)){ if(/^[a-z' .]+$/i.test(x.w)&&x.w.length<26)PIX.push([k,m]); }
    else if(!WIX[k])WIX[k]=m;
  });
}
function glossOf(t){
  const lc=t.toLowerCase().replace(/^'+|'+$/g,'');
  if(MINI[lc])return MINI[lc];
  if(WIX[lc])return WIX[lc];
  if(BASE[lc])return BASE[lc];
  if(IRR[lc]){const b=IRR[lc];const g=WIX[b]||BASE[b]||MINI[b];if(g)return g+'\uff08'+b+' \u7684\u53d8\u5f62\uff09';}
  const tries=[];
  if(/ies$/.test(lc))tries.push([lc.slice(0,-3)+'y','\u590d\u6570']);
  if(/ing$/.test(lc)){tries.push([lc.slice(0,-3),'\u8fdb\u884c\u4e2d/\u52a8\u540d\u8bcd']);tries.push([lc.slice(0,-3)+'e','\u8fdb\u884c\u4e2d/\u52a8\u540d\u8bcd']);tries.push([lc.replace(/(.)\1ing$/,'$1'),'\u8fdb\u884c\u4e2d']);}
  if(/ied$/.test(lc))tries.push([lc.slice(0,-3)+'y','\u8fc7\u53bb\u5f0f']);
  if(/ed$/.test(lc)){tries.push([lc.slice(0,-2),'\u8fc7\u53bb\u5f0f']);tries.push([lc.slice(0,-1),'\u8fc7\u53bb\u5f0f']);}
  if(/es$/.test(lc))tries.push([lc.slice(0,-2),'\u590d\u6570/\u4e09\u5355']);
  if(/s$/.test(lc))tries.push([lc.slice(0,-1),'\u590d\u6570/\u4e09\u5355']);
  if(/er$/.test(lc))tries.push([lc.slice(0,-2),'\u6bd4\u8f83\u7ea7']);
  if(/est$/.test(lc))tries.push([lc.slice(0,-3),'\u6700\u9ad8\u7ea7']);
  if(/ly$/.test(lc))tries.push([lc.slice(0,-2),'\u526f\u8bcd']);
  for(const pr of tries){const g=WIX[pr[0]]||BASE[pr[0]]||MINI[pr[0]];if(g)return g+'\uff08'+pr[1]+'\uff09';}
  return null;
}
function toggleBreak(btn){
  const d=queue[idx];if(!d||!d.se)return;
  const box=btn.parentElement.nextElementSibling;
  if(box.style.display!=='none'){box.style.display='none';return;}
  buildIx();
  let html='';
  const lcse=' '+d.se.toLowerCase()+' ';
  PIX.forEach(function(pr){ if(lcse.indexOf(pr[0])>=0&&pr[0]!==d.w.toLowerCase())
    html+='<span class="bw">'+esc(pr[0])+' <i>'+esc(pr[1])+'</i></span>'; });
  d.se.split(/[^A-Za-z']+/).forEach(function(t){
    if(!t)return;
    const g=glossOf(t);

    else html+='<span class="bw dim">'+esc(t)+'</span>';
  });

}

  const d=queue[idx];if(mode==='zh2en'&&d)speak(d.say||d.w);}

function checkSpell(){
  if(spellState!=='input')return;
  const d=queue[idx],sp=document.getElementById('sp');
  const val=sp.value.trim().toLowerCase();
  if(!val){document.getElementById('sphint').textContent='先拼出单词，或点「不会，看答案」';return;}
  spellState='done';
  document.getElementById('spex').innerHTML=exBlock(d);
  const acts=document.getElementById('spacts');
  const __norm=function(t){return t.toLowerCase().replace(/[.。．]+$/,'').replace(/\s+/g,' ').trim();};
  const __ok=[__norm(d.w),__norm(d.w.replace(/\([^)]*\)/g,' ')),__norm(d.w.replace(/[()]/g,' '))].indexOf(__norm(val))>=0;
  if(__ok){ebSet(d,true);save();
    sp.classList.add('right');right++;
    delete LS.marked[wkey(d)];save();
    document.getElementById('sphint').innerHTML='✅ 正确！'+(d.ph?' <span style="color:#7b8894;font-weight:700">/'+esc(d.ph)+'/</span>':'');
    speak(d.w);
    acts.innerHTML='<button class="act yes wide" onclick="next()">下一个 →</button>';
    const myIdx=idx;
    setTimeout(function(){if(idx===myIdx)next();},(LS.ex&&d.se)?1800:1000);
  }else{
    sp.classList.add('wrong');wrong++;
    LS.marked[wkey(d)]=1;ebSet(d,false);save();
    document.getElementById('sphint').innerHTML=
      '❌ 正确拼写：<b style="color:var(--ok)">'+esc(d.w)+'</b>'+(d.ph?' <span style="color:#7b8894">/'+esc(d.ph)+'/</span>':'')+'<br>已记入错词本 🔖';
    speak(d.w);
    acts.innerHTML='<button class="act no wide" onclick="next()">下一个 →</button>';
  }
}
function spellGiveUp(){
  if(spellState!=='input')return;
  const d=queue[idx];
  spellState='done';skipped++;
  LS.marked[wkey(d)]=1;ebSet(d,false);save();
  document.getElementById('spex').innerHTML=exBlock(d);
  document.getElementById('sphint').innerHTML=
    '正确拼写：<b style="color:var(--ok)">'+esc(d.w)+'</b><br>已记入错词本 🔖';
  speak(d.w);
  document.getElementById('spacts').innerHTML=
    '<button class="act no wide" onclick="next()">下一个 →</button>';
}
function mark(){const d=queue[idx];LS.marked[wkey(d)]=1;ebSet(d,false);save();wrong++;next();}
function markKnow(){const d=queue[idx];delete LS.marked[wkey(d)];ebSet(d,true);save();right++;next();}
function next(){idx++;render();}
function updProgress(){
  document.querySelectorAll('.grade').forEach(function(el){
    const g=el.getAttribute('data-g');if(!g)return;
    const n=DATA.filter(d=>d.g===g).length;
    const k=Object.keys(LS.learn).filter(x=>x.indexOf(g+'|')===0).length;
    const c=el.querySelector('[data-role="cnt"]');
    if(c)c.textContent=k?('已背 '+Math.min(k,n)+' / '+n):(n+'词');
    const i=el.querySelector('.gp i');
    if(i)i.style.width=(n?Math.min(100,Math.round(k/n*100)):0)+'%';
  });
}

function done(){
  updProgress();
  document.getElementById('bar').style.width='100%';
  const total=queue.length;
  const perfect = total>0 && right===total;
  const markedCount=Object.keys(LS.marked).filter(k=>k.indexOf(LS.grade+'|')===0).length;
  const rate=total>0?Math.round(right/total*100):0;
  let recs=[];
  if(total>0){
    const prevBest=LS.hist.length?Math.max.apply(null,LS.hist.map(function(r){return r.rate;})):null;
    const lastRate=LS.hist.length?LS.hist[LS.hist.length-1].rate:null;
    LS.hist.push({d:vToday(),mode:mode,n:total,ok:right,rate:rate});
    LS.tot=(LS.tot||0)+total;
    if(LS.hist.length>300)LS.hist=LS.hist.slice(-300);
    save();
    const st=vStreak();
    if(prevBest===null)recs.push('🏁 第一组完成！以后每组都跟这次比');
    else{ if(rate>prevBest)recs.push('🎉 新纪录！这轮正确率 '+rate+'%（之前最好 '+prevBest+'%）');
      else if(lastRate!==null&&rate>lastRate)recs.push('📈 比上一组进步了 '+(rate-lastRate)+' 个百分点'); }
    if(st>=2)recs.push('🔥 已经连续背了 '+st+' 天，别断哦');
  }
  const ebs=ebStat();
  if(ebs.due.length)recs.push('🧠 复习计划：今天还有 '+ebs.due.length+' 个词到期');
  else if(ebs.tomorrow)recs.push('🧠 复习计划：明天有 '+ebs.tomorrow+' 个词到期，明天见');
  else if(mode==='due')recs.push('🧠 今天的复习全部清空，干得漂亮 ✅');
  let head, em;
  if(total===0){em='📖';head='这轮没有单词';}
  else if(perfect){em='🎉';head='全部搞定！太棒了';}
  else if(right>0){em='💪';head='这轮完成';}
  else{em='📖';head='这轮完成（都没答对，别急，再来一遍）';}
  let statHtml=
    '<div><b style="color:var(--ok)">'+right+'</b><span>记住 / 拼对</span></div>'+
    '<div><b style="color:var(--bad)">'+wrong+'</b><span>不熟 / 拼错</span></div>';
  if(skipped)statHtml+='<div><b style="color:var(--sub)">'+skipped+'</b><span>跳过没答</span></div>';
  document.getElementById('stage').innerHTML=
    '<div class="card done">'+
      '<div class="em">'+em+'</div>'+
      '<h2>'+head+'</h2>'+
      '<div class="stat">'+statHtml+'</div>'+
      '<p>'+LS.grade+' 错词本里现在有 <b>'+markedCount+'</b> 个词</p>'+
      (recs.length?'<div class="rec">'+recs.join('<br>')+'</div>':'')+
      '<div style="margin-top:18px;display:grid;gap:10px">'+
        (ebs.due.length?'<button class="btn" onclick="startDue()">🧠 继续复习到期词（'+Math.min(ebs.due.length,EB_LIMIT)+'）</button>':'')+
        (markedCount?'<button class="btn'+(ebs.due.length?' ghost':'')+'" onclick="reviewMarked()">🔖 立即复习错词本</button>':'')+
        '<button class="btn ghost" onclick="goHome()">返回首页</button>'+
      '</div>'+
    '</div>';
}
function reviewMarked(){mode='review';
  let pool=DATA.filter(d=>d.g===LS.grade&&LS.marked[wkey(d)]);
  if(!pool.length){goHome();return;}
  if(LS.shuffle)pool=shuffle(pool.slice());
  queue=pool;idx=0;right=0;wrong=0;skipped=0;render();}

renderWrong();renderVStats();renderEb();
</script>
